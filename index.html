      <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:12px;">
        <div style="width:240px; flex-shrink:0;">
          <div style="aspect-ratio:4/5; background:rgba(255,255,255,.04); border-radius:14px; display:flex; align-items:center;">
            ${chara}
          </div>
          <div style="font-size:12px; color:var(--gray); text-align:center; margin-top:6px;">
            ${Object.entries(eq).filter(([_,v])=>v && v!=="none"&&v!=="shoes_default"&&v!=="seragam_default").map(([k,v]) => `${CATALOG_LABELS[k]}: ${CATALOG[k]?.[v]?.nama||v}`).join(" · ") || "Belum ada item dipakai"}
          </div>
        </div>
        <div style="flex:1; min-width:280px;">
          ${Object.keys(CATALOG).map(kat => {
            const items = inv.filter(id => CATALOG[kat][id]);
            if (!items.length) return "";
            return `
              <h3>${CATALOG_LABELS[kat]}</h3>
              <div class="grid grid-3">
                ${items.map(id => {
                  const it = CATALOG[kat][id];
                  const isEq = eq[kat] === id;
                  const prevCh = renderCharacter({ ...DEFAULT_EQUIPPED, [kat]: id });
                  return `<div class="item-card owned ${isEq?'equipped':''}" onclick="equipThenWardrobe('${kat}','${id}')">
                    <div class="icon-wrap">${prevCh}</div>
                    <div class="nama">${it.nama}</div>
                    <div class="harga">${isEq?"✓ Dipakai":"Klik pakai"}</div>
                  </div>`;
                }).join("")}
                ${kat === "rambut" ? `<div class="item-card ${!eq.rambut?'equipped':''}" onclick="equipThenWardrobe('rambut',null)">
                  <div class="icon-wrap">${renderCharacter({...DEFAULT_EQUIPPED, rambut:null})}</div>
                  <div class="nama">Botak (Default)</div>
                  <div class="harga">${!eq.rambut?"✓ Dipakai":"Klik pakai"}</div>
                </div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      </div>
    </div>
  `;
}
window.equipThenWardrobe = async (kat, id) => {
  if (!state.user) return toast("Login dulu");
  await FB.equipItem(kat, id);
  toast("✓ Dipakai");
  route("wardrobe");
};

/* ========== MISI HARIAN ========== */
async function renderMisiHarian(){
  if (!state.user) return `<div class="panel"><h2>🎯 Misi Harian</h2><div class="empty"><div class="emoji">🔒</div>Login dulu untuk misi harian.</div></div>`;
  const misi = await FB.getMisiHariIni();
  return `
    <div class="panel">
      <h2>🎯 Misi Harian</h2>
      <p style="color:var(--gray); font-size:13px;">Reset tiap hari pukul 00:00 WIB.</p>
      <div class="hub-grid" style="margin-top:12px;">
        ${misi.misi.map(m => {
          const done = m.progres >= m.target;
          const claimed = misi.claimed.includes(m.id);
          return `
            <div class="hub-card">
              <div class="ico">${claimed?"🏆":done?"✅":"🎯"}</div>
              <div class="info" style="flex:1;">
                <div class="ttl">${m.nama}</div>
                <div class="sub">Progres: ${m.progres || 0} / ${m.target} · +${m.reward_xp} XP +${m.reward_koin} 🪙</div>
                <div class="xp-bar" style="margin-top:4px;"><div class="xp-fill" style="width:${Math.min(100,(m.progres||0)/m.target*100)}%"></div></div>
              </div>
              ${done && !claimed ? `<button class="btn gold" onclick="claimMisi('${m.id}')">Klaim</button>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}
window.claimMisi = async (id) => {
  const m = await FB.claimMisi(id, state.level);
  await loadGami();
  updateChips();
  toast(`🎉 +${m.reward_xp} XP · +${m.reward_koin} 🪙`);
  route("misi");
};

/* ========== PROFILE ========== */
async function renderProfile(){
  const akses = state.siswa?.aksesLevel || {};
  const nama = state.siswa?.nama || "Tamu";

  // Load gami all levels
  const allGami = {};
  if (state.user) {
    for (const lvl of ["n5","n4","n3","n2","n1"]) {
      allGami[lvl] = await FB.getGami(lvl);
    }
  }

  // Nilai history
  const riwayat = state.user ? await FB.listNilai(10) : [];

  return `
    <div class="panel">
      <h2>👤 Profil</h2>
      <h3>${nama}</h3>
      <p style="color:var(--gray); font-size:13px;">${state.user?.email || "Tamu"} ${state.siswa?.kelas ? `· Kelas ${state.siswa.kelas}` : ""}</p>

      <h3>Pengaturan</h3>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px; background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:10px; margin-bottom:12px;">
        <input type="checkbox" ${isAutoPlayAudio()?'checked':''} onchange="setAutoPlayAudio(this.checked)" style="width:20px; height:20px;"/>
        <span style="flex:1;"><b>🔊 Auto-play audio Jepang</b><br><small style="color:var(--gray);">Pelafalan diputar otomatis setelah kamu rate flashcard</small></span>
      </label>

      <h3>Progres per Level</h3>
      <div class="grid grid-5" style="grid-template-columns:repeat(5,1fr); gap:8px;">
        ${["n5","n4","n3","n2","n1"].map(lvl => {
          const g = allGami[lvl] || { xp:0, koin:0, level_karakter:1 };
          const unlocked = akses[lvl] || FB.userIsGuru();
          return `<div class="card" style="text-align:center; cursor:default;">
            <div style="font-weight:800;">${lvl.toUpperCase()}</div>
            <div style="color:${unlocked?'var(--pink)':'var(--gray-dim)'}; font-size:11px;">${unlocked?'Terbuka':'🔒'}</div>
            <div style="font-size:11px; color:var(--gray); margin-top:6px;">Lv ${g.level_karakter} · ${g.xp} XP</div>
          </div>`;
        }).join("")}
      </div>

      <h3>Riwayat Ujian</h3>
      ${riwayat.length ? riwayat.map(r => `
        <div class="contoh-item">
          <div>${r.kategoriId}</div>
          <div class="id">${r.skor}/100 (${r.benar} benar)</div>
        </div>
      `).join("") : '<div class="empty">Belum ada riwayat ujian.</div>'}

      ${state.user ? `<button class="btn ghost danger" style="margin-top:16px;" onclick="logout()">Keluar</button>` : ""}
    </div>
  `;
}
window.logout = async () => {
  await FB.keluar();
  state.user = null; state.siswa = null;
  toast("Dadah 👋");
  route("home");
};

/* ========== ACHIEVEMENTS ========== */
async function renderAchievements(){
  // Compute status
  const ach = state.user?.achievements || JSON.parse(localStorage.getItem("shirose-ach") || "[]");
  const stats = {
    user: state.user,
    equipped: state.siswa?.karakter?.equipped || {},
    inventory_count_pakaian: (state.siswa?.karakter?.inventory || []).filter(id => CATALOG.pakaian[id]).length,
    total_benar: 0,
    total_ujian: 0,
    ada_nilai_perfect: false,
    streak: state.gami.streak || 0,
    level_karakter: state.gami.level_karakter || 1,
    total_koin: state.gami.koin || 0,
    level_dipelajari: 1,
  };
  return `
    <div class="panel">
      <h2>🏅 Achievement</h2>
      <div class="grid grid-2">
        ${ACHIEVEMENTS.map(a => {
          const got = a.syarat(stats);
          return `
            <div class="card" style="cursor:default; opacity:${got?1:0.5};">
              <div class="title">${got?"🏆":"🔒"} ${a.nama}</div>
              <div class="desc">${a.desc}</div>
              <div class="meta-row"><span>${got?"Diraih":"Belum"}</span><span>+${a.reward_koin} 🪙</span></div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

/* ========== LEADERBOARD ========== */
async function renderLeaderboard(){
  if (!state.user) return `<div class="panel"><h2>🏆 Leaderboard</h2><div class="empty"><div class="emoji">🔒</div>Login dulu untuk lihat ranking.</div></div>`;
  const list = await FB.leaderboard(state.level, 20);
  return `
    <div class="panel">
      <h2>🏆 Leaderboard ${state.level.toUpperCase()}</h2>
      ${list.length ? `
        <div class="grid">
          ${list.map((u, i) => `
            <div class="contoh-item" style="align-items:center;">
              <div style="font-size:24px; font-weight:800; color:${i===0?'var(--gold)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--gray)'};">#${i+1}</div>
              <div style="flex:1; font-weight:700;">${u.nama}</div>
              <div class="id">Lv ${u.level_karakter||1} · ${u.xp||0} XP</div>
            </div>

/* ========== AUTH STATE ========== */
FB.onAuth(async (user, siswa) => {
  state.user = user; state.siswa = siswa;
  const btn = document.getElementById("btn-auth");
  if (user) {
    btn.innerHTML = `👋 ${siswa?.nama || user.email.split("@")[0]}`;
    btn.onclick = () => route("profile");
    document.getElementById("guru-link").classList.toggle("hidden", !FB.userIsGuru());
  } else {
    btn.innerHTML = "🔑 Masuk";
    btn.onclick = showAuthModal;
    document.getElementById("guru-link").classList.add("hidden");
  }
  // Snap to an allowed level before loading gami / rendering routes
  if (user && siswa) enforceLevelAccess();
  await loadGami();
  renderLevelPills();
  updateChips();
  route(location.hash.slice(1) || "home");
});

/* ========== INIT ========== */
renderLevelPills();
updateChips();
window.addEventListener("hashchange", () => route(location.hash.slice(1) || "home"));

// Register SW
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* ========== PWA INSTALL ========== */
let _deferredInstallPrompt = null;
const _installBtn = document.getElementById("btn-install");

function _isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true
    || document.referrer.startsWith("android-app://");
}
function _isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Android & Chrome: catch deferred prompt
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  if (!_isStandalone() && _installBtn) _installBtn.classList.add("visible");
});

// Hide button after install
window.addEventListener("appinstalled", () => {
  _deferredInstallPrompt = null;
  if (_installBtn) _installBtn.classList.remove("visible");
  if (typeof toast === "function") toast("✓ SHIROSE NIHONGO terinstal");
});

// iOS Safari has no beforeinstallprompt — show button so user can see the manual guide
if (_isIOS() && !_isStandalone() && _installBtn){
  _installBtn.classList.add("visible");
}

// Entry point from the UI button
window.handleInstallClick = async () => {
  if (_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    const choice = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if (choice && choice.outcome === "accepted"){
      if (_installBtn) _installBtn.classList.remove("visible");
    }
    return;
  }
  if (_isIOS()){ showIOSInstallModal(); return; }
  // Fallback hint when no prompt is available (desktop Chrome already installed, Firefox, etc.)
  toast("Buka menu browser → Install / Add to Home Screen");
};

window.showIOSInstallModal = () => {
  const html = `
    <div class="ios-install-modal" id="ios-install-modal" onclick="if(event.target===this) closeIOSInstall()">
      <div class="card">
        <h3>📲 Install di iPhone / iPad</h3>
        <p style="font-size:14px; color:var(--gray); margin-bottom:12px;">
          Safari tidak punya tombol install otomatis, tapi caranya mudah:
        </p>
        <ol>
          <li>Tekan tombol <b class="shareicon">⬆️ Share</b> di toolbar Safari (biasanya di bawah).</li>
          <li>Scroll di menu Share, lalu pilih <b>"Add to Home Screen"</b> / <b>"Tambahkan ke Layar Utama"</b>.</li>
          <li>Tekan <b>Add</b> di kanan atas. Icon SHIROSE NIHONGO akan muncul di home screen.</li>
          <li>Buka aplikasi dari icon tersebut — akan berjalan fullscreen tanpa browser bar.</li>
        </ol>
        <button class="btn" onclick="closeIOSInstall()">OK, mengerti</button>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
};
window.closeIOSInstall = () => {
  const m = document.getElementById("ios-install-modal");
  if (m) m.remove();
};
</script>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SHIROSE NIHONGO — Learn Japanese. Track Your Progress. Build Your Future.</title>
<meta name="description" content="SHIROSE NIHONGO by SSW no Ou — Platform belajar bahasa Jepang JLPT N5-N1."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SHIROSE"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#161b36"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" href="./icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#161b36; --navy-2:#1f2650; --navy-3:#2a3270; --navy-4:#0d1024;
  --pink:#ef6a9a; --pink-light:#f58bb0; --pink-dark:#c8325a;
  --gold:#ffd700; --purple:#8b5cf6; --cyan:#22d3ee; --green:#10b981;
  --red:#ef4444; --orange:#f59e0b;
  --white:#ffffff; --off:#f6f4fa; --gray:#b9bfd9; --gray-dim:#7a80a0;
  --border:#2a3060; --border-light:#3a4080;
  --font-jp:'Shippori Mincho B1', 'Noto Serif JP', serif;
  --font-sans:'Zen Kaku Gothic New', 'Inter', system-ui, -apple-system, sans-serif;
  --shadow-glow: 0 0 30px rgba(239,106,154,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  color:var(--white);
  background:
    radial-gradient(ellipse at 20% 30%, rgba(139,92,246,.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(239,106,154,.15) 0%, transparent 50%),
    linear-gradient(to bottom, var(--navy-4), var(--navy));
  min-height:100vh;
  overflow-x:hidden;
}
@media (max-width:768px){ body{font-size:15px;} }
@media (max-width:640px){
  body{font-size:16px;}
  h1{font-size:24px;}
  h2{font-size:20px;}
  h3{font-size:17px;}
  p{font-size:15px;}
  .panel{padding:16px 14px;}
}

/* ========== Mobile safe-area + touch targets ========== */
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
@media (max-width:640px){
  .btn{min-height:44px; padding:10px 16px; font-size:14px;}
  .btn.sm{min-height:36px; padding:6px 12px; font-size:12px;}
  .chip{min-height:36px;}
  input, select, textarea{min-height:44px; font-size:16px;} /* 16px prevents iOS zoom on focus */
  .opsi{min-height:52px; padding:14px 16px; font-size:15px;}
  table{font-size:13px;}
}
/* Hide scrollbars on horizontal carousels on mobile */
.hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.hscroll::-webkit-scrollbar{display:none;}
.hscroll > *{scroll-snap-align:start; flex:0 0 auto;}

/* ========== PWA INSTALL BUTTON + iOS modal ========== */
.install-btn{
  display:none; align-items:center; gap:6px;
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  border:none; padding:8px 14px; border-radius:999px;
  font-weight:800; font-size:12px; cursor:pointer; transition:all .2s;
  box-shadow:0 2px 12px rgba(16,185,129,.4);
}
.install-btn:hover{transform:translateY(-1px); box-shadow:0 4px 18px rgba(16,185,129,.6);}
.install-btn.visible{display:inline-flex;}
.install-btn::before{content:"⬇️";}
.ios-install-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.ios-install-modal .card{
  background:var(--navy-2); border:1px solid var(--border);
  border-radius:16px; padding:24px; max-width:420px; width:100%;
  color:var(--white);
}
.ios-install-modal h3{margin-bottom:12px; color:var(--pink);}
.ios-install-modal ol{margin:12px 0 16px 20px; line-height:1.8;}
.ios-install-modal .shareicon{
  display:inline-block; vertical-align:middle;
  color:#0a84ff; font-size:18px;
}

/* ========== TOP BAR ========== */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:12px; padding:10px 16px;
  background:rgba(13,16,36,.85); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex; align-items:center; gap:8px; font-family:var(--font-jp); font-weight:800; font-size:18px;
  color:var(--white); text-decoration:none;
}
.brand .rose{color:var(--pink); font-size:22px;}
.topbar-right{margin-left:auto; display:flex; gap:8px; align-items:center;}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px;
  background:rgba(255,255,255,.08); border:1px solid var(--border);
  font-size:12px; font-weight:600; color:var(--white);
  cursor:pointer; transition:all .2s;
}
.chip:hover{background:rgba(255,255,255,.12); border-color:var(--pink);}
.chip.active{background:var(--pink); border-color:var(--pink); color:white;}
.chip .badge{background:var(--gold); color:#2a1810; font-size:10px; padding:2px 6px; border-radius:999px; font-weight:800;}
.chip .coin::before{content:"🪙"; margin-right:2px;}
.chip .lv::before{content:"⭐"; margin-right:2px;}
.chip .streak::before{content:"🔥"; margin-right:2px;}
.btn{
  background:var(--pink); color:white; border:none; padding:8px 16px; border-radius:8px;
  font-weight:700; cursor:pointer; font-family:var(--font-sans); font-size:13px;
  transition:all .15s; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--pink-dark); transform:translateY(-1px); box-shadow:var(--shadow-glow);}
.btn.ghost{background:transparent; border:1px solid var(--border);}
.btn.ghost:hover{background:rgba(255,255,255,.06);}
.btn.danger{background:var(--red);}
.btn.gold{background:var(--gold); color:#2a1810;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

/* ========== LEVEL PILL ========== */
.lvl-pill-group{display:flex; gap:4px; background:rgba(255,255,255,.05); padding:4px; border-radius:999px;}
.lvl-pill{
  padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800; cursor:pointer;
  border:none; background:transparent; color:var(--gray); transition:all .15s;
  min-width:30px;
}
.lvl-pill:hover{color:var(--white);}
.lvl-pill.active{background:var(--pink); color:white;}
.lvl-pill.locked{color:#555; cursor:not-allowed;}

/* ========== MAIN LAYOUT ========== */
.app{
  max-width:1400px; margin:0 auto; padding:16px;
  display:grid; grid-template-columns:1fr; gap:16px;
}
@media (min-width:1024px){
  .app.has-sidepanel{grid-template-columns:360px 1fr;}
}

/* ========== RPG DASHBOARD HOME ========== */
.rpg-stage{
  position:relative;
  min-height:600px;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(139,92,246,.1), transparent 70%);
  border-radius:24px;
}
@media (max-width:768px){ .rpg-stage{min-height:500px;} }

.chara-wrap{
  position:relative; width:280px; height:400px;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}
@media (max-width:640px){ .chara-wrap{width:220px; height:320px;} }
.chara-wrap svg{width:100%; height:100%;}

/* Orbital nav ring */
.orbit{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:600px; height:600px; pointer-events:none;
  animation: orbitSpin 60s linear infinite;
}
@media (max-width:768px){ .orbit{width:450px; height:450px;} }
@media (max-width:480px){ .orbit{width:340px; height:340px;} }
@keyframes orbitSpin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
.orbit svg{width:100%; height:100%; stroke:var(--border); stroke-width:1; fill:none; opacity:.4;}

.orbit-node{
  position:absolute; top:50%; left:50%;
  width:88px; height:88px; margin:-44px 0 0 -44px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg, rgba(31,38,80,.95), rgba(13,16,36,.95));
  border:2px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  transition:all .2s; pointer-events:auto; z-index:3;
  color:var(--white); text-align:center;
  animation: orbitNodeCounter 60s linear infinite;
}
@keyframes orbitNodeCounter{ from{rotate:0deg;} to{rotate:-360deg;} }
@media (max-width:640px){ .orbit-node{width:68px; height:68px; margin:-34px 0 0 -34px;} }
.orbit-node:hover{
  border-color:var(--pink); box-shadow:0 0 20px rgba(239,106,154,.6);
  transform:scale(1.1);
}
.orbit-node .ico{font-size:22px;}
.orbit-node .lbl{font-size:10px; font-weight:700; letter-spacing:.3px;}
@media (max-width:640px){ .orbit-node .ico{font-size:18px;} .orbit-node .lbl{font-size:9px;} }

/* ========== PANEL (right column) ========== */
.panel{
  background:linear-gradient(180deg, var(--navy-2), var(--navy));
  border:1px solid var(--border); border-radius:20px; padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.panel h2{font-family:var(--font-jp); font-size:22px; margin-bottom:12px; color:var(--pink-light); font-weight:800;}
.panel h3{font-size:16px; margin:16px 0 8px; color:var(--white); font-weight:700;}
.panel-close{float:right; background:transparent; border:none; color:var(--gray); font-size:24px; cursor:pointer; padding:0;}
.panel-close:hover{color:var(--pink);}

/* ========== HERO BAR (under topbar) ========== */
.herobar{
  display:flex; gap:12px; align-items:center;
  background:linear-gradient(90deg, rgba(31,38,80,.6), rgba(13,16,36,.3));
  border:1px solid var(--border); border-radius:16px;
  padding:12px 16px;
}
.herobar .avatar-mini{
  width:50px; height:50px; border-radius:50%;
  background:linear-gradient(135deg, var(--navy-3), var(--navy-2));
  border:2px solid var(--pink); display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.herobar .info{flex:1; min-width:0;}
.herobar .info .nama{font-weight:800; font-size:14px;}
.herobar .info .meta{font-size:11px; color:var(--gray); margin-top:2px;}
.xp-bar{
  width:100%; height:8px; background:var(--navy-4); border-radius:4px; overflow:hidden; margin-top:6px;
}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--pink), var(--gold)); transition:width .3s;}

/* ========== CARDS ========== */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }

.card{
  background:linear-gradient(135deg, rgba(42,50,112,.4), rgba(31,38,80,.6));
  border:1px solid var(--border); border-radius:14px; padding:14px;
  transition:all .2s; cursor:pointer;
}
.card:hover{border-color:var(--pink); transform:translateY(-2px); box-shadow:0 10px 20px rgba(239,106,154,.2);}
.card .title{font-weight:800; font-size:14px; margin-bottom:4px;}
.card .desc{font-size:11px; color:var(--gray); line-height:1.4;}
.card .meta-row{display:flex; justify-content:space-between; margin-top:10px; font-size:11px;}

/* ========== Shop/Inventory item card ========== */
.item-card{
  position:relative;
  background:linear-gradient(145deg, rgba(42,50,112,.5), rgba(31,38,80,.7));
  border:2px solid var(--border); border-radius:12px;
  padding:8px; cursor:pointer; transition:all .15s;
  text-align:center;
}
.item-card:hover{border-color:var(--pink); transform:translateY(-3px);}
.item-card.owned{border-color:var(--green);}
.item-card.equipped{border-color:var(--gold); background:linear-gradient(145deg, rgba(255,215,0,.15), rgba(31,38,80,.7));}
.item-card.locked{opacity:.5; cursor:not-allowed;}
.item-card .icon-wrap{
  height:100px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
}
.item-card .icon-wrap svg{height:100%; width:auto;}
.item-card .nama{font-size:12px; font-weight:700; margin-top:4px; line-height:1.2;}
.item-card .harga{font-size:11px; color:var(--gold); margin-top:2px;}
.item-card .badge-rarity{
  position:absolute; top:4px; right:4px; font-size:9px; padding:2px 5px; border-radius:4px;
  font-weight:800; text-transform:uppercase; letter-spacing:.5px;
}
.rarity-common{background:#555;}
.rarity-uncommon{background:#10b981;}
.rarity-rare{background:#3b82f6;}
.rarity-legendary{background:#f59e0b; color:#2a1810;}
.rarity-mythic{background:linear-gradient(90deg, #ef6a9a, #8b5cf6); color:white;}

/* ========== Materi (kosakata/kanji/bunpou) ========== */
.search-bar{
  display:flex; gap:8px; margin-bottom:12px;
}
.search-bar input{
  flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-size:14px; font-family:var(--font-sans);
}
.search-bar input:focus{outline:none; border-color:var(--pink);}
.materi-list{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));}
.materi-item{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:10px;
  padding:12px; cursor:pointer; position:relative;
}
.materi-item:hover{border-color:var(--pink);}
.materi-item .no-badge{
  position:absolute; top:8px; right:10px;
  font-family:var(--font-sans); font-size:10px; font-weight:700;
  color:var(--gray-dim); letter-spacing:.5px;
}
.materi-item .kanji{font-family:var(--font-jp); font-size:28px; font-weight:800; color:var(--pink-light);}
.materi-item .reading{font-size:13px; color:var(--gray); margin-top:2px;}
.materi-item .meaning{font-size:13px; margin-top:4px;}
.no-pill{
  display:inline-block; padding:3px 10px; border-radius:999px;
  background:rgba(239,106,154,.14); color:var(--pink-light);
  font-family:var(--font-sans); font-size:11px; font-weight:700;
  letter-spacing:.8px; margin-bottom:8px;
}

/* ========== HAFALAN selection + session ========== */
.haf-topbar{
  display:flex; justify-content:space-between; align-items:center;
  gap:8px; margin-bottom:10px;
}
.haf-type-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
@media (max-width:640px){ .haf-type-row{grid-template-columns:1fr;} }
.haf-pick{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px; cursor:pointer; color:var(--white); text-align:left;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-pick:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-pick.on{border-color:var(--pink); background:rgba(239,106,154,.14); box-shadow:0 0 12px rgba(239,106,154,.25);}
.haf-pick .lbl{font-weight:800; font-size:15px;}
.haf-pick .sub{font-size:12px; color:var(--gray); margin-top:2px;}

.haf-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.haf-chip{
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,.05); border:1px solid var(--border);
  color:var(--gray); font-weight:700; font-size:12px; cursor:pointer;
  transition:all .15s; min-height:36px;
}
.haf-chip:hover{color:var(--white); border-color:var(--pink-light);}
.haf-chip.on{background:var(--pink); border-color:var(--pink); color:white;}

.haf-mode-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
@media (max-width:640px){ .haf-mode-row{grid-template-columns:1fr;} }
.haf-mode{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px 12px; cursor:pointer; color:var(--white); text-align:center;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-mode .ico{font-size:28px; margin-bottom:4px;}
.haf-mode .lbl{font-weight:800; font-size:14px;}
.haf-mode .sub{font-size:11px; color:var(--gray); margin-top:2px;}
.haf-mode:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-mode.on{border-color:var(--gold); background:rgba(255,215,0,.08); box-shadow:0 0 14px rgba(255,215,0,.25);}

/* Matching grid */
.match-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:12px;
}
.match-col{display:flex; flex-direction:column; gap:8px;}
.match-item{
  position:relative; background:rgba(42,50,112,.4); border:1px solid var(--border);
  border-radius:10px; padding:12px; text-align:left; color:var(--white); cursor:pointer;
  font-family:var(--font-sans); transition:all .15s; min-height:60px;
}
.match-item:disabled{opacity:.4; cursor:default;}
.match-item .jp{font-family:var(--font-jp); font-size:22px; font-weight:800; color:var(--pink-light);}
.match-item .rd{font-size:11px; color:var(--gray); margin-top:2px;}
.match-item .id{font-size:14px; line-height:1.4;}
.match-item:hover:not(:disabled){border-color:var(--pink);}
.match-item.picked{border-color:var(--gold); background:rgba(255,215,0,.1);}
.match-item.match-ok{border-color:var(--green); background:rgba(16,185,129,.15); color:var(--green);}
.match-item.match-bad{border-color:var(--red); background:rgba(239,68,68,.15); animation:shakeX .3s;}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Multiple choice feedback */
.opsi.opsi-ok{border-color:var(--green); background:rgba(16,185,129,.18);}
.opsi.opsi-bad{border-color:var(--red); background:rgba(239,68,68,.18);}

/* ========== HAFALAN: status legend + preview list ========== */
.status-legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px;}
.stat-pill{
  display:inline-flex; align-items:center;
  padding:5px 10px; border-radius:999px;
  font-size:12px; font-weight:700;
}
.status-preview{
  margin:8px 0 12px; border:1px solid var(--border); border-radius:12px;
  background:rgba(13,16,36,.4); overflow:hidden;
}
.status-preview summary{
  padding:10px 14px; cursor:pointer; user-select:none;
  background:rgba(255,255,255,.04); font-size:13px;
}
.status-preview[open] summary{border-bottom:1px solid var(--border);}
.status-list{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:6px; padding:10px; max-height:340px; overflow-y:auto;
}
.status-item{
  position:relative;
  display:grid; grid-template-columns:auto 1fr auto; gap:8px;
  align-items:center;
  padding:10px 12px; border-radius:10px; border:1px solid;
  font-family:var(--font-sans);
}
.status-item .status-jp{
  font-family:var(--font-jp); font-weight:800; font-size:20px;
  color:var(--pink-light); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.status-item .status-mean{
  grid-column:1/-1; font-size:12px; color:var(--gray); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:1; -webkit-box-orient:vertical;
}
.status-item .no-badge{position:static; font-size:10px;}
.status-item .status-chip{
  padding:3px 8px; border-radius:999px; border:1px solid;
  font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  white-space:nowrap;
}
@media (max-width:640px){
  .status-list{grid-template-columns:1fr; max-height:260px;}
}

/* ========== FLASHCARD v2 — front-only until tap, then reveal ========== */
.flash-stage{
  position:relative; min-height:440px;
  display:flex; align-items:center; justify-content:center;
  margin:8px 0 16px; overflow:visible;
  user-select:none; -webkit-user-select:none; touch-action:pan-y;
}
.flash-card{
  position:relative; width:100%; max-width:480px; min-height:380px;
  background:linear-gradient(160deg, rgba(42,50,112,.85), rgba(22,27,54,.85));
  border:1px solid var(--border); border-radius:20px;
  padding:28px 20px; text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, opacity .25s ease;
  cursor:pointer;
  will-change:transform, opacity;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.flash-card .front{
  font-family:var(--font-jp); font-weight:800;
  font-size:110px; line-height:1.1; color:var(--pink-light);
  margin:14px 0 10px; word-break:break-all;
}
@media (max-width:640px){ .flash-card .front{font-size:90px;} }
.flash-card .reading{
  display:inline-block; padding:6px 14px; border-radius:999px;
  background:rgba(42,50,112,.6); color:var(--white);
  font-family:var(--font-jp); font-size:22px; margin:6px 0 12px;
}
.flash-card .arti{
  font-size:20px; font-weight:700; color:var(--white);
  line-height:1.4; margin-top:6px;
}
.flash-card .contoh{
  font-size:14px; color:var(--gray); margin-top:12px;
  padding:10px; background:rgba(255,255,255,.04); border-radius:10px;
  text-align:left;
}
.flash-card .tap-hint{
  margin-top:18px; font-size:13px; color:var(--gray-dim);
  letter-spacing:.3px;
  animation:fadeHint 1.6s ease-in-out infinite;
}
@keyframes fadeHint{0%,100%{opacity:.4}50%{opacity:.9}}
/* Reveal state: back face slides in */
.flash-card .back-face{display:none;}
.flash-card.revealed .back-face{display:block; animation:revealFade .25s ease-out;}
.flash-card.revealed .front{font-size:72px; margin-top:0;}
@media (max-width:640px){ .flash-card.revealed .front{font-size:58px;} }
.flash-card.revealed .tap-hint{display:none;}
@keyframes revealFade{0%{opacity:0; transform:translateY(8px)}100%{opacity:1; transform:translateY(0)}}
.flash-card.swiping{transition:none;}
.flash-card.leave-left{transform:translateX(-120%) rotate(-14deg); opacity:0;}
.flash-card.leave-right{transform:translateX(120%) rotate(14deg); opacity:0;}
.flash-card.enter{animation:flashEnter .35s ease-out;}
@keyframes flashEnter{
  0%{transform:translateY(16px) scale(.96); opacity:0;}
  100%{transform:translateY(0) scale(1); opacity:1;}
}
/* Swipe hint badges that fade in as the user drags */
.flash-badge{
  position:absolute; top:24px; padding:6px 16px; border-radius:8px;
  font-weight:800; font-size:14px; letter-spacing:1px;
  opacity:0; pointer-events:none; transition:opacity .15s;
  border:2px solid currentColor; text-transform:uppercase;
}
.flash-badge.left{left:20px; color:#ef5350; transform:rotate(-10deg);}
.flash-badge.right{right:20px; color:#10b981; transform:rotate(10deg);}

/* Three-button action row */
.flash-actions{
  display:grid; grid-template-columns:1fr auto 1fr; gap:10px; margin-top:8px;
}
.flash-btn{
  padding:16px 14px; border-radius:14px; border:none;
  font-weight:800; font-size:16px; cursor:pointer; font-family:var(--font-sans);
  transition:transform .12s, box-shadow .12s, filter .12s;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  min-height:60px;
}
.flash-btn .ico{font-size:20px;}
.flash-btn .sub{font-size:10px; opacity:.7; font-weight:600;}
.flash-btn.lupa{
  background:linear-gradient(135deg,#ef5350,#c62828); color:white;
  box-shadow:0 4px 14px rgba(239,83,80,.4);
}
.flash-btn.lupa:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.ingat{
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  box-shadow:0 4px 14px rgba(16,185,129,.4);
}
.flash-btn.ingat:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.back{
  background:rgba(255,255,255,.08); color:var(--white);
  border:1px solid var(--border); padding:16px 18px;
}
.flash-btn.back:hover{background:rgba(255,255,255,.14); border-color:var(--pink);}
@media (max-width:640px){
  .flash-btn{font-size:15px; padding:14px 10px; min-height:66px;}
}

/* ========== Modals ========== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(8px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:linear-gradient(160deg, var(--navy-2), var(--navy));
  border:1px solid var(--pink); border-radius:20px; padding:24px;
  width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(239,106,154,.4);
}
.modal h2{font-family:var(--font-jp); color:var(--pink-light); margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-size:12px; margin-bottom:4px; color:var(--gray);}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-family:var(--font-sans); font-size:14px;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none; border-color:var(--pink);}

/* ========== TOASTS ========== */
.toast-wrap{position:fixed; top:80px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:white; padding:12px 18px; border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  font-weight:700; font-size:13px;
  animation: toastSlide .3s ease-out, toastOut .3s ease-in 2.7s forwards;
}
@keyframes toastSlide{from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastOut{to{transform:translateX(100%); opacity:0;}}

/* ========== Loading ========== */
.loading{
  display:flex; align-items:center; justify-content:center; padding:40px;
  color:var(--gray); font-size:14px;
}
.loading::before{content:"⏳"; margin-right:8px; font-size:20px; animation:spin 1.5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ========== LEVEL UP OVERLAY ========== */
.levelup-overlay{
  position:fixed; inset:0; background:radial-gradient(circle at center, rgba(239,106,154,.4), rgba(0,0,0,.9));
  display:none; align-items:center; justify-content:center; z-index:150;
  animation: lvup .3s ease-out;
}
.levelup-overlay.show{display:flex;}
@keyframes lvup{from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);}}
.levelup-content{text-align:center;}
.levelup-content .text{
  font-family:var(--font-jp); font-size:60px; font-weight:800;
  background:linear-gradient(135deg, var(--gold), var(--pink));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(255,215,0,.5);
  animation: lvupText 2s ease-out;
}
@keyframes lvupText{0%{transform:scale(0) rotate(-180deg);} 50%{transform:scale(1.2) rotate(10deg);} 100%{transform:scale(1) rotate(0);}}
.levelup-content .lvl{font-size:30px; color:var(--white); margin-top:10px;}

/* ========== KANJI DETAIL ========== */
.kanji-detail{text-align:center; padding:20px;}
.kanji-detail .big-k{font-family:var(--font-jp); font-size:120px; font-weight:800; color:var(--pink);}
.kanji-detail .readings{display:flex; gap:12px; justify-content:center; margin:10px 0;}
.kanji-detail .readings .r{background:rgba(42,50,112,.6); padding:6px 12px; border-radius:8px; font-size:13px;}
.kanji-detail .readings .r .lbl{font-size:10px; color:var(--gray); display:block;}
.contoh-list{text-align:left; margin-top:16px;}
.contoh-item{
  display:flex; justify-content:space-between; gap:10px;
  background:rgba(255,255,255,.04); padding:10px; border-radius:8px; margin-bottom:6px;
}
.contoh-item .jp{font-family:var(--font-jp); font-size:16px; font-weight:700;}
.contoh-item .r{font-size:11px; color:var(--gray);}
.contoh-item .id{font-size:12px; color:var(--off); text-align:right;}

/* ========== Soal / Quiz ========== */
.soal-container{padding:20px;}
.soal-stem{
  font-family:var(--font-jp); font-size:22px; line-height:1.6;
  background:rgba(255,255,255,.04); padding:20px; border-radius:12px; border:1px solid var(--border);
}
.soal-stem rt{font-size:12px; color:var(--pink-light);}
.opsi-list{display:grid; gap:10px; margin-top:16px;}
.opsi{
  background:rgba(42,50,112,.4); border:2px solid var(--border); padding:14px 16px;
  border-radius:10px; cursor:pointer; text-align:left; font-size:16px;
  color:var(--white); font-family:var(--font-sans); transition:all .15s;
}
.opsi:hover{border-color:var(--pink); background:rgba(42,50,112,.6);}
.opsi.selected{border-color:var(--pink); background:rgba(239,106,154,.2);}
.opsi.correct{border-color:var(--green); background:rgba(16,185,129,.2);}
.opsi.wrong{border-color:var(--red); background:rgba(239,68,68,.2);}
.soal-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.soal-timer{
  position:sticky; top:0; z-index:5; background:var(--navy-4);
  display:flex; justify-content:space-between; padding:10px 16px; border-radius:10px;
  margin-bottom:12px; border:1px solid var(--border);
}
.soal-timer .time{font-family:var(--font-jp); font-size:18px; font-weight:800; color:var(--gold); transition:color .2s;}
.soal-timer .time.time-danger{color:#ef5350; animation:timerPulse 1s infinite;}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ========== Dashboard home grid ========== */
.hub-grid{
  display:grid; gap:12px; margin-top:16px;
  grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
}
.hub-card{
  background:linear-gradient(135deg, rgba(42,50,112,.5), rgba(31,38,80,.7));
  border:1px solid var(--border); border-radius:14px; padding:14px;
  display:flex; gap:10px; align-items:center; cursor:pointer; transition:all .15s;
}
.hub-card:hover{border-color:var(--pink); transform:translateY(-2px);}
.hub-card .ico{font-size:30px;}
.hub-card .info .ttl{font-weight:800; font-size:14px;}
.hub-card .info .sub{font-size:11px; color:var(--gray);}

/* ========== EMPTY state ========== */
.empty{
  text-align:center; padding:40px 20px; color:var(--gray);
}
.empty .emoji{font-size:48px; margin-bottom:12px;}

/* ========== HEATMAP ========== */
.heatmap{display:grid; grid-template-columns:repeat(20, 1fr); gap:2px; margin:10px 0;}
.heatmap .cell{aspect-ratio:1; border-radius:2px; background:rgba(255,255,255,.05);}
.heatmap .cell.l1{background:rgba(239,106,154,.3);}
.heatmap .cell.l2{background:rgba(239,106,154,.5);}
.heatmap .cell.l3{background:rgba(239,106,154,.7);}
.heatmap .cell.l4{background:var(--pink);}

/* ========== Guru link ========== */
.guru-link{
  position:fixed; bottom:16px; right:16px; z-index:10;
  background:linear-gradient(135deg, #8b5cf6, #ef6a9a);
  color:white; padding:10px 16px; border-radius:50px;
  text-decoration:none; font-weight:700; font-size:12px;
  box-shadow:0 10px 30px rgba(139,92,246,.4);
}
.guru-link:hover{transform:translateY(-2px); box-shadow:0 15px 40px rgba(139,92,246,.6);}

.hidden{display:none !important;}
</style>
</head>
<body>

<script type="module">
import { renderCharacter, CATALOG, CATALOG_LABELS, DEFAULT_EQUIPPED } from "./js/character.js";
import { allShopItems } from "./js/shop-seed.js";
import { ACHIEVEMENTS } from "./js/achievements.js";
import * as FB from "./js/firebase-sync.js";

/* ========== STATE ========== */
const state = {
  level: localStorage.getItem("shirose-lvl") || "n5",   // active JLPT level
  user: null,
  siswa: null,
  gami: { xp:0, koin:0, streak:0, level_karakter:1 },
  authMode: "login",
  materi: { kosakata:{}, kanji:{}, bunpou:{} },
  srs: {},
};
window.state = state;

/* ========== TOAST ========== */
/* ========== RANGKUMAN SENDIRI (personal word collection) ========== */
// Open a popup to add any word to the student's own Rangkuman. Pre-fills
// kana/arti via a dataset lookup when the user asks or when caller provides.
window.rangkumPopup = (prefilled = {}, sumber = "") => {
  const safe = (s) => (s||"").toString().replace(/"/g,"&quot;");
  const existing = document.getElementById("rangkum-modal");
  if (existing) existing.remove();
  const html = `
    <div class="modal-backdrop open" id="rangkum-modal" onclick="if(event.target===this) closeRangkumPopup()">
      <div class="modal">
        <h2>➕ Tambah ke Rangkuman</h2>
        <p style="color:var(--gray); font-size:13px;">Catat kata yang mau kamu ulang-ulang nanti di menu Rangkuman.</p>
        ${sumber ? `<p style="font-size:12px; color:var(--gray-dim); background:rgba(255,255,255,.04); padding:8px 10px; border-radius:8px; margin-top:8px;">📍 Sumber: ${sumber}</p>` : ""}
        <div class="form-row" style="margin-top:14px;">
          <label>Kata (日本語)</label>
          <input id="rk-jp" value="${safe(prefilled.jp)}" placeholder="misal: 食べる" style="flex:1; font-family:var(--font-jp); font-size:20px;"/>
        </div>
        <div class="form-row">
          <label>Kana</label>
          <input id="rk-kana" value="${safe(prefilled.kana)}" placeholder="opsional, misal: たべる" style="flex:1;"/>
        </div>
        <div class="form-row">
          <label>Arti</label>
          <input id="rk-arti" value="${safe(prefilled.arti)}" placeholder="bahasa Indonesia" style="flex:1;"/>
        </div>
        <button class="btn ghost sm" onclick="rangkumAutoLookup()" style="margin-top:8px;">🔍 Cari otomatis di kamus SHIROSE</button>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn gold" onclick="rangkumSimpan('${safe(sumber)}')" style="flex:1;">💾 Simpan</button>
          <button class="btn ghost" onclick="closeRangkumPopup()">Batal</button>
        </div>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(() => document.getElementById("rk-jp")?.focus(), 50);
};

window.closeRangkumPopup = () => { const m = document.getElementById("rangkum-modal"); if (m) m.remove(); };

window.rangkumAutoLookup = async () => {
  const jp = document.getElementById("rk-jp").value.trim();
  if (!jp) return toast("Isi kata dulu");
  // Search all levels across kosakata & kanji
  for (const lvl of ["n5","n4","n3","n2","n1"]){
    const kos = await loadMateri("kosakata", lvl);
    const m = kos.find(it => (it.kata || it.k) === jp);
    if (m){
      document.getElementById("rk-kana").value = m.kana || "";
      document.getElementById("rk-arti").value = m.arti || "";
      toast(`✓ Ditemukan: kosakata ${lvl.toUpperCase()} No.${String(m.no||"-").padStart(3,"0")}`);
      return;
    }
    const knj = await loadMateri("kanji", lvl);
    const mk = knj.find(it => (it.kanji || it.k) === jp);
    if (mk){
      document.getElementById("rk-kana").value = mk.kana || "";
      document.getElementById("rk-arti").value = mk.arti || "";
      toast(`✓ Ditemukan: kanji ${lvl.toUpperCase()} No.${String(mk.no||"-").padStart(3,"0")}`);
      return;
    }
  }
  toast("Tidak ditemukan — tulis arti sendiri ya");
};

window.rangkumSimpan = async (sumber) => {
  if (!state.user) return toast("Login dulu untuk menyimpan rangkuman");
  const jp = document.getElementById("rk-jp").value.trim();
  const kana = document.getElementById("rk-kana").value.trim();
  const arti = document.getElementById("rk-arti").value.trim();
  if (!jp) return toast("Kata tidak boleh kosong");
  try {
    await FB.tambahRangkuman({ jp, kana, arti, sumber });
    toast(`✓ "${jp}" masuk ke rangkuman`);
    closeRangkumPopup();
  } catch(e){ toast("❌ " + e.message); }
};

/* ========== RANGKUMAN view ========== */
async function renderRangkuman(){
  if (!state.user){
    return `<div class="panel"><h2>📝 Rangkuman Saya</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk menyimpan rangkuman.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }
  const list = await FB.listRangkuman();
  if (!list.length){
    return `<div class="panel"><h2>📝 Rangkuman Saya</h2>
      <div class="empty"><div class="emoji">📝</div>
        Belum ada kata di rangkuman.<br><br>
        Cara menambah:<br>
        <small style="color:var(--gray); line-height:1.8;">
        • Buka detail Kosakata / Kanji → tombol <b>➕ Rangkum</b><br>
        • Setelah selesai ujian → tombol <b>➕ Rangkum</b> di tiap soal<br>
        • Dari contoh kalimat → tombol <b>➕ Rangkum</b>
        </small>
      </div></div>`;
  }
  return `
    <div class="panel">
      <h2>📝 Rangkuman Saya (${list.length})</h2>
      <p style="color:var(--gray); font-size:13px;">Kata yang kamu simpan sendiri — ulang-ulang di mode Hafalan.</p>
      <div style="display:flex; gap:10px; margin:14px 0; flex-wrap:wrap;">
        <button class="btn gold" onclick="rangkumToHafalan()">🧠 Mulai Hafalan dari Rangkuman</button>
        <button class="btn ghost" onclick="route('home')">🏠 Home</button>
      </div>
      <div class="materi-list">
        ${list.map((r, i) => `
          <div class="materi-item" style="padding-right:48px;">
            <button class="btn sm danger" onclick="rangkumHapus('${r.id}')"
                    style="position:absolute; top:8px; right:8px; padding:4px 8px;">🗑</button>
            <span class="no-badge">No.${String(i+1).padStart(3,"0")}</span>
            <div class="kanji">${r.jp}</div>
            <div class="reading">${r.kana||"—"}</div>
            <div class="meaning">${r.arti||"—"}</div>
            ${r.sumber ? `<div style="font-size:11px; color:var(--gray-dim); margin-top:4px;">📍 ${r.sumber}</div>` : ""}
          </div>`).join("")}
      </div>
    </div>`;
}

window.rangkumHapus = async (id) => {
  if (!confirm("Hapus kata ini dari rangkuman?")) return;
  await FB.hapusRangkuman(id);
  route("rangkuman");
};

window.rangkumToHafalan = async () => {
  const list = await FB.listRangkuman();
  if (!list.length) return toast("Rangkuman kosong");
  state.hafalan_queue = list.map((r, i) => ({
    tipe: "rangkuman", idx: i, no: i + 1,
    front: r.jp, reading: r.kana || "",
    back: r.arti || r.jp,
  })).sort(() => Math.random() - 0.5);
  state.hafalan_pos = 0;
  state.hafalan_score = { benar:0, salah:0 };
  state.hafalan = state.hafalan || {};
  state.hafalan.tipe = "rangkuman";
  state.hafalan.mode = "flashcard";
  route("hafalan/go");
};

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(), 3100);
}
window.toast = toast;

/* ========== AUTH MODAL ========== */
window.showAuthModal = () => { document.getElementById("auth-modal").classList.add("open"); };
window.closeModal = (id) => { document.getElementById(id).classList.remove("open"); };
window.toggleAuthMode = () => {
  state.authMode = state.authMode === "login" ? "daftar" : "login";
  document.getElementById("auth-title").textContent = state.authMode === "daftar" ? "Buat akun baru" : "Masuk ke akunmu";

};
window.submitAuth = async () => {
  const email = document.getElementById("auth-email").value.trim();
  const pwd = document.getElementById("auth-pwd").value;
  const nama = document.getElementById("auth-nama").value.trim();
  const err = document.getElementById("auth-err");
  err.textContent = "";

      await FB.daftar(email, pwd, nama || email.split("@")[0]);

    } else {
      await FB.login(email, pwd);

/* ========== LEVEL PILLS ========== */
function renderLevelPills(){
  const pills = document.getElementById("lvl-pills");
  const levels = ["n5","n4","n3","n2","n1"];
  const akses = state.siswa?.aksesLevel || { n5:true, n4:false, n3:false, n2:false, n1:false };
  pills.innerHTML = levels.map(l => {
    const locked = !akses[l] && !FB.userIsGuru();
    const active = state.level === l;
    return `<button class="lvl-pill ${active?'active':''} ${locked?'locked':''}" ${locked?'disabled':''}
            onclick="setLevel('${l}')">${l.toUpperCase()}</button>`;
  }).join("");
}
// Access guard for JLPT level. Guest gets N5 only; guru gets everything;
// student goes by siswa.aksesLevel.
function canAccessLevel(lvl){
  if (!lvl) return false;
  if (FB.userIsGuru()) return true;
  const akses = state.siswa?.aksesLevel;
  if (!akses){ return lvl === "n5"; } // sensible default for guest / new signup
  return !!akses[lvl];
}
window.canAccessLevel = canAccessLevel;

window.setLevel = async (lvl) => {
  if (!canAccessLevel(lvl)){
    toast("🔒 Level " + lvl.toUpperCase() + " belum dibuka — hubungi guru untuk akses");
    return;
  }
  state.level = lvl;
  localStorage.setItem("shirose-lvl", lvl);
  renderLevelPills();
  await loadGami();
  updateChips();
  route(location.hash.slice(1) || "home");
};

// Snap state.level back to a level the student is allowed to use. Called
// after the siswa doc loads, and defensively before any level-scoped render.
function enforceLevelAccess(){
  if (canAccessLevel(state.level)) return true;
  const akses = state.siswa?.aksesLevel || {};
  const first = ["n5","n4","n3","n2","n1"].find(l => akses[l]) || "n5";
  if (first !== state.level){
    state.level = first;
    localStorage.setItem("shirose-lvl", first);
    renderLevelPills();
  }
  return false;
}
window.enforceLevelAccess = enforceLevelAccess;

/* ========== GAMI (XP/koin) ========== */
async function loadGami(){
  if (!state.user) {
    // Guest from localStorage
    const key = `shirose-gami-${state.level}`;
    state.gami = JSON.parse(localStorage.getItem(key) || '{"xp":0,"koin":0,"streak":0,"level_karakter":1}');
    return;
  }
  state.gami = await FB.getGami(state.level);
}
async function awardXP(dXP, dKoin = 0){
  const oldLvl = state.gami.level_karakter || 1;
  if (state.user) {
    state.gami = await FB.tambahXP(state.level, dXP, dKoin);
  } else {
    state.gami.xp = (state.gami.xp || 0) + dXP;
    state.gami.koin = (state.gami.koin || 0) + dKoin;
    state.gami.level_karakter = Math.floor(Math.sqrt(state.gami.xp / 50)) + 1;
    const today = new Date().toISOString().slice(0,10);
    if (state.gami.lastDate !== today) {
      const yd = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.gami.streak = state.gami.lastDate === yd ? (state.gami.streak||0)+1 : 1;
      state.gami.lastDate = today;
    }
    localStorage.setItem(`shirose-gami-${state.level}`, JSON.stringify(state.gami));
  }
  toast(`+${dXP} XP${dKoin?` · +${dKoin} 🪙`:""}`);
  if (state.gami.level_karakter > oldLvl) {
    document.getElementById("levelup-lvl").textContent = `Level ${state.gami.level_karakter}`;
    document.getElementById("levelup").classList.add("show");
    setTimeout(() => document.getElementById("levelup").classList.remove("show"), 2200);
  }
  updateChips();
}
function updateChips(){
  document.getElementById("chip-lv").textContent = state.gami.level_karakter || 1;
  const coinEl = document.getElementById("chip-coin");
  if (FB.hasUnlimitedCoins && FB.hasUnlimitedCoins()){
    coinEl.textContent = "∞";
    coinEl.parentElement.style.background = "linear-gradient(135deg, #ffd700, #c89300)";
    coinEl.parentElement.style.color = "#2a1810";
    coinEl.parentElement.title = "Unlimited coins (developer)";
  } else {
    coinEl.textContent = state.gami.koin || 0;
  }
  document.getElementById("chip-streak").textContent = state.gami.streak || 0;
}
window.awardXP = awardXP;

/* ========== DATA LOAD (cached) ========== */
async function loadMateri(tipe, lvl){
  const key = `${tipe}-${lvl}`;
  if (state.materi[tipe][lvl]) return state.materi[tipe][lvl];
  try {
    const r = await fetch(`./data/${tipe}-${lvl}.json`);
    const d = await r.json();
    state.materi[tipe][lvl] = d;
    return d;
  } catch(e) {
    return [];
  }
}

const LEVEL_SCOPED_ROUTES = new Set([
  "materi","kosakata","kanji","bunpou","hafalan","quest","ujian"
]);

window.route = (path) => {
  location.hash = path;
  const [name, ...rest] = path.split("/");

  // Enforce JLPT access before rendering level-scoped content.
  if (LEVEL_SCOPED_ROUTES.has(name) && !canAccessLevel(state.level)){
    const app = document.getElementById("app");
    const unlocked = Object.entries(state.siswa?.aksesLevel || {}).filter(([,v]) => v).map(([k]) => k.toUpperCase());
    app.innerHTML = `
      <div class="panel">
        <h2>🔒 Level ${state.level.toUpperCase()} belum terbuka</h2>
        <div class="empty">
          <div class="emoji">🔒</div>
          Guru belum memberimu akses ke level ini.<br>
          ${unlocked.length ? `Kamu bisa belajar di: <b>${unlocked.join(", ")}</b>` : "Hubungi guru untuk membuka akses."}
        </div>
        ${unlocked.length ? `<button class="btn" onclick="setLevel('${unlocked[0].toLowerCase()}')">Pindah ke ${unlocked[0]}</button>` : ""}
        <button class="btn ghost" onclick="route('home')">🏠 Kembali Home</button>
      </div>`;
    return;
  }

  const fn = routes[name] || renderHome;
  const app = document.getElementById("app");
  app.classList.remove("has-sidepanel");
  app.innerHTML = '<div class="loading">Memuat…</div>';
  Promise.resolve(fn(rest)).then(html => {
    if (typeof html === "string") app.innerHTML = html;
  }).catch(e => {
    app.innerHTML = `<div class="panel"><h2>Error</h2><p>${e.message}</p></div>`;
    console.error(e);
  });
};

// Permanent number for an item: prefer data.no, fallback to 1-based index.
function itemNo(it, idx){ return Number.isFinite(it?.no) ? it.no : (idx + 1); }
function fmtNo(n){ return "No." + String(n).padStart(3, "0"); }

async function renderMateriList(tipe){
  const data = await loadMateri(tipe, state.level);
  const label = {kosakata:"Kosakata", kanji:"Kanji", bunpou:"Bunpou"}[tipe];
  if (!data.length) return `<div class="panel"><h2>${label}</h2><div class="empty"><div class="emoji">📭</div>Belum ada data untuk level ini.</div></div>`;

  const list = data.map((it, idx) => {
    const no = fmtNo(itemNo(it, idx));
    if (tipe === "kosakata") {
      const kana = it.kana || it.f || "";
      const kata = it.kata || it.k || "";
      const arti = it.arti || it.a || "";
      return `<div class="materi-item" onclick="showMateri('${tipe}', ${idx})">
        <span class="no-badge">${no}</span>
        <div class="kanji">${kata}</div>
        <div class="reading">${kana}</div>
        <div class="meaning">${arti}</div>
      </div>`;
    }
    if (tipe === "kanji") {
      const k = it.kanji || it.k || "";
      const kana = it.kana || `${it.on || ""} ${it.kun || ""}`.trim();
      const arti = it.arti || it.a || "";
      return `<div class="materi-item" onclick="showMateri('${tipe}', ${idx})">
        <span class="no-badge">${no}</span>
        <div class="kanji">${k}</div>
        <div class="reading">${kana}</div>
        <div class="meaning">${arti}</div>
      </div>`;
    }
    if (tipe === "bunpou") {
      const pola = it.pola || it.p || it.kata || "";
      const arti = it.arti || it.e || it.penjelasan || "";
      return `<div class="materi-item" onclick="showMateri('${tipe}', ${idx})">
        <span class="no-badge">${no}</span>
        <div class="kanji" style="font-size:22px;">${pola}</div>
        <div class="meaning">${arti.slice(0, 120)}${arti.length > 120 ? "…" : ""}</div>
      </div>`;
    }
  }).join("");

  return `
    <div class="panel">
      <h2>${label === "Kosakata" ? "📖" : label === "Kanji" ? "🈷️" : "📐"} ${label} ${state.level.toUpperCase()}</h2>

      </div>
      <div class="materi-list" id="materi-list-${tipe}">${list}</div>
    </div>
  `;
}

// a logged-in siswa doc's permissions.audio_autoplay overrides it.
function isAutoPlayAudio(){
  if (state.user && state.siswa && state.siswa.permissions && typeof state.siswa.permissions.audio_autoplay === "boolean"){
    return state.siswa.permissions.audio_autoplay;
  }
  const v = localStorage.getItem("shirose-auto-audio");
  return v !== "off"; // default ON
}
async function setAutoPlayAudio(on){
  localStorage.setItem("shirose-auto-audio", on ? "on" : "off");
  if (state.user && state.siswa){
    state.siswa.permissions = state.siswa.permissions || {};
    state.siswa.permissions.audio_autoplay = on;
    // Best-effort persist; not critical if offline
    try { await FB.updateSiswaPermissions({ audio_autoplay: on }); } catch(e){}
  }
}
window.isAutoPlayAudio = isAutoPlayAudio;
window.setAutoPlayAudio = setAutoPlayAudio;

// Called from flashcard renders to speak the current front if enabled.
// Must be triggered inside a user-interaction call stack to satisfy
// mobile browsers' autoplay policy; hafalan navigation IS user-initiated.
function _autoSpeakJP(txt){
  if (!txt || !isAutoPlayAudio()) return;
  try { window.speakJP(txt); } catch(e){}
}

/* ========== HAFALAN (Selection + 3 modes: Flashcard / Matching / Multiple Choice) ========== */
// SRS key is namespaced per type so kanji and kosakata don't collide.
function _srsKey(tipe, it, idx){ return tipe[0] + ":" + itemNo(it, idx); }

// Normalize an item from kanji or kosakata into a common pair for drills.
function _normalizeItem(tipe, it, idx){
  if (tipe === "kanji"){
    return {
      tipe, idx, no: itemNo(it, idx),
      front: it.kanji || it.k || "",
      reading: it.kana || `${it.on || ""} ${it.kun || ""}`.trim() || "",
      back: it.arti || it.a || "",
    };
  }
  return {
    tipe, idx, no: itemNo(it, idx),
    front: it.kata || it.k || "",
    reading: it.kana || it.f || "",
    back: it.arti || it.a || "",
  };
}

async function _loadSrs(){
  let srs = {};
  if (state.user) srs = await FB.loadSRS(state.level);
  else srs = JSON.parse(localStorage.getItem(`shirose-srs-${state.level}`) || "{}");
  state.srs = srs;
  return srs;
}
async function _saveSrs(){
  if (state.user) await FB.saveSRS(state.level, state.srs);
  else localStorage.setItem(`shirose-srs-${state.level}`, JSON.stringify(state.srs));
}

// Entry router. renderHafalan() -> selection. renderHafalan(['go']) -> session using state.hafalan.
async function renderHafalan(params){
  const sub = (params && params[0]) || "";
  if (sub === "go") return renderHafalanSession();
  return renderHafalanSelect();
}

// Classify a card by SRS state → status + color.
// Also used to render the preview list in the Hafalan selection screen.
function _cardStatus(card){
  if (!card)                        return { key:"new",      label:"Baru",            color:"#ffffff", bg:"rgba(255,255,255,.08)" };
  if (card.mastered)                return { key:"mastered", label:"Mastered",        color:"#10b981", bg:"rgba(16,185,129,.18)" };
  if ((card.interval||1) >= 10)     return { key:"review",   label:"Review",          color:"#f59e0b", bg:"rgba(245,158,11,.18)" };
  if ((card.interval||1) >= 3)      return { key:"learning", label:"Learning",        color:"#eab308", bg:"rgba(234,179,8,.18)" };
  return                                   { key:"fresh",    label:"Baru dipelajari", color:"#ef5350", bg:"rgba(239,83,80,.18)" };
}

async function renderHafalanSelect(){
  const [kos, knj, rangList] = await Promise.all([
    loadMateri("kosakata", state.level),
    loadMateri("kanji", state.level),
    state.user ? FB.listRangkuman() : Promise.resolve([]),
  ]);
  await _loadSrs();

  const cfg = state.hafalan || { tipe:"kosakata", range:"1-50", filter:"all", mode:"flashcard" };
  state.hafalan = cfg;

  // Build a bucket of 50 covering the full dataset for the active type.
  function activePool(){
    const pool = [];
    const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
    if (cfg.tipe === "rangkuman"){
      rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));
    } else {
      if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
      if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
    }
    return pool;
  }
  const pool = activePool();
  const maxNo = pool.reduce((m, p) => Math.max(m, p.no), 0);

  function makeRanges(n){
    const r = [];
    if (n <= 0) return ["all"];
    for (let start = 1; start <= n; start += 50){
      const end = Math.min(start + 49, n);
      r.push(`${start}-${end}`);
    }
    r.push("all");
    return r;
  }
  const ranges = makeRanges(maxNo);

  // Ensure cfg.range is valid for the current pool
  if (!ranges.includes(cfg.range)) cfg.range = "all";

  // Filtered preview: apply range + filter on the pool
  const now = Date.now();
  let preview = pool;
  if (cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);
    preview = preview.filter(p => p.no >= lo && p.no <= hi);
  }
  preview = preview.filter(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    const card = state.srs[key];
    if (cfg.filter === "new")         return !card;
    if (cfg.filter === "due")         return card && card.due <= now;
    if (cfg.filter === "notmastered") return !card || !card.mastered;
    if (cfg.filter === "mastered")    return !!card?.mastered;
    return true;
  });

  // Counters by status, across the filtered set
  const counters = { mastered:0, review:0, learning:0, fresh:0, new:0 };
  preview.forEach(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    counters[_cardStatus(state.srs[key]).key]++;
  });

  const typeBtn = (v, lbl, sub, disabled=false) => `
    <button class="haf-pick ${cfg.tipe===v?'on':''}" ${disabled?'disabled style="opacity:.4;"':''} onclick="hafCfg('tipe','${v}')">
      <div class="lbl">${lbl}</div><div class="sub">${sub}</div>
    </button>`;

  const chip = (field, v, lbl) => `
    <button class="haf-chip ${cfg[field]===v?'on':''}" onclick="hafCfg('${field}','${v}')">${lbl}</button>`;

  return `
    <div class="panel">
      <h2>🧠 Hafalan</h2>
      <p style="color:var(--gray); font-size:14px; margin-bottom:14px;">Pilih yang mau dihafal, rentang, filter, lalu mode belajar.</p>

      <h3 style="margin-bottom:8px;">1. Pilih materi</h3>
      <div class="haf-type-row">
        ${typeBtn("kosakata", "📖 Kosakata", kos.length + " kata")}
        ${typeBtn("kanji",    "🈷️ Kanji",    knj.length + " kanji")}
        ${typeBtn("semua",    "✨ Semua",     (kos.length + knj.length) + " item")}
        ${typeBtn("rangkuman","📝 Rangkuman",rangList.length + " kata", !state.user)}
      </div>

      <h3 style="margin:16px 0 8px;">2. Rentang nomor <small style="color:var(--gray-dim); font-weight:400;">(bucket per 50)</small></h3>
      <div class="haf-chip-row">
        ${ranges.map(r => chip("range", r, r === "all" ? "Semua" : r)).join("")}
      </div>

      <h3 style="margin:16px 0 8px;">3. Filter</h3>
      <div class="haf-chip-row">
        ${chip("filter","all","Semua")}
        ${chip("filter","new","Baru")}
        ${chip("filter","due","Due hari ini")}
        ${chip("filter","notmastered","Belum mastered")}
        ${chip("filter","mastered","Sudah mastered")}
      </div>

      <div class="status-legend">
        <span class="stat-pill" style="background:rgba(16,185,129,.18); color:#10b981;">● Mastered ${counters.mastered}</span>
        <span class="stat-pill" style="background:rgba(245,158,11,.18); color:#f59e0b;">● Review ${counters.review}</span>
        <span class="stat-pill" style="background:rgba(234,179,8,.18); color:#eab308;">● Learning ${counters.learning}</span>
        <span class="stat-pill" style="background:rgba(239,83,80,.18); color:#ef5350;">● Baru dipelajari ${counters.fresh}</span>
        <span class="stat-pill" style="background:rgba(255,255,255,.08); color:#fff;">● Belum ${counters.new}</span>
      </div>

      ${preview.length ? `
        <details class="status-preview" ${cfg.filter !== "all" ? "open" : ""}>
          <summary><b>Lihat daftar kartu (${preview.length})</b> · klik untuk buka/tutup</summary>
          <div class="status-list">
            ${preview.slice(0, 200).map(p => {
              const key = _srsKey(p.tipe, {no:p.no}, p.idx);
              const s = _cardStatus(state.srs[key]);
              return `
                <div class="status-item" style="background:${s.bg}; border-color:${s.color}44;">
                  <span class="no-badge">${fmtNo(p.no)}</span>
                  <div class="status-jp">${p.front}</div>
                  <div class="status-mean">${p.back}</div>
                  <span class="status-chip" style="color:${s.color}; border-color:${s.color};">${s.label}</span>
                </div>`;
            }).join("")}
            ${preview.length > 200 ? `<p style="text-align:center; color:var(--gray); margin-top:8px;">...dan ${preview.length-200} kartu lainnya</p>` : ""}
          </div>
        </details>
      ` : `<p style="text-align:center; color:var(--gray-dim); margin:12px 0;">Tidak ada kartu dengan filter ini.</p>`}

      <h3 style="margin:16px 0 8px;">4. Mode belajar</h3>
      <div class="haf-mode-row">
        <button class="haf-mode ${cfg.mode==='flashcard'?'on':''}" onclick="hafCfg('mode','flashcard')">
          <div class="ico">🃏</div><div class="lbl">Flashcard</div><div class="sub">Lihat kartu, tandai hafal</div>
        </button>
        <button class="haf-mode ${cfg.mode==='matching'?'on':''}" onclick="hafCfg('mode','matching')">
          <div class="ico">🔗</div><div class="lbl">Matching</div><div class="sub">Pasangkan kata & arti</div>
        </button>
        <button class="haf-mode ${cfg.mode==='multiple'?'on':''}" onclick="hafCfg('mode','multiple')">
          <div class="ico">✅</div><div class="lbl">Pilihan Ganda</div><div class="sub">Pilih arti yang benar</div>
        </button>
      </div>

      <h3 style="margin:16px 0 8px;">5. Audio</h3>
      <label style="display:inline-flex; align-items:center; gap:10px; cursor:pointer; padding:10px 14px; background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:10px;">
        <input type="checkbox" id="haf-autoaudio" ${isAutoPlayAudio()?'checked':''} onchange="setAutoPlayAudio(this.checked)" style="width:20px; height:20px;"/>
        <span>🔊 Auto-play pelafalan Jepang setelah tiap kartu</span>
      </label>

      <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
        <button class="btn gold" style="flex:1; min-width:160px;" onclick="hafStart()">▶ Mulai Hafalan (${preview.length})</button>
        <button class="btn ghost" onclick="route('home')">← Kembali</button>
      </div>
    </div>
  `;
}

window.hafCfg = (field, value) => {
  state.hafalan = state.hafalan || {};
  state.hafalan[field] = value;
  document.getElementById("app").innerHTML = "";
  renderHafalanSelect().then(h => { document.getElementById("app").innerHTML = h; });
};

window.hafStart = async () => {
  const cfg = state.hafalan;
  const [kos, knj, rangList] = await Promise.all([
    loadMateri("kosakata", state.level),
    loadMateri("kanji", state.level),
    state.user ? FB.listRangkuman() : Promise.resolve([]),
  ]);
  await _loadSrs();

  const pool = [];
  const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
  if (cfg.tipe === "rangkuman"){
    rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));
  } else {
    if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
    if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
  }

  // Range filter
  let inRange = pool;
  if (cfg.range && cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);
    inRange = pool.filter(p => p.no >= lo && p.no <= hi);
  }

  // Status filter
  const now = Date.now();
  const filtered = inRange.filter(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    const card = state.srs[key];
    if (cfg.filter === "new")         return !card;
    if (cfg.filter === "due")         return card && card.due <= now;
    if (cfg.filter === "notmastered") return !card || !card.mastered;
    if (cfg.filter === "mastered")    return !!card?.mastered;
    return true;
  });

  if (!filtered.length){
    toast("Tidak ada item yang cocok dengan filter ini");
    return;
  }

  // Shuffle + cap
  const cap = cfg.mode === "matching" ? Math.min(filtered.length, 20) : Math.min(filtered.length, 20);
  state.hafalan_queue = filtered.sort(() => Math.random() - 0.5).slice(0, cap);
  state.hafalan_pos = 0;
  state.hafalan_score = { benar:0, salah:0 };

  route("hafalan/go");
};

function renderHafalanSession(){
  const cfg = state.hafalan || {};
  const mode = cfg.mode || "flashcard";
  const q = state.hafalan_queue || [];
  if (!q.length) return renderHafalanSelect();

  if (mode === "flashcard") return renderHafalanFlashcard();
  if (mode === "matching")  return renderHafalanMatching();
  if (mode === "multiple")  return renderHafalanMultiple();
  return renderHafalanFlashcard();
}

/* ========== MODE 1: FLASHCARD v2 — front-only, tap = reveal, center btn = prev ========== */
function renderHafalanFlashcard(){
  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();
  const it = q[pos];
  const safeFront = (it.front || "").replace(/"/g, "&quot;");
  // Fresh reveal state each new card
  state._flashRevealed = false;

  const kemBtn = pos === 0
    ? `<button class="flash-btn back" disabled title="Ini kartu pertama">↶ Kembali</button>`
    : `<button class="flash-btn back" onclick="hafBack()" title="Kembali ke kartu sebelumnya">↶ Kembali</button>`;

  // Wire swipe + audio after DOM swap
  setTimeout(_hafPostRender, 0);

  return `
    <div class="panel">
      <div class="haf-topbar">
        <button class="btn ghost sm" onclick="route('hafalan')">← Menu</button>
        <span style="color:var(--gray); font-size:14px; font-weight:700;">${pos+1} / ${q.length}</span>
        <button class="btn ghost sm" onclick="route('home')">🏠 Home</button>
      </div>

      <div class="flash-stage" id="flash-stage">
        <span class="flash-badge left" id="badge-lupa">✕ LUPA</span>
        <span class="flash-badge right" id="badge-ingat">✓ INGAT</span>
        <div class="flash-card enter" id="flash-card" data-front="${safeFront}" onclick="hafCardTap(event)">
          <div class="no-pill">${fmtNo(it.no)} · ${it.tipe === "kanji" ? "KANJI" : it.tipe === "rangkuman" ? "RANGKUMAN" : "KOSAKATA"} · ${state.level.toUpperCase()}</div>
          <div class="front">${it.front}</div>
          <div class="back-face">
            <div class="reading">${it.reading || "—"}</div>
            <div class="arti">${it.back || "—"}</div>
          </div>
          <div class="tap-hint">👆 Tap kartu untuk lihat arti · ← Geser Lupa · Ingat Geser →</div>
        </div>
      </div>

      <div class="flash-actions">
        <button class="flash-btn lupa" onclick="hafRate('lupa')">
          <span class="ico">←</span>
          <span>Lupa</span>
        </button>
        ${kemBtn}
        <button class="flash-btn ingat" onclick="hafRate('ingat')">
          <span class="ico">→</span>
          <span>Ingat</span>
        </button>
      </div>
    </div>
  `;
}

// Post-render: wire swipe handlers, auto-play audio.
function _hafPostRender(){
  const card = document.getElementById("flash-card");
  if (!card) return;
  const front = card.getAttribute("data-front");
  // Auto-play the current card's pronunciation (mobile-autoplay-safe
  // because this render was triggered by a user click/swipe).
  _autoSpeakJP(front);
  _bindFlashSwipe(card);
}

// Tap on the card (not on a button) = reveal. If already revealed, tap does nothing
// (navigate with the dedicated Kembali button or swipe to rate).
window.hafCardTap = (ev) => {
  // If a swipe just ended, don't treat as a tap
  if (state._swipeMoved) { state._swipeMoved = false; return; }
  const card = document.getElementById("flash-card");
  if (!card || state._flashRevealed) return;
  state._flashRevealed = true;
  card.classList.add("revealed");
};

// Center button: go back to the previous card (only when pos > 0).
window.hafBack = () => {
  if ((state.hafalan_pos || 0) === 0) return;
  state.hafalan_pos--;
  document.getElementById("app").innerHTML = renderHafalanSession();
};

// Attach touch/pointer handlers for the physical swipe.
function _bindFlashSwipe(card){
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
  const THRESH = 90;             // px needed to commit a rating
  const MOVE_TAP = 8;            // px below this = treat as a tap

  const badgeL = document.getElementById("badge-lupa");
  const badgeR = document.getElementById("badge-ingat");

  function onDown(x, y){
    dragging = true; startX = x; startY = y; dx = 0; dy = 0;
    state._swipeMoved = false;
    card.classList.add("swiping");
  }
  function onMove(x, y){
    if (!dragging) return;
    dx = x - startX; dy = y - startY;
    // Ignore if the user is clearly scrolling vertically
    if (Math.abs(dy) > Math.abs(dx) * 1.2 && Math.abs(dy) > 20){ cancel(); return; }
    if (Math.abs(dx) > MOVE_TAP) state._swipeMoved = true;
    const rot = dx / 20;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    if (badgeL) badgeL.style.opacity = dx < 0 ? Math.min(1, -dx / THRESH) : 0;
    if (badgeR) badgeR.style.opacity = dx > 0 ? Math.min(1, dx / THRESH) : 0;
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    card.classList.remove("swiping");
    if (dx <= -THRESH){
      card.classList.add("leave-left");
      setTimeout(() => hafRate("lupa"), 180);
      return;
    }
    if (dx >= THRESH){
      card.classList.add("leave-right");
      setTimeout(() => hafRate("ingat"), 180);
      return;
    }
    // Snap back
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }
  function cancel(){
    dragging = false;
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }

  // Touch
  card.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchmove",  (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchend",   onUp);
  card.addEventListener("touchcancel", cancel);
  // Mouse (desktop)
  card.addEventListener("mousedown",  (e) => { onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", (e) => { if (dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener("mouseup",   () => { if (dragging) onUp(); });
}

window.hafRate = async (rate) => {
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos];
  if (!it) return;
  // Normalize: accept the old 4 ratings AND the new lupa/ingat
  const normalized = (rate === "lupa" || rate === "salah") ? "lupa"
                   : (rate === "ingat" || rate === "benar" || rate === "mudah" || rate === "ragu") ? "ingat"
                   : "ingat";
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const dayMs = 86400000;
  card.n = (card.n || 0) + 1;
  if (normalized === "lupa"){
    card.interval = 1;
  } else {
    // "ingat" doubles the interval (bounded reasonable minimum)
    card.interval = Math.max(2, Math.round((card.interval || 1) * 2));
  }
  card.due = now + card.interval * dayMs;
  card.last = normalized;
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();

  if (normalized === "ingat"){
    await awardXP(3, justMastered ? 1 : 0);
    if (justMastered) toast(`🏆 ${it.tipe === "kanji" ? "Kanji" : "Kosakata"} ${it.front} — MASTERED! +1 🪙`);
    state.hafalan_score.benar++;
    if (state.user) FB.updateMisiProgres("hafalan_10", 1).catch(()=>{});
  } else {
    await awardXP(1, 0);
    state.hafalan_score.salah++;
  }

  state.hafalan_pos++;
  document.getElementById("app").innerHTML = renderHafalanSession();
};

/* ========== MODE 2: MATCHING LINES (tap-to-pair, mobile-friendly) ========== */
function renderHafalanMatching(){
  // Build groups of 5 pairs at a time
  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();

  const batch = q.slice(pos, Math.min(pos + 5, q.length));
  // Shuffle arti side only, keep left side in natural order
  const rights = batch.map((it, i) => ({ i, back: it.back })).sort(() => Math.random() - 0.5);

  return `
    <div class="panel">
      <div class="haf-topbar">
        <button class="btn ghost sm" onclick="route('hafalan')">← Back</button>
        <span style="color:var(--gray); font-size:13px;">Kelompok ${Math.floor(pos/5)+1} · ${batch.length} pasang</span>
        <button class="btn ghost sm" onclick="route('home')">🏠 Home</button>
      </div>
      <p style="color:var(--gray); font-size:13px; margin:8px 0;">Tap kata di kiri, lalu arti yang cocok di kanan.</p>
      <div class="match-grid">
        <div class="match-col" id="match-left">
          ${batch.map((it, i) => `
            <button class="match-item" data-side="L" data-i="${i}" onclick="matchTap('L', ${i})">
              <span class="no-badge">${fmtNo(it.no)}</span>
              <div class="jp">${it.front}</div>
              <div class="rd">${it.reading}</div>
            </button>`).join("")}
        </div>
        <div class="match-col" id="match-right">
          ${rights.map(r => `
            <button class="match-item" data-side="R" data-i="${r.i}" onclick="matchTap('R', ${r.i})">
              <div class="id">${r.back}</div>
            </button>`).join("")}
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:16px; justify-content:center;">
        <button class="btn ghost" onclick="matchSkip()">Lewati kelompok</button>
      </div>
    </div>
  `;
}
window.matchTap = (side, i) => {
  state.match_pick = state.match_pick || {};
  state.match_pick[side] = i;
  document.querySelectorAll(`.match-item[data-side="${side}"]`).forEach(b => b.classList.remove("picked"));
  const btn = document.querySelector(`.match-item[data-side="${side}"][data-i="${i}"]`);
  if (btn) btn.classList.add("picked");

  // When both sides picked, resolve
  if (state.match_pick.L != null && state.match_pick.R != null){
    const L = state.match_pick.L, R = state.match_pick.R;
    const lb = document.querySelector(`.match-item[data-side="L"][data-i="${L}"]`);
    const rb = document.querySelector(`.match-item[data-side="R"][data-i="${R}"]`);
    if (L === R){
      lb.classList.add("match-ok"); rb.classList.add("match-ok");
      lb.disabled = true; rb.disabled = true;
      state.hafalan_score.benar++;
      matchAfterPair(true, L);
    } else {
      lb.classList.add("match-bad"); rb.classList.add("match-bad");
      setTimeout(() => { lb.classList.remove("match-bad","picked"); rb.classList.remove("match-bad","picked"); }, 500);
      state.hafalan_score.salah++;
    }
    state.match_pick = {};
    // If the current batch is cleared, advance
    setTimeout(matchCheckDone, 600);
  }
};
async function matchAfterPair(correct, iInBatch){
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos + iInBatch];
  if (!it) return;
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const mult = correct ? 2 : 1;
  card.n = (card.n || 0) + 1;
  card.interval = correct ? Math.max(1, Math.round((card.interval||1) * mult)) : 1;
  card.due = now + card.interval * 86400000;
  card.last = correct ? "benar" : "salah";
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();
  if (correct){
    // Play the Japanese word audio right after the match (user interaction = allowed autoplay)
    _autoSpeakJP(it.front);
    await awardXP(3, justMastered ? 1 : 0);
    if (justMastered) toast(`🏆 ${it.front} — MASTERED! +1 🪙`);
  }
}
window.matchCheckDone = () => {
  const remaining = document.querySelectorAll('.match-item[data-side="L"]:not(:disabled)').length;
  if (remaining === 0){
    state.hafalan_pos = Math.min(state.hafalan_pos + 5, state.hafalan_queue.length);
    document.getElementById("app").innerHTML = renderHafalanSession();
  }
};
window.matchSkip = () => {
  state.hafalan_pos = Math.min(state.hafalan_pos + 5, state.hafalan_queue.length);
  document.getElementById("app").innerHTML = renderHafalanSession();
};

/* ========== MODE 3: MULTIPLE CHOICE ========== */
function renderHafalanMultiple(){
  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();
  const it = q[pos];

  // Build 4 options: 1 correct, 3 distractors drawn from the rest of the queue (or pool).
  const distractors = q.filter((_, i) => i !== pos).map(x => x.back).filter(b => b && b !== it.back);
  const shuffled = Array.from(new Set(distractors)).sort(() => Math.random() - 0.5).slice(0, 3);
  while (shuffled.length < 3) shuffled.push("—");
  const options = [it.back, ...shuffled].sort(() => Math.random() - 0.5);
  state.mc_correct = it.back;

  return `
    <div class="panel">
      <div class="haf-topbar">
        <button class="btn ghost sm" onclick="route('hafalan')">← Back</button>

      </div>
      <div class="kanji-detail" style="padding:12px 0;">
        <div class="no-pill">${fmtNo(it.no)} · ${it.tipe === "kanji" ? "KANJI" : "KOSAKATA"} · ${state.level.toUpperCase()}</div>
        <div class="big-k" style="font-size:72px;">${it.front}</div>

          <button class="opsi" data-ans="${encodeURIComponent(o)}" onclick="mcPick('${encodeURIComponent(o)}', this)">
            ${String.fromCharCode(65+i)}. ${o}
          </button>`).join("")}
      </div>
      <div id="mc-feedback" style="display:none; margin-top:14px; padding:12px; border-radius:10px;"></div>
      <div style="display:none; margin-top:12px; justify-content:center;" id="mc-next">
        <button class="btn gold" onclick="mcNext()">Lanjut →</button>
      </div>

  `;
}
window.mcPick = async (encoded, btn) => {
  const picked = decodeURIComponent(encoded);

  document.querySelectorAll("#mc-opts .opsi").forEach(b => {
    b.disabled = true;

    fb.innerHTML = `<b>✓ Benar!</b> ${state.mc_correct}`;

  } else {
    fb.style.background = "rgba(239,68,68,.15)";

    state.hafalan_score.salah++;

  const it = state.hafalan_queue[state.hafalan_pos];
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  card.n = (card.n || 0) + 1;
  card.interval = correct ? Math.max(1, Math.round((card.interval||1) * 2)) : 1;
  card.due = now + card.interval * 86400000;
  card.last = correct ? "benar" : "salah";
  const justMastered = FB.detectNewMastery(card);

  await _saveSrs();
  if (justMastered){

/* ========== UJIAN engine ========== */
// Real-time countdown: paints #timer every second, auto-submits at 0.
let _ujianTimerId = null;
function _fmtTime(sec){
  const s = Math.max(0, sec|0);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
function _stopUjianTimer(){
  if (_ujianTimerId){ clearInterval(_ujianTimerId); _ujianTimerId = null; }
}
function _startUjianTimer(){
  _stopUjianTimer();
  const tick = () => {
    const u = state.ujian;
    const el = document.getElementById("timer");
    if (!u || !el){ _stopUjianTimer(); return; }
    const remaining = Math.max(0, Math.floor((u.endTime - Date.now()) / 1000));
    el.textContent = "⏱ " + _fmtTime(remaining);
    if (remaining <= 60) el.classList.add("time-danger");
    else el.classList.remove("time-danger");
    if (remaining === 0 && !u.autoSubmitted){
      u.autoSubmitted = true;
      _stopUjianTimer();
      if (typeof toast === "function") toast("⏰ Waktu habis — jawaban dikirim otomatis");
      if (typeof window.ujianSelesai === "function") window.ujianSelesai();
    }
  };
  tick();
  _ujianTimerId = setInterval(tick, 1000);
}

async function renderUjian(params){
  const kategoriId = params[0];
  if (!kategoriId){ _stopUjianTimer(); return renderQuest(); }

  if (!state.user){ _stopUjianTimer(); return `<div class="panel"><h2>Ujian</h2><div class="empty"><div class="emoji">🔒</div>Login dulu untuk mengerjakan ujian.<br><button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`; }

  const katList = await FB.listKategori(state.level);
  const kat = katList.find(x => x.id === kategoriId);
  const durasiMenit = Math.max(1, parseInt(kat?.durasi) || 30);

  const soal = await FB.listSoal(kategoriId);
  if (!soal.length){ _stopUjianTimer(); return `<div class="panel"><h2>Ujian</h2><div class="empty"><div class="emoji">📭</div>Belum ada soal tersedia. Silakan tunggu guru mengunggah soal.</div></div>`; }

  _stopUjianTimer();
  state.ujian = {
    kategoriId,
    soal: soal.sort(() => Math.random() - 0.5),
    pos: 0,
    jawaban: {},
    mulai: Date.now(),
    durasi: durasiMenit,
    endTime: Date.now() + durasiMenit * 60 * 1000,
    autoSubmitted: false,
  };
  setTimeout(_startUjianTimer, 0);
  return renderUjianSoal();
}
function renderUjianSoal(){
  const u = state.ujian;
  const s = u.soal[u.pos];
  const picked = u.jawaban[u.pos];
  const remaining = u.endTime ? Math.max(0, Math.floor((u.endTime - Date.now())/1000)) : 0;
  return `
    <div class="panel">
      <div class="soal-timer">
        <span>Soal ${u.pos+1} / ${u.soal.length}</span>
        <span class="time${remaining<=60?' time-danger':''}" id="timer">⏱ ${_fmtTime(remaining)}</span>
      </div>
      <div class="soal-stem">${s.pertanyaan || ""}</div>
      <div class="opsi-list">
        ${(s.opsi || ["A","B","C","D"]).map((o, i) => `
          <button class="opsi ${picked === i ? "selected" : ""}" onclick="pickOpsi(${i})">
            ${String.fromCharCode(65+i)}. ${o}
          </button>
        `).join("")}
      </div>
      <div class="soal-nav">
        <button class="btn ghost" ${u.pos === 0 ? "disabled" : ""} onclick="ujianNav(-1)">← Sebelum</button>
        ${u.pos < u.soal.length - 1
          ? `<button class="btn" onclick="ujianNav(1)">Lanjut →</button>`
          : `<button class="btn gold" onclick="ujianSelesai()">Selesaikan ✔</button>`}
      </div>
    </div>
  `;
}
window.pickOpsi = (i) => {

  document.getElementById("app").innerHTML = renderUjianSoal();
};
window.ujianNav = (dir) => {

window.ujianSelesai = async () => {
  _stopUjianTimer();

  const skor = Math.round((benar / u.soal.length) * 100);

  const rewardLine = lulusReward.firstTime
    ? `+${benar*5} XP · <b style="color:var(--gold);">+${lulusReward.rewardKoin.toLocaleString("id-ID")} 🪙 (BONUS LULUS)</b>`
    : (skor >= lulusMin
        ? `+${benar*5} XP · (bonus lulus sudah diklaim sebelumnya)`
        : `+${benar*5} XP · belum lulus (minimum ${lulusMin}) — coba lagi!`);

  document.getElementById("app").innerHTML = `

        <div>${benar} benar · ${salah} salah · ${Math.floor(durasi/60)}m ${durasi%60}s</div>
        <div style="color:var(--gray); margin-top:8px;">${rewardLine}</div>
      </div>
      <h3>Pembahasan</h3>
      ${u.soal.map((s, i) => {
        const pick = u.jawaban[i];

            </div>
            ${s.pembahasan_id ? `<div style="font-size:12px; color:var(--gray); margin-top:4px;">${s.pembahasan_id}</div>` : ""}
            <button class="btn sm ghost" style="margin-top:8px; align-self:flex-start;"
                    onclick='rangkumPopup({arti:"${kunciTeks.replace(/"/g,"\\&quot;").slice(0,80)}"}, "Soal ${i+1}: ${safeQ}")'>➕ Rangkum kata dari soal ini</button>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SHIROSE NIHONGO — Learn Japanese. Track Your Progress. Build Your Future.</title>
<meta name="description" content="SHIROSE NIHONGO by SSW no Ou — Platform belajar bahasa Jepang JLPT N5-N1."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SHIROSE"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#161b36"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" href="./icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"/>

<style>
:root{
  --navy:#161b36; --navy-2:#1f2650; --navy-3:#2a3270; --navy-4:#0d1024;
  --pink:#ef6a9a; --pink-light:#f58bb0; --pink-dark:#c8325a;
  --gold:#ffd700; --purple:#8b5cf6; --cyan:#22d3ee; --green:#10b981;
  --red:#ef4444; --orange:#f59e0b;
  --white:#ffffff; --off:#f6f4fa; --gray:#b9bfd9; --gray-dim:#7a80a0;
  --border:#2a3060; --border-light:#3a4080;
  --font-jp:'Shippori Mincho B1', 'Noto Serif JP', serif;
  --font-sans:'Zen Kaku Gothic New', 'Inter', system-ui, -apple-system, sans-serif;
  --shadow-glow: 0 0 30px rgba(239,106,154,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  color:var(--white);
  background:
    radial-gradient(ellipse at 20% 30%, rgba(139,92,246,.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(239,106,154,.15) 0%, transparent 50%),
    linear-gradient(to bottom, var(--navy-4), var(--navy));
  min-height:100vh;
  overflow-x:hidden;
}
@media (max-width:768px){ body{font-size:15px;} }
@media (max-width:640px){
  body{font-size:16px;}
  h1{font-size:24px;}
  h2{font-size:20px;}
  h3{font-size:17px;}
  p{font-size:15px;}
  .panel{padding:16px 14px;}
}

/* ========== Mobile safe-area + touch targets ========== */
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
@media (max-width:640px){
  .btn{min-height:44px; padding:10px 16px; font-size:14px;}
  .btn.sm{min-height:36px; padding:6px 12px; font-size:12px;}
  .chip{min-height:36px;}
  input, select, textarea{min-height:44px; font-size:16px;} /* 16px prevents iOS zoom on focus */
  .opsi{min-height:52px; padding:14px 16px; font-size:15px;}
  table{font-size:13px;}
}
/* Hide scrollbars on horizontal carousels on mobile */
.hscroll{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;}
.hscroll::-webkit-scrollbar{display:none;}
.hscroll > *{scroll-snap-align:start; flex:0 0 auto;}

/* ========== CHARACTER COMPANION + JURUS BURST (Part 24 + 25) ========== */
/* Small SVG/emoji avatar in a corner during Hafalan & Ujian. */
.companion{
  position:fixed; z-index:40; pointer-events:none;
  left:12px; bottom:calc(16px + env(safe-area-inset-bottom));
  width:88px; height:88px;
  display:flex; align-items:flex-end; justify-content:center;
  user-select:none;
}
@media (max-width:640px){
  .companion{width:64px; height:64px; left:8px; bottom:calc(12px + env(safe-area-inset-bottom));}
}
.companion .avatar{
  font-size:54px; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
  animation:compIdle 2.8s ease-in-out infinite;
}
@media (max-width:640px){ .companion .avatar{font-size:40px;} }
@keyframes compIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.companion .weapon{
  position:absolute; right:0; bottom:18px;
  font-size:28px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
  animation:weaponSway 3.4s ease-in-out infinite;
}
@media (max-width:640px){ .companion .weapon{font-size:22px; bottom:14px;} }
@keyframes weaponSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.companion.cheer .avatar{animation:compCheer .6s ease-out;}
@keyframes compCheer{
  0%{transform:scale(1);}
  40%{transform:scale(1.25) translateY(-10px);}
  100%{transform:scale(1);}
}
.companion .aura{
  position:absolute; inset:-8px; border-radius:50%;
  opacity:.25; filter:blur(10px);
  animation:auraPulse 2.5s ease-in-out infinite;
}
@keyframes auraPulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.35;transform:scale(1.1)}}

/* Jurus burst (fires when the student gets a correct answer) */
.burst{
  position:fixed; inset:0; pointer-events:none; z-index:95;
  display:flex; align-items:center; justify-content:center;
}
.burst .burst-ring{
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 70%);
  animation:burstRing .8s ease-out forwards;
}
@keyframes burstRing{
  0%{transform:scale(.2); opacity:0;}
  30%{opacity:1;}
  100%{transform:scale(3); opacity:0;}
}
.burst .burst-text{
  position:absolute; font-family:var(--font-jp); font-weight:800;
  font-size:52px; letter-spacing:2px; text-align:center;
  text-shadow:0 2px 20px rgba(255,255,255,.6), 0 0 40px currentColor;
  animation:burstText .9s ease-out forwards;
}
@keyframes burstText{
  0%{transform:scale(.4); opacity:0;}
  35%{transform:scale(1.15); opacity:1;}
  65%{transform:scale(1); opacity:1;}
  100%{transform:scale(1.4); opacity:0;}
}
.burst .particle{
  position:absolute; width:8px; height:8px; border-radius:50%;
  background:currentColor; opacity:.9;
  animation:burstPart .9s ease-out forwards;
}
@keyframes burstPart{
  0%{transform:translate(0,0) scale(.6); opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) scale(0); opacity:0;}
}

/* ========== FLOATING BACK + HOME (always available on sub-pages) ========== */
.fab-nav{
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); right:16px;
  z-index:90; display:flex; flex-direction:column; gap:10px;
  transition:opacity .2s, transform .2s;
}
.fab-nav.hidden{opacity:0; pointer-events:none; transform:translateY(20px);}
.fab-nav .fab{
  width:52px; height:52px; border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg,#ef6a9a,#c8325a); color:white; border:none;
  box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.08);
  font-size:20px; font-weight:800; transition:transform .12s, box-shadow .12s;
  display:flex; align-items:center; justify-content:center;
}
.fab-nav .fab:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(239,106,154,.5);}
.fab-nav .fab:active{transform:translateY(0);}
.fab-nav .fab.home{background:linear-gradient(135deg,#ffd700,#c89300); color:#2a1810;}
@media (max-width:640px){
  .fab-nav{bottom:calc(14px + env(safe-area-inset-bottom)); right:14px;}
  .fab-nav .fab{width:48px; height:48px; font-size:18px;}
}

/* ========== PWA INSTALL BUTTON + iOS modal ========== */
.install-btn{
  display:none; align-items:center; gap:6px;
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  border:none; padding:8px 14px; border-radius:999px;
  font-weight:800; font-size:12px; cursor:pointer; transition:all .2s;
  box-shadow:0 2px 12px rgba(16,185,129,.4);
}
.install-btn:hover{transform:translateY(-1px); box-shadow:0 4px 18px rgba(16,185,129,.6);}
.install-btn.visible{display:inline-flex;}
.install-btn::before{content:"⬇️";}
.ios-install-modal{
  position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:9999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.ios-install-modal .card{
  background:var(--navy-2); border:1px solid var(--border);
  border-radius:16px; padding:24px; max-width:420px; width:100%;
  color:var(--white);
}
.ios-install-modal h3{margin-bottom:12px; color:var(--pink);}
.ios-install-modal ol{margin:12px 0 16px 20px; line-height:1.8;}
.ios-install-modal .shareicon{
  display:inline-block; vertical-align:middle;
  color:#0a84ff; font-size:18px;
}

/* ========== TOP BAR ========== */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:rgba(13,16,36,.9); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
@media (max-width:640px){ .topbar{padding:10px 12px; gap:8px;} }
.brand{
  display:flex; align-items:center; gap:8px; font-family:var(--font-jp); font-weight:800; font-size:22px;
  color:var(--white); text-decoration:none;
}
@media (max-width:640px){ .brand{font-size:18px; gap:6px;} }
.brand .rose{color:var(--pink); font-size:26px;}
.topbar-right{margin-left:auto; display:flex; gap:8px; align-items:center;}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px;
  background:rgba(255,255,255,.08); border:1px solid var(--border);
  font-size:12px; font-weight:600; color:var(--white);
  cursor:pointer; transition:all .2s;
}
.chip:hover{background:rgba(255,255,255,.12); border-color:var(--pink);}
.chip.active{background:var(--pink); border-color:var(--pink); color:white;}
.chip .badge{background:var(--gold); color:#2a1810; font-size:10px; padding:2px 6px; border-radius:999px; font-weight:800;}
.chip .coin::before{content:"🪙"; margin-right:2px;}
.chip .lv::before{content:"⭐"; margin-right:2px;}
.chip .streak::before{content:"🔥"; margin-right:2px;}
.btn{
  background:var(--pink); color:white; border:none; padding:8px 16px; border-radius:8px;
  font-weight:700; cursor:pointer; font-family:var(--font-sans); font-size:13px;
  transition:all .15s; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:var(--pink-dark); transform:translateY(-1px); box-shadow:var(--shadow-glow);}
.btn.ghost{background:transparent; border:1px solid var(--border);}
.btn.ghost:hover{background:rgba(255,255,255,.06);}
.btn.danger{background:var(--red);}
.btn.gold{background:var(--gold); color:#2a1810;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}

/* ========== LEVEL PILL ========== */
.lvl-pill-group{display:flex; gap:4px; background:rgba(255,255,255,.05); padding:4px; border-radius:999px;}
.lvl-pill{
  padding:5px 10px; border-radius:999px; font-size:11px; font-weight:800; cursor:pointer;
  border:none; background:transparent; color:var(--gray); transition:all .15s;
  min-width:30px;
}
.lvl-pill:hover{color:var(--white);}
.lvl-pill.active{background:var(--pink); color:white;}
.lvl-pill.locked{color:#555; cursor:not-allowed;}

/* ========== MAIN LAYOUT ========== */
.app{
  max-width:1400px; margin:0 auto; padding:14px;
  display:grid; grid-template-columns:1fr; gap:14px;
}
@media (max-width:640px){ .app{padding:10px; gap:10px;} }
@media (min-width:1024px){
  .app.has-sidepanel{grid-template-columns:360px 1fr;}
}

/* ========== SHOP side-by-side (Parts 18 + 23) ========== */
.shop-layout{
  display:grid; grid-template-columns:360px 1fr; gap:16px;
  margin-top:10px;
}
@media (max-width:860px){ .shop-layout{grid-template-columns:1fr;} }

.shop-preview{
  background:linear-gradient(160deg, rgba(42,50,112,.6), rgba(13,16,36,.6));
  border:1px solid var(--border); border-radius:16px;
  padding:16px; position:sticky; top:12px;
}
@media (max-width:860px){ .shop-preview{position:relative; top:auto;} }

.shop-char{
  width:100%; aspect-ratio:7/10; max-height:380px;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(239,106,154,.15), transparent 70%);
  border-radius:12px; margin-bottom:12px;
}
.shop-char svg{width:70%; height:100%; transition:transform .25s;}
@media (max-width:640px){ .shop-char{max-height:300px;} .shop-char svg{width:60%;} }

.shop-info{text-align:center; margin-bottom:12px;}
.shop-item-name{font-family:var(--font-jp); font-size:22px; font-weight:800; color:var(--pink-light); margin-bottom:6px;}
.shop-item-meta{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--gray);}
.rarity-chip{
  padding:3px 10px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.5px;
}
.rarity-common{background:rgba(255,255,255,.1); color:var(--gray);}
.rarity-uncommon{background:rgba(16,185,129,.18); color:#10b981;}
.rarity-rare{background:rgba(34,211,238,.18); color:#22d3ee;}
.rarity-epic{background:rgba(139,92,246,.18); color:#8b5cf6;}
.rarity-legendary{background:rgba(255,215,0,.18); color:#ffd700;}

.shop-action{margin:12px 0 10px;}
.shop-wallet{text-align:center; font-size:14px; color:var(--gray);}

.shop-items-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px; margin-top:8px;
}
.shop-tile{
  position:relative; background:rgba(42,50,112,.4); border:2px solid var(--border);
  border-radius:12px; padding:10px 8px; cursor:pointer;
  transition:transform .12s, border-color .15s, box-shadow .15s;
  text-align:center;
}
.shop-tile:hover{border-color:var(--pink-light); transform:translateY(-2px);}
.shop-tile:active{transform:scale(.97);}
.shop-tile.sel{border-color:var(--gold); box-shadow:0 0 16px rgba(255,215,0,.35);}
.shop-tile.equipped{border-color:var(--green);}
.shop-tile.locked{opacity:.55;}
.shop-tile-thumb{
  width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  background:rgba(13,16,36,.4); border-radius:8px; overflow:hidden; margin-bottom:6px;
}
.shop-tile-thumb svg{width:70%; height:100%;}
.shop-tile-name{font-size:12px; font-weight:700; color:var(--white); margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.shop-tile-price{font-size:11px; color:var(--pink-light); font-weight:800;}
.shop-tile-rarity{
  position:absolute; top:6px; right:6px; width:12px; height:12px; border-radius:50%;
}

/* ========== LEADERBOARD (Part 15) ========== */
.lb-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.lb-chip{
  padding:8px 14px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.05); border:1px solid var(--border);
  color:var(--gray); font-weight:700; font-size:13px; min-height:36px;
  transition:all .15s;
}
.lb-chip.on{background:var(--pink); border-color:var(--pink); color:white;}
.lb-chip:hover{color:var(--white); border-color:var(--pink-light);}

.lb-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.lb-row{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; border-radius:14px;
  background:rgba(42,50,112,.4); border:1px solid var(--border);
  transition:transform .12s;
}
.lb-row.me{border-color:var(--pink); background:rgba(239,106,154,.1);}
.lb-row:hover{transform:translateX(4px);}
.lb-rank{font-family:var(--font-jp); font-size:26px; font-weight:800; min-width:48px; text-align:center;}
.lb-user{flex:1; min-width:0;}
.lb-name{font-weight:800; font-size:15px; color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lb-meta{font-size:11px; color:var(--gray); margin-top:2px;}
.lb-score{text-align:right; min-width:80px;}
.lb-score{font-family:var(--font-jp); font-size:20px; font-weight:800; color:var(--pink-light);}
.lb-score-lbl{font-size:10px; color:var(--gray-dim); margin-top:2px;}

/* ========== HOME MINI CALENDAR + STREAK WIDGET ========== */
.streak-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:14px;}
.streak-pill{
  display:flex; align-items:center; gap:10px;
  padding:12px 10px; border-radius:14px;
  background:rgba(42,50,112,.4); border:1px solid var(--border);
}
.streak-pill .ico{font-size:28px; line-height:1;}
.streak-pill .num{font-family:var(--font-jp); font-size:22px; font-weight:800; color:var(--white); line-height:1;}
.streak-pill .lbl{font-size:10px; color:var(--gray); margin-top:3px;}
.streak-pill.fire{border-color:rgba(239,106,154,.35);}
.streak-pill.trophy{border-color:rgba(255,215,0,.35);}
.streak-pill.book{border-color:rgba(139,92,246,.35);}
@media (max-width:640px){
  .streak-row{gap:8px;}
  .streak-pill{padding:10px 8px; gap:8px;}
  .streak-pill .ico{font-size:22px;}
  .streak-pill .num{font-size:19px;}
}

.mini-cal-head{display:flex; justify-content:space-between; align-items:center; margin:10px 0 8px;}
.mini-cal{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
  background:rgba(13,16,36,.4); border:1px solid var(--border);
  border-radius:12px; padding:8px;
}
.mini-head{text-align:center; font-size:10px; color:var(--gray-dim); font-weight:800; padding:4px 0;}
.mini-cell{
  aspect-ratio:1/1; position:relative;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.03); border-radius:8px;
  cursor:default;
}
.mini-cell .d{font-size:12px; font-weight:700; color:var(--white);}
.mini-cell.other{opacity:.25;}
.mini-cell.today{outline:2px solid var(--pink);}
.mini-cell.i1{background:rgba(239,106,154,.2);}
.mini-cell.i2{background:rgba(239,106,154,.4);}
.mini-cell.i3{background:rgba(239,106,154,.65);}
.mini-cell.i4{background:var(--pink);}
.mini-totals{
  display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;
  font-size:13px; color:var(--gray);
}

/* ========== RPG DASHBOARD TITLE BLOCK ========== */
.journey-title{
  text-align:center; padding:12px 0 8px; margin-top:4px;
}
.journey-title .jp-title{
  font-family:var(--font-jp); font-weight:800;
  font-size:min(8vw, 34px); line-height:1.15;
  background:linear-gradient(135deg, var(--pink-light), var(--pink));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:2px;
}
.journey-title .jp-subtitle{
  color:var(--gray); font-size:min(3.2vw, 13px);
  letter-spacing:4px; margin-top:4px; font-weight:700;
}

/* ========== RPG DASHBOARD HOME — big, mobile-first ========== */
.rpg-stage{
  position:relative;
  min-height:min(92vh, 720px);
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center, rgba(139,92,246,.18), transparent 70%);
  border-radius:24px;
  padding:10px 0;
}
@media (max-width:640px){ .rpg-stage{min-height:min(86vh, 640px); padding:4px 0;} }

.chara-wrap{
  position:relative;
  width:min(62vw, 340px);
  aspect-ratio:7/10;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}
@media (max-width:640px){ .chara-wrap{width:min(58vw, 280px);} }
.chara-wrap svg{width:100%; height:100%;}

/* Orbital nav ring — fills most of the viewport on mobile */
.orbit{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(95vw, 620px);
  height:min(95vw, 620px);
  pointer-events:none;
  animation: orbitSpin 90s linear infinite;
}
@keyframes orbitSpin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
.orbit svg{width:100%; height:100%; stroke:var(--border); stroke-width:1; fill:none; opacity:.4;}

.orbit-node{
  position:absolute; top:50%; left:50%;
  width:92px; height:92px; margin:-46px 0 0 -46px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg, rgba(31,38,80,.95), rgba(13,16,36,.95));
  border:2px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.55);
  transition:all .2s; pointer-events:auto; z-index:3;
  color:var(--white); text-align:center;
  animation: orbitNodeCounter 90s linear infinite;
}
@keyframes orbitNodeCounter{ from{rotate:0deg;} to{rotate:-360deg;} }
@media (max-width:640px){ .orbit-node{width:84px; height:84px; margin:-42px 0 0 -42px;} }
.orbit-node:hover{
  border-color:var(--pink); box-shadow:0 0 24px rgba(239,106,154,.7);
  transform:scale(1.08);
}
.orbit-node:active{transform:scale(.98);}
.orbit-node .ico{font-size:24px; line-height:1;}
.orbit-node .jp{font-family:var(--font-jp); font-size:14px; font-weight:800; color:var(--white); margin-top:2px; line-height:1;}
.orbit-node .lbl{font-size:9px; font-weight:800; letter-spacing:.5px; color:var(--pink-light); margin-top:2px; line-height:1;}
@media (max-width:640px){
  .orbit-node .ico{font-size:22px;}
  .orbit-node .jp{font-size:13px;}
  .orbit-node .lbl{font-size:8px;}
}

/* ========== PANEL (right column) ========== */
.panel{
  background:linear-gradient(180deg, var(--navy-2), var(--navy));
  border:1px solid var(--border); border-radius:20px; padding:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
@media (max-width:640px){ .panel{padding:18px 16px; border-radius:18px;} }
.panel h2{font-family:var(--font-jp); font-size:26px; margin-bottom:12px; color:var(--pink-light); font-weight:800;}
.panel h3{font-size:18px; margin:18px 0 10px; color:var(--white); font-weight:700;}
@media (max-width:640px){
  .panel h2{font-size:24px;}
  .panel h3{font-size:17px;}
}
.panel-close{float:right; background:transparent; border:none; color:var(--gray); font-size:24px; cursor:pointer; padding:0;}
.panel-close:hover{color:var(--pink);}

/* ========== HERO BAR (under topbar) ========== */
.herobar{
  display:flex; gap:12px; align-items:center;
  background:linear-gradient(90deg, rgba(31,38,80,.6), rgba(13,16,36,.3));
  border:1px solid var(--border); border-radius:16px;
  padding:12px 16px;
}
.herobar .avatar-mini{
  width:50px; height:50px; border-radius:50%;
  background:linear-gradient(135deg, var(--navy-3), var(--navy-2));
  border:2px solid var(--pink); display:flex; align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}
.herobar .info{flex:1; min-width:0;}
.herobar .info .nama{font-weight:800; font-size:14px;}
.herobar .info .meta{font-size:11px; color:var(--gray); margin-top:2px;}
.xp-bar{
  width:100%; height:8px; background:var(--navy-4); border-radius:4px; overflow:hidden; margin-top:6px;
}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--pink), var(--gold)); transition:width .3s;}

/* ========== CARDS ========== */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }

.card{
  background:linear-gradient(135deg, rgba(42,50,112,.4), rgba(31,38,80,.6));
  border:1px solid var(--border); border-radius:14px; padding:14px;
  transition:all .2s; cursor:pointer;
}
.card:hover{border-color:var(--pink); transform:translateY(-2px); box-shadow:0 10px 20px rgba(239,106,154,.2);}
.card .title{font-weight:800; font-size:14px; margin-bottom:4px;}
.card .desc{font-size:11px; color:var(--gray); line-height:1.4;}
.card .meta-row{display:flex; justify-content:space-between; margin-top:10px; font-size:11px;}

/* ========== Shop/Inventory item card ========== */
.item-card{
  position:relative;
  background:linear-gradient(145deg, rgba(42,50,112,.5), rgba(31,38,80,.7));
  border:2px solid var(--border); border-radius:12px;
  padding:8px; cursor:pointer; transition:all .15s;
  text-align:center;
}
.item-card:hover{border-color:var(--pink); transform:translateY(-3px);}
.item-card.owned{border-color:var(--green);}
.item-card.equipped{border-color:var(--gold); background:linear-gradient(145deg, rgba(255,215,0,.15), rgba(31,38,80,.7));}
.item-card.locked{opacity:.5; cursor:not-allowed;}
.item-card .icon-wrap{
  height:100px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
}
.item-card .icon-wrap svg{height:100%; width:auto;}
.item-card .nama{font-size:12px; font-weight:700; margin-top:4px; line-height:1.2;}
.item-card .harga{font-size:11px; color:var(--gold); margin-top:2px;}
.item-card .badge-rarity{
  position:absolute; top:4px; right:4px; font-size:9px; padding:2px 5px; border-radius:4px;
  font-weight:800; text-transform:uppercase; letter-spacing:.5px;
}
.rarity-common{background:#555;}
.rarity-uncommon{background:#10b981;}
.rarity-rare{background:#3b82f6;}
.rarity-legendary{background:#f59e0b; color:#2a1810;}
.rarity-mythic{background:linear-gradient(90deg, #ef6a9a, #8b5cf6); color:white;}

/* ========== Materi (kosakata/kanji/bunpou) ========== */
.search-bar{
  display:flex; gap:8px; margin-bottom:12px;
}
.search-bar input{
  flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-size:14px; font-family:var(--font-sans);
}
.search-bar input:focus{outline:none; border-color:var(--pink);}
.materi-list{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));}
@media (max-width:640px){
  .materi-list{grid-template-columns:1fr; gap:10px;}
}
.materi-item{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:14px;
  padding:16px 14px; cursor:pointer; position:relative;
  transition:transform .12s, border-color .15s;
}
.materi-item:active{transform:scale(.98);}
.materi-item:hover{border-color:var(--pink);}
.materi-item .no-badge{
  position:absolute; top:10px; right:12px;
  font-family:var(--font-sans); font-size:11px; font-weight:700;
  color:var(--gray-dim); letter-spacing:.5px;
}
.materi-item .kanji{font-family:var(--font-jp); font-size:34px; font-weight:800; color:var(--pink-light); line-height:1.1;}
.materi-item .reading{font-size:15px; color:var(--gray); margin-top:4px;}
.materi-item .meaning{font-size:15px; margin-top:6px;}
@media (max-width:640px){
  .materi-item{padding:18px 16px;}
  .materi-item .kanji{font-size:38px;}
  .materi-item .reading{font-size:16px;}
  .materi-item .meaning{font-size:16px;}
}
.no-pill{
  display:inline-block; padding:3px 10px; border-radius:999px;
  background:rgba(239,106,154,.14); color:var(--pink-light);
  font-family:var(--font-sans); font-size:11px; font-weight:700;
  letter-spacing:.8px; margin-bottom:8px;
}

/* ========== HAFALAN selection + session ========== */
.haf-topbar{
  display:flex; justify-content:space-between; align-items:center;
  gap:8px; margin-bottom:10px;
}
.haf-type-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
@media (max-width:640px){ .haf-type-row{grid-template-columns:1fr;} }
.haf-pick{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px; cursor:pointer; color:var(--white); text-align:left;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-pick:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-pick.on{border-color:var(--pink); background:rgba(239,106,154,.14); box-shadow:0 0 12px rgba(239,106,154,.25);}
.haf-pick .lbl{font-weight:800; font-size:15px;}
.haf-pick .sub{font-size:12px; color:var(--gray); margin-top:2px;}

.haf-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.haf-chip{
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,.05); border:1px solid var(--border);
  color:var(--gray); font-weight:700; font-size:12px; cursor:pointer;
  transition:all .15s; min-height:36px;
}
.haf-chip:hover{color:var(--white); border-color:var(--pink-light);}
.haf-chip.on{background:var(--pink); border-color:var(--pink); color:white;}

.haf-mode-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
@media (max-width:640px){ .haf-mode-row{grid-template-columns:1fr;} }
.haf-mode{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px 12px; cursor:pointer; color:var(--white); text-align:center;
  font-family:var(--font-sans); transition:all .15s;
}
.haf-mode .ico{font-size:28px; margin-bottom:4px;}
.haf-mode .lbl{font-weight:800; font-size:14px;}
.haf-mode .sub{font-size:11px; color:var(--gray); margin-top:2px;}
.haf-mode:hover{border-color:var(--pink); transform:translateY(-1px);}
.haf-mode.on{border-color:var(--gold); background:rgba(255,215,0,.08); box-shadow:0 0 14px rgba(255,215,0,.25);}

/* Matching grid */
.match-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:12px;
}
.match-col{display:flex; flex-direction:column; gap:8px;}
.match-item{
  position:relative; background:rgba(42,50,112,.4); border:1px solid var(--border);
  border-radius:10px; padding:12px; text-align:left; color:var(--white); cursor:pointer;
  font-family:var(--font-sans); transition:all .15s; min-height:60px;
}
.match-item:disabled{opacity:.4; cursor:default;}
.match-item .jp{font-family:var(--font-jp); font-size:22px; font-weight:800; color:var(--pink-light);}
.match-item .rd{font-size:11px; color:var(--gray); margin-top:2px;}
.match-item .id{font-size:14px; line-height:1.4;}
.match-item:hover:not(:disabled){border-color:var(--pink);}
.match-item.picked{border-color:var(--gold); background:rgba(255,215,0,.1);}
.match-item.match-ok{border-color:var(--green); background:rgba(16,185,129,.15); color:var(--green);}
.match-item.match-bad{border-color:var(--red); background:rgba(239,68,68,.15); animation:shakeX .3s;}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Multiple choice feedback */
.opsi.opsi-ok{border-color:var(--green); background:rgba(16,185,129,.18);}
.opsi.opsi-bad{border-color:var(--red); background:rgba(239,68,68,.18);}

/* ========== CALENDAR (Part 12) ========== */
.cal-hero{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  margin:10px 0 16px;
}
.cal-hero .cell{
  text-align:center; padding:14px 10px; border-radius:12px;
  background:rgba(42,50,112,.4); border:1px solid var(--border);
}
.cal-hero .num{font-family:var(--font-jp); font-size:30px; font-weight:800; color:var(--pink);}
.cal-hero .lbl{font-size:12px; color:var(--gray); margin-top:2px;}
.cal-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.cal-grid{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
  background:rgba(13,16,36,.4); border:1px solid var(--border);
  border-radius:12px; padding:8px;
}
.cal-head{font-size:11px; color:var(--gray-dim); font-weight:700; text-align:center; padding:4px 0;}
.cal-cell{
  aspect-ratio:1/1; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(255,255,255,.02); border-radius:8px;
  cursor:pointer; transition:all .15s;
}
.cal-cell.other-month{opacity:.3;}
.cal-cell.today{outline:2px solid var(--pink);}
.cal-cell:hover{background:rgba(255,255,255,.08); transform:translateY(-1px);}
.cal-cell .day{font-size:12px; font-weight:800; color:var(--white);}
.cal-cell .dots{display:flex; gap:2px; margin-top:4px;}
.cal-cell .dot{width:5px; height:5px; border-radius:50%;}
.dot-kanji{background:#ef6a9a;}
.dot-kosakata{background:#8b5cf6;}
.dot-latihan{background:#f59e0b;}
.dot-ujian{background:#10b981;}

/* ========== SYLABUS ========== */
.syl-hero{
  text-align:center; padding:18px; border-radius:16px;
  background:linear-gradient(135deg, rgba(239,106,154,.15), rgba(139,92,246,.15));
  border:1px solid var(--border);
}
.syl-hero-num{font-family:var(--font-jp); font-size:54px; font-weight:800; color:var(--pink);}
.syl-hero-lbl{color:var(--gray); font-size:14px;}
.syl-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; margin-top:10px;}
.syl-chunk{
  background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:12px;
  padding:14px; cursor:pointer; transition:transform .12s, border-color .15s;
}
.syl-chunk:hover{transform:translateY(-2px); border-color:var(--pink);}
.syl-chunk.done{border-color:var(--green); background:rgba(16,185,129,.1);}
.syl-chunk-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px;}
.syl-pct{color:var(--pink-light); font-weight:800;}
.syl-chunk.done .syl-pct{color:var(--green);}
.syl-chunk-meta{font-size:11px; color:var(--gray); margin-top:8px;}

/* ========== HAFALAN: status legend + preview list ========== */
.status-legend{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px;}
.stat-pill{
  display:inline-flex; align-items:center;
  padding:5px 10px; border-radius:999px;
  font-size:12px; font-weight:700;
}
.status-preview{
  margin:8px 0 12px; border:1px solid var(--border); border-radius:12px;
  background:rgba(13,16,36,.4); overflow:hidden;
}
.status-preview summary{
  padding:10px 14px; cursor:pointer; user-select:none;
  background:rgba(255,255,255,.04); font-size:13px;
}
.status-preview[open] summary{border-bottom:1px solid var(--border);}
.status-list{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:6px; padding:10px; max-height:340px; overflow-y:auto;
}
.status-item{
  position:relative;
  display:grid; grid-template-columns:auto 1fr auto; gap:8px;
  align-items:center;
  padding:10px 12px; border-radius:10px; border:1px solid;
  font-family:var(--font-sans);
}
.status-item .status-jp{
  font-family:var(--font-jp); font-weight:800; font-size:20px;
  color:var(--pink-light); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.status-item .status-mean{
  grid-column:1/-1; font-size:12px; color:var(--gray); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:1; -webkit-box-orient:vertical;
}
.status-item .no-badge{position:static; font-size:10px;}
.status-item .status-chip{
  padding:3px 8px; border-radius:999px; border:1px solid;
  font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  white-space:nowrap;
}
@media (max-width:640px){
  .status-list{grid-template-columns:1fr; max-height:260px;}
}

/* ========== FLASHCARD v2 — front-only until tap, then reveal ========== */
.flash-stage{
  position:relative; min-height:min(68vh, 520px);
  display:flex; align-items:center; justify-content:center;
  margin:10px 0 18px; overflow:visible;
  user-select:none; -webkit-user-select:none; touch-action:pan-y;
}
.flash-card{
  position:relative; width:100%; max-width:520px; min-height:min(60vh, 440px);
  background:linear-gradient(160deg, rgba(42,50,112,.85), rgba(22,27,54,.85));
  border:1px solid var(--border); border-radius:24px;
  padding:32px 24px; text-align:center;
  box-shadow:0 12px 44px rgba(0,0,0,.4);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, opacity .25s ease;
  cursor:pointer;
  will-change:transform, opacity;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.flash-card .front{
  font-family:var(--font-jp); font-weight:800;
  font-size:min(22vw, 140px); line-height:1.05; color:var(--pink-light);
  margin:14px 0 10px; word-break:break-all;
}
.flash-card .reading{
  display:inline-block; padding:8px 18px; border-radius:999px;
  background:rgba(42,50,112,.6); color:var(--white);
  font-family:var(--font-jp); font-size:26px; margin:10px 0 14px;
}
.flash-card .arti{
  font-size:22px; font-weight:700; color:var(--white);
  line-height:1.4; margin-top:8px;
}
@media (max-width:640px){
  .flash-card .reading{font-size:22px;}
  .flash-card .arti{font-size:20px;}
}
.flash-card .contoh{
  font-size:14px; color:var(--gray); margin-top:12px;
  padding:10px; background:rgba(255,255,255,.04); border-radius:10px;
  text-align:left;
}
.flash-card .tap-hint{
  margin-top:18px; font-size:13px; color:var(--gray-dim);
  letter-spacing:.3px;
  animation:fadeHint 1.6s ease-in-out infinite;
}
@keyframes fadeHint{0%,100%{opacity:.4}50%{opacity:.9}}
/* Reveal state: back face slides in */
.flash-card .back-face{display:none;}
.flash-card.revealed .back-face{display:block; animation:revealFade .25s ease-out;}
.flash-card.revealed .front{font-size:72px; margin-top:0;}
@media (max-width:640px){ .flash-card.revealed .front{font-size:58px;} }
.flash-card.revealed .tap-hint{display:none;}
@keyframes revealFade{0%{opacity:0; transform:translateY(8px)}100%{opacity:1; transform:translateY(0)}}
.flash-card.swiping{transition:none;}
.flash-card.leave-left{transform:translateX(-120%) rotate(-14deg); opacity:0;}
.flash-card.leave-right{transform:translateX(120%) rotate(14deg); opacity:0;}
.flash-card.enter{animation:flashEnter .35s ease-out;}
@keyframes flashEnter{
  0%{transform:translateY(16px) scale(.96); opacity:0;}
  100%{transform:translateY(0) scale(1); opacity:1;}
}
/* Swipe hint badges that fade in as the user drags */
.flash-badge{
  position:absolute; top:24px; padding:6px 16px; border-radius:8px;
  font-weight:800; font-size:14px; letter-spacing:1px;
  opacity:0; pointer-events:none; transition:opacity .15s;
  border:2px solid currentColor; text-transform:uppercase;
}
.flash-badge.left{left:20px; color:#ef5350; transform:rotate(-10deg);}
.flash-badge.right{right:20px; color:#10b981; transform:rotate(10deg);}

/* Three-button action row */
.flash-actions{
  display:grid; grid-template-columns:1fr auto 1fr; gap:10px; margin-top:8px;
}
.flash-btn{
  padding:20px 16px; border-radius:16px; border:none;
  font-weight:800; font-size:18px; cursor:pointer; font-family:var(--font-sans);
  transition:transform .12s, box-shadow .12s, filter .12s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  min-height:76px;
}
.flash-btn .ico{font-size:24px;}
.flash-btn .sub{font-size:11px; opacity:.75; font-weight:600;}
.flash-btn.lupa{
  background:linear-gradient(135deg,#ef5350,#c62828); color:white;
  box-shadow:0 6px 18px rgba(239,83,80,.5);
}
.flash-btn.lupa:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.lupa:active{transform:scale(.97);}
.flash-btn.ingat{
  background:linear-gradient(135deg,#10b981,#059669); color:white;
  box-shadow:0 6px 18px rgba(16,185,129,.5);
}
.flash-btn.ingat:hover{transform:translateY(-2px); filter:brightness(1.08);}
.flash-btn.ingat:active{transform:scale(.97);}
.flash-btn.back{
  background:rgba(255,255,255,.08); color:var(--white);
  border:1px solid var(--border); padding:20px 22px;
}
.flash-btn.back:hover{background:rgba(255,255,255,.14); border-color:var(--pink);}
@media (max-width:640px){
  .flash-btn{font-size:16px; padding:18px 12px; min-height:84px;}
  .flash-btn .ico{font-size:22px;}
}

/* ========== Modals ========== */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(8px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:linear-gradient(160deg, var(--navy-2), var(--navy));
  border:1px solid var(--pink); border-radius:20px; padding:24px;
  width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(239,106,154,.4);
}
.modal h2{font-family:var(--font-jp); color:var(--pink-light); margin-bottom:12px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block; font-size:12px; margin-bottom:4px; color:var(--gray);}
.form-group input, .form-group select, .form-group textarea{
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-family:var(--font-sans); font-size:14px;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:none; border-color:var(--pink);}

/* ========== TOASTS ========== */
.toast-wrap{position:fixed; top:80px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:white; padding:12px 18px; border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  font-weight:700; font-size:13px;
  animation: toastSlide .3s ease-out, toastOut .3s ease-in 2.7s forwards;
}
@keyframes toastSlide{from{transform:translateX(100%); opacity:0;} to{transform:translateX(0); opacity:1;}}
@keyframes toastOut{to{transform:translateX(100%); opacity:0;}}

/* ========== Loading ========== */
.loading{
  display:flex; align-items:center; justify-content:center; padding:40px;
  color:var(--gray); font-size:14px;
}
.loading::before{content:"⏳"; margin-right:8px; font-size:20px; animation:spin 1.5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ========== LEVEL UP OVERLAY ========== */
.levelup-overlay{
  position:fixed; inset:0; background:radial-gradient(circle at center, rgba(239,106,154,.4), rgba(0,0,0,.9));
  display:none; align-items:center; justify-content:center; z-index:150;
  animation: lvup .3s ease-out;
}
.levelup-overlay.show{display:flex;}
@keyframes lvup{from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);}}
.levelup-content{text-align:center;}
.levelup-content .text{
  font-family:var(--font-jp); font-size:60px; font-weight:800;
  background:linear-gradient(135deg, var(--gold), var(--pink));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(255,215,0,.5);
  animation: lvupText 2s ease-out;
}
@keyframes lvupText{0%{transform:scale(0) rotate(-180deg);} 50%{transform:scale(1.2) rotate(10deg);} 100%{transform:scale(1) rotate(0);}}
.levelup-content .lvl{font-size:30px; color:var(--white); margin-top:10px;}

/* ========== KANJI DETAIL ========== */
.kanji-detail{text-align:center; padding:20px;}
.kanji-detail .big-k{font-family:var(--font-jp); font-size:120px; font-weight:800; color:var(--pink);}
.kanji-detail .readings{display:flex; gap:12px; justify-content:center; margin:10px 0;}
.kanji-detail .readings .r{background:rgba(42,50,112,.6); padding:6px 12px; border-radius:8px; font-size:13px;}
.kanji-detail .readings .r .lbl{font-size:10px; color:var(--gray); display:block;}
.contoh-list{text-align:left; margin-top:16px;}
.contoh-item{
  display:flex; justify-content:space-between; gap:10px;
  background:rgba(255,255,255,.04); padding:10px; border-radius:8px; margin-bottom:6px;
}
.contoh-item .jp{font-family:var(--font-jp); font-size:16px; font-weight:700;}
.contoh-item .r{font-size:11px; color:var(--gray);}
.contoh-item .id{font-size:12px; color:var(--off); text-align:right;}

/* ========== Soal / Quiz ========== */
.soal-container{padding:20px;}
.soal-stem{
  font-family:var(--font-jp); font-size:22px; line-height:1.6;
  background:rgba(255,255,255,.04); padding:20px; border-radius:12px; border:1px solid var(--border);
}
.soal-stem rt{font-size:12px; color:var(--pink-light);}
.opsi-list{display:grid; gap:10px; margin-top:16px;}
.opsi{
  background:rgba(42,50,112,.4); border:2px solid var(--border); padding:14px 16px;
  border-radius:10px; cursor:pointer; text-align:left; font-size:16px;
  color:var(--white); font-family:var(--font-sans); transition:all .15s;
}
.opsi:hover{border-color:var(--pink); background:rgba(42,50,112,.6);}
.opsi.selected{border-color:var(--pink); background:rgba(239,106,154,.2);}
.opsi.correct{border-color:var(--green); background:rgba(16,185,129,.2);}
.opsi.wrong{border-color:var(--red); background:rgba(239,68,68,.2);}
.soal-nav{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
.soal-timer{
  position:sticky; top:0; z-index:5; background:var(--navy-4);
  display:flex; justify-content:space-between; padding:10px 16px; border-radius:10px;
  margin-bottom:12px; border:1px solid var(--border);
}
.soal-timer .time{font-family:var(--font-jp); font-size:18px; font-weight:800; color:var(--gold); transition:color .2s;}
.soal-timer .time.time-danger{color:#ef5350; animation:timerPulse 1s infinite;}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ========== KOMENTAR (public discussion under detail pages) ========== */
.comments-block{
  margin-top:28px; padding-top:20px; border-top:1px dashed var(--border);
  text-align:left;
}
.comments-block h3{margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.comments-block .cmt-count{color:var(--gray-dim); font-size:13px; font-weight:600;}
.comments-list{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
.cmt-item{
  background:rgba(255,255,255,.03); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px;
}
.cmt-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
.cmt-nama{font-weight:800; color:var(--pink-light); font-size:14px;}
.cmt-meta{color:var(--gray-dim); font-size:11px;}
.cmt-text{font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.cmt-delete{color:var(--red); background:transparent; border:none; cursor:pointer; font-size:12px; font-weight:700;}
.cmt-form{
  margin-top:12px; padding:12px; border:1px dashed var(--border); border-radius:12px;
  background:rgba(255,255,255,.02);
}
.cmt-form textarea{
  width:100%; min-height:72px; resize:vertical;
  padding:10px; border-radius:8px; border:1px solid var(--border);
  background:var(--navy-4); color:var(--white); font-family:var(--font-sans);
  font-size:14px;
}
.cmt-form textarea:focus{outline:none; border-color:var(--pink);}
.cmt-form-row{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}

/* ========== KANJI STROKE ORDER (multi-kanji grid) ========== */
.stroke-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:12px; margin:12px 0;
}
.stroke-panel{
  background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:14px;
  padding:10px; display:flex; flex-direction:column; align-items:center;
}
.stroke-panel-head{
  font-family:var(--font-jp); font-weight:800; font-size:18px;
  color:var(--pink-light); margin-bottom:6px;
}
.stroke-wrap{
  background:#fff; border-radius:12px; padding:8px;
  width:100%; aspect-ratio:1/1; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.stroke-wrap svg{width:100%; height:100%; display:block;}
.stroke-wrap svg path{
  fill:none; stroke:#0f172a; stroke-width:4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--len, 500); stroke-dashoffset:var(--len, 500);
  transition:stroke-dashoffset .8s linear;
}
.stroke-wrap svg path.drawn{stroke-dashoffset:0;}
/* KanjiVG stroke numbers live in a separate <g id="kvg:StrokeNumbers_*"> group */
.stroke-wrap svg g[id^="kvg:StrokeNumbers"]{display:none;}
.stroke-wrap.show-numbers svg g[id^="kvg:StrokeNumbers"]{display:block; fill:#ef4444; font-size:7px;}
.stroke-counter{font-size:11px; color:var(--gray-dim); margin-top:4px;}
.stroke-ctrl{display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
.stroke-numlabel{
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
  padding:6px 12px; border-radius:999px;
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  font-size:12px; font-weight:700;
}

/* Furigana toggle: hide ruby reading when exam panel has .no-furigana */
.exam-area ruby rt{transition:opacity .2s;}
.exam-area.no-furigana ruby rt{opacity:0; visibility:hidden;}
.furi-toggle{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  font-size:12px; font-weight:700;
}
.furi-toggle.on{background:var(--pink); border-color:var(--pink); color:white;}

/* ========== Dashboard home grid ========== */
.hub-grid{
  display:grid; gap:14px; margin-top:16px;
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
}
.hub-card{
  background:linear-gradient(135deg, rgba(42,50,112,.5), rgba(31,38,80,.7));
  border:1px solid var(--border); border-radius:16px; padding:18px 16px;
  display:flex; gap:14px; align-items:center; cursor:pointer; transition:all .15s;
  min-height:76px;
}
.hub-card:active{transform:scale(.98);}
.hub-card:hover{border-color:var(--pink); transform:translateY(-2px);}
.hub-card .ico{font-size:38px; line-height:1;}
.hub-card .info .ttl{font-weight:800; font-size:16px;}
.hub-card .info .sub{font-size:13px; color:var(--gray);}
@media (max-width:640px){
  .hub-card{padding:18px; min-height:84px;}
  .hub-card .ico{font-size:42px;}
  .hub-card .info .ttl{font-size:17px;}
  .hub-card .info .sub{font-size:14px;}
}

/* ========== EMPTY state ========== */
.empty{
  text-align:center; padding:40px 20px; color:var(--gray);
}
.empty .emoji{font-size:48px; margin-bottom:12px;}

/* ========== HEATMAP ========== */
.heatmap{display:grid; grid-template-columns:repeat(20, 1fr); gap:2px; margin:10px 0;}
.heatmap .cell{aspect-ratio:1; border-radius:2px; background:rgba(255,255,255,.05);}
.heatmap .cell.l1{background:rgba(239,106,154,.3);}
.heatmap .cell.l2{background:rgba(239,106,154,.5);}
.heatmap .cell.l3{background:rgba(239,106,154,.7);}
.heatmap .cell.l4{background:var(--pink);}

/* ========== Guru link ========== */
.guru-link{
  position:fixed; bottom:16px; right:16px; z-index:10;
  background:linear-gradient(135deg, #8b5cf6, #ef6a9a);
  color:white; padding:10px 16px; border-radius:50px;
  text-decoration:none; font-weight:700; font-size:12px;
  box-shadow:0 10px 30px rgba(139,92,246,.4);
}
.guru-link:hover{transform:translateY(-2px); box-shadow:0 15px 40px rgba(139,92,246,.6);}

.hidden{display:none !important;}
</style>
</head>

<script type="module">
import { renderCharacter, CATALOG, CATALOG_LABELS, DEFAULT_EQUIPPED } from "./js/character.js";
import { allShopItems } from "./js/shop-seed.js";
import { ACHIEVEMENTS } from "./js/achievements.js";
import * as FB from "./js/firebase-sync.js";

/* ========== STATE ========== */
const state = {
  level: localStorage.getItem("shirose-lvl") || "n5",   // active JLPT level
  user: null,
  siswa: null,
  gami: { xp:0, koin:0, streak:0, level_karakter:1 },
  authMode: "login",
  materi: { kosakata:{}, kanji:{}, bunpou:{} },
  srs: {},
};
window.state = state;

/* ========== TOAST ========== */
/* ========== KOMENTAR (public per-item discussion) ========== */
// Render a placeholder div + schedule async load. The composite key is
// baked into the element id so a re-render replaces the right block.
function _commentsPlaceholder(tipe, lvl, no){
  const id = `cmts-${tipe}-${lvl}-${no}`;
  setTimeout(() => _loadComments(tipe, lvl, no, id), 0);
  return `<div class="comments-block" id="${id}">
    <h3>💬 Catatan & diskusi <span class="cmt-count">(memuat…)</span></h3>
  </div>`;
}
async function _loadComments(tipe, lvl, no, hostId){
  const host = document.getElementById(hostId);
  if (!host) return;
  let list = [];
  try { list = await FB.listKomentar(tipe, lvl, no); }
  catch(e){ /* non-fatal */ }

  const myUid = state.user?.uid;
  const canModerate = FB.userIsGuru();

  const itemsHtml = list.length ? list.map(c => {
    const isMine = myUid && c.uid === myUid;
    const canDel = isMine || canModerate;
    const when = c.created?.toDate ? c.created.toDate().toLocaleString("id-ID", { dateStyle:"short", timeStyle:"short" }) : "";
    return `
      <div class="cmt-item">
        <div class="cmt-head">
          <div>
            <span class="cmt-nama">${(c.nama||"Anon").toString().slice(0,40)}</span>
            <span class="cmt-meta">${c.jlpt ? `· ${c.jlpt.toUpperCase()}` : ""} ${c.kelas ? `· ${c.kelas}` : ""} ${when ? `· ${when}` : ""}</span>
          </div>
          ${canDel ? `<button class="cmt-delete" onclick="hapusKomentar('${tipe}','${lvl}',${no},'${c.id}','${c.uid||""}')">🗑 Hapus</button>` : ""}
        </div>
        <div class="cmt-text">${_escapeHtml(c.text||"")}</div>
      </div>`;
  }).join("") : `<p style="color:var(--gray-dim); font-size:13px;">Belum ada catatan. Jadi yang pertama!</p>`;

  const formHtml = state.user ? `
    <form class="cmt-form" onsubmit="submitKomentar(event, '${tipe}', '${lvl}', ${no}); return false;">
      <textarea id="cmt-input-${hostId}" placeholder="Tulis catatan, tips, atau pertanyaan tentang kata ini..." maxlength="1000"></textarea>
      <div class="cmt-form-row">
        <span style="color:var(--gray-dim); font-size:12px;">Catatan akan terlihat oleh semua pengguna.</span>
        <button class="btn gold" type="submit">💬 Kirim</button>
      </div>
    </form>
  ` : `<p style="color:var(--gray-dim); font-size:13px; margin-top:10px;">🔒 <a href="#" onclick="showAuthModal(); return false;" style="color:var(--pink);">Login</a> untuk menulis catatan.</p>`;

  host.innerHTML = `
    <h3>💬 Catatan & diskusi <span class="cmt-count">(${list.length})</span></h3>
    <div class="comments-list">${itemsHtml}</div>
    ${formHtml}
  `;
}
function _escapeHtml(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
window.submitKomentar = async (ev, tipe, lvl, no) => {
  ev.preventDefault();
  const host = document.getElementById(`cmts-${tipe}-${lvl}-${no}`);
  const txtEl = host?.querySelector("textarea");
  const text = txtEl?.value || "";
  if (!text.trim()) return toast("Teks kosong");
  try {
    await FB.tambahKomentar(tipe, lvl, no, text);
    toast("✓ Catatan terkirim");
    if (txtEl) txtEl.value = "";
    _loadComments(tipe, lvl, no, `cmts-${tipe}-${lvl}-${no}`);
  } catch(e){ toast("❌ " + e.message); }
};
window.hapusKomentar = async (tipe, lvl, no, id, ownerUid) => {
  if (!confirm("Hapus catatan ini?")) return;
  try {
    await FB.hapusKomentar(tipe, lvl, no, id, ownerUid);
    toast("✓ Dihapus");
    _loadComments(tipe, lvl, no, `cmts-${tipe}-${lvl}-${no}`);
  } catch(e){ toast("❌ " + e.message); }
};

/* ========== RANGKUMAN SENDIRI (personal word collection) ========== */
// Open a popup to add any word to the student's own Rangkuman. Pre-fills
// kana/arti via a dataset lookup when the user asks or when caller provides.
window.rangkumPopup = (prefilled = {}, sumber = "") => {
  const safe = (s) => (s||"").toString().replace(/"/g,"&quot;");
  const existing = document.getElementById("rangkum-modal");
  if (existing) existing.remove();
  const html = `
    <div class="modal-backdrop open" id="rangkum-modal" onclick="if(event.target===this) closeRangkumPopup()">
      <div class="modal">
        <h2>➕ Tambah ke Rangkuman</h2>
        <p style="color:var(--gray); font-size:13px;">Catat kata yang mau kamu ulang-ulang nanti di menu Rangkuman.</p>
        ${sumber ? `<p style="font-size:12px; color:var(--gray-dim); background:rgba(255,255,255,.04); padding:8px 10px; border-radius:8px; margin-top:8px;">📍 Sumber: ${sumber}</p>` : ""}
        <div class="form-row" style="margin-top:14px;">
          <label>Kata (日本語)</label>
          <input id="rk-jp" value="${safe(prefilled.jp)}" placeholder="misal: 食べる" style="flex:1; font-family:var(--font-jp); font-size:20px;"/>
        </div>
        <div class="form-row">
          <label>Kana</label>
          <input id="rk-kana" value="${safe(prefilled.kana)}" placeholder="opsional, misal: たべる" style="flex:1;"/>
        </div>
        <div class="form-row">
          <label>Arti</label>
          <input id="rk-arti" value="${safe(prefilled.arti)}" placeholder="bahasa Indonesia" style="flex:1;"/>
        </div>
        <button class="btn ghost sm" onclick="rangkumAutoLookup()" style="margin-top:8px;">🔍 Cari otomatis di kamus SHIROSE</button>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn gold" onclick="rangkumSimpan('${safe(sumber)}')" style="flex:1;">💾 Simpan</button>
          <button class="btn ghost" onclick="closeRangkumPopup()">Batal</button>
        </div>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
  setTimeout(() => document.getElementById("rk-jp")?.focus(), 50);
};

window.closeRangkumPopup = () => { const m = document.getElementById("rangkum-modal"); if (m) m.remove(); };

window.rangkumAutoLookup = async () => {
  const jp = document.getElementById("rk-jp").value.trim();
  if (!jp) return toast("Isi kata dulu");
  // Search all levels across kosakata & kanji
  for (const lvl of ["n5","n4","n3","n2","n1"]){
    const kos = await loadMateri("kosakata", lvl);
    const m = kos.find(it => (it.kata || it.k) === jp);
    if (m){
      document.getElementById("rk-kana").value = m.kana || "";
      document.getElementById("rk-arti").value = m.arti || "";
      toast(`✓ Ditemukan: kosakata ${lvl.toUpperCase()} No.${String(m.no||"-").padStart(3,"0")}`);
      return;
    }
    const knj = await loadMateri("kanji", lvl);
    const mk = knj.find(it => (it.kanji || it.k) === jp);
    if (mk){
      document.getElementById("rk-kana").value = mk.kana || "";
      document.getElementById("rk-arti").value = mk.arti || "";
      toast(`✓ Ditemukan: kanji ${lvl.toUpperCase()} No.${String(mk.no||"-").padStart(3,"0")}`);
      return;
    }
  }
  toast("Tidak ditemukan — tulis arti sendiri ya");
};

window.rangkumSimpan = async (sumber) => {
  if (!state.user) return toast("Login dulu untuk menyimpan rangkuman");
  const jp = document.getElementById("rk-jp").value.trim();
  const kana = document.getElementById("rk-kana").value.trim();
  const arti = document.getElementById("rk-arti").value.trim();
  if (!jp) return toast("Kata tidak boleh kosong");
  try {
    const res = await FB.tambahRangkuman({ jp, kana, arti, sumber });
    if (res && res.synced === false){
      toast(`✓ "${jp}" tersimpan (offline — sync nanti)`);
    } else {
      toast(`✓ "${jp}" masuk ke rangkuman`);
    }
    closeRangkumPopup();
  } catch(e){ toast("❌ " + e.message); }
};

/* ========== RANGKUMAN view ========== */
// Behaves exactly like the Hafalan selection screen, but with the type
// locked to "rangkuman" so the student sees preview + modes + start btn
// for their own collection. Comes with a "🗑 Kelola kata" shortcut to
// delete entries from the collection.
async function renderRangkuman(){
  if (!state.user){
    return `<div class="panel"><h2>📒 Rangkuman</h2>

function renderLevelPills(){
  const pills = document.getElementById("lvl-pills");
  const levels = ["n5","n4","n3","n2","n1"];
  const akses = state.siswa?.aksesLevel || { n5:true, n4:false, n3:false, n2:false, n1:false };
  pills.innerHTML = levels.map(l => {
    const locked = !akses[l] && !FB.userIsGuru();
    const active = state.level === l;
    return `<button class="lvl-pill ${active?'active':''} ${locked?'locked':''}" ${locked?'disabled':''}
            onclick="setLevel('${l}')">${l.toUpperCase()}</button>`;
  }).join("");
}
// Access guard for JLPT level. Guest gets N5 only; guru gets everything;
// student goes by siswa.aksesLevel.
function canAccessLevel(lvl){
  if (!lvl) return false;
  if (FB.userIsGuru()) return true;
  const akses = state.siswa?.aksesLevel;
  if (!akses){ return lvl === "n5"; } // sensible default for guest / new signup
  return !!akses[lvl];
}
window.canAccessLevel = canAccessLevel;

window.setLevel = async (lvl) => {
  if (!canAccessLevel(lvl)){
    toast("🔒 Level " + lvl.toUpperCase() + " belum dibuka — hubungi guru untuk akses");
    return;
  }
  state.level = lvl;
  localStorage.setItem("shirose-lvl", lvl);
  renderLevelPills();
  await loadGami();
  updateChips();
  route(location.hash.slice(1) || "home");
};

// Snap state.level back to a level the student is allowed to use. Called
// after the siswa doc loads, and defensively before any level-scoped render.
function enforceLevelAccess(){
  if (canAccessLevel(state.level)) return true;
  const akses = state.siswa?.aksesLevel || {};
  const first = ["n5","n4","n3","n2","n1"].find(l => akses[l]) || "n5";
  if (first !== state.level){
    state.level = first;
    localStorage.setItem("shirose-lvl", first);
    renderLevelPills();
  }
  return false;
}
window.enforceLevelAccess = enforceLevelAccess;

/* ========== GAMI (XP/koin) ========== */
async function loadGami(){
  if (!state.user) {
    // Guest from localStorage
    const key = `shirose-gami-${state.level}`;
    state.gami = JSON.parse(localStorage.getItem(key) || '{"xp":0,"koin":0,"streak":0,"level_karakter":1}');
    return;
  }
  state.gami = await FB.getGami(state.level);
}
async function awardXP(dXP, dKoin = 0){
  const oldLvl = state.gami.level_karakter || 1;
  if (state.user) {
    state.gami = await FB.tambahXP(state.level, dXP, dKoin);
  } else {
    state.gami.xp = (state.gami.xp || 0) + dXP;
    state.gami.koin = (state.gami.koin || 0) + dKoin;
    state.gami.level_karakter = Math.floor(Math.sqrt(state.gami.xp / 50)) + 1;
    const today = new Date().toISOString().slice(0,10);
    if (state.gami.lastDate !== today) {
      const yd = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.gami.streak = state.gami.lastDate === yd ? (state.gami.streak||0)+1 : 1;
      state.gami.lastDate = today;
    }
    localStorage.setItem(`shirose-gami-${state.level}`, JSON.stringify(state.gami));
  }
  toast(`+${dXP} XP${dKoin?` · +${dKoin} 🪙`:""}`);
  if (state.gami.level_karakter > oldLvl) {
    document.getElementById("levelup-lvl").textContent = `Level ${state.gami.level_karakter}`;
    document.getElementById("levelup").classList.add("show");
    setTimeout(() => document.getElementById("levelup").classList.remove("show"), 2200);
  }
  updateChips();
}
function updateChips(){
  document.getElementById("chip-lv").textContent = state.gami.level_karakter || 1;
  const coinEl = document.getElementById("chip-coin");
  if (FB.hasUnlimitedCoins && FB.hasUnlimitedCoins()){
    coinEl.textContent = "∞";
    coinEl.parentElement.style.background = "linear-gradient(135deg, #ffd700, #c89300)";
    coinEl.parentElement.style.color = "#2a1810";
    coinEl.parentElement.title = "Unlimited coins (developer)";
  } else {
    coinEl.textContent = state.gami.koin || 0;
  }
  document.getElementById("chip-streak").textContent = state.gami.streak || 0;
}

const LEVEL_SCOPED_ROUTES = new Set([
  "materi","kosakata","kanji","bunpou","hafalan","quest","ujian"
]);

// Simple route-history stack so the floating back button can walk through
// the student's path without leaving the SPA.
window._routeStack = window._routeStack || [];
window._skipStackPush = false;

window.goBack = () => {
  if (window._routeStack.length >= 2){
    window._routeStack.pop();                // remove current
    const prev = window._routeStack.pop();   // remove previous (route() will push it back)
    route(prev);
    return;
  }
  route("home");
};

function _updateFabNav(name){
  const fab = document.getElementById("fab-nav");
  if (!fab) return;
  const isHome = !name || name === "home";
  fab.classList.toggle("hidden", isHome);
}

function _renderRoute(name, rest){
  const fn = routes[name] || renderHome;
  const app = document.getElementById("app");
  app.classList.remove("has-sidepanel");
  app.innerHTML = '<div class="loading">Memuat…</div>';
  // Clean up transient overlays from previous page
  if (typeof _unmountCompanion === "function") _unmountCompanion();
  _stopUjianTimer && _stopUjianTimer();
  Promise.resolve(fn(rest)).then(html => {
    if (typeof html === "string") app.innerHTML = html;
    window.scrollTo(0, 0);
  }).catch(e => {
    app.innerHTML = `<div class="panel"><h2>Error</h2><p>${e.message || e}</p><button class="btn" onclick="route('home')">🏠 Kembali Home</button></div>`;
    console.error(e);
  });
}

window.route = (path) => {
  location.hash = path;
  const [name, ...rest] = path.split("/");

  // Track in history stack unless it's a duplicate of the top.
  const top = window._routeStack[window._routeStack.length - 1];
  if (top !== path) window._routeStack.push(path);
  if (window._routeStack.length > 40) window._routeStack.shift();

  _updateFabNav(name);

  // Enforce JLPT access before rendering level-scoped content.
  if (LEVEL_SCOPED_ROUTES.has(name) && !canAccessLevel(state.level)){
    const app = document.getElementById("app");
    const unlocked = Object.entries(state.siswa?.aksesLevel || {}).filter(([,v]) => v).map(([k]) => k.toUpperCase());
    app.innerHTML = `
      <div class="panel">
        <h2>🔒 Level ${state.level.toUpperCase()} belum terbuka</h2>
        <div class="empty">
          <div class="emoji">🔒</div>
          Guru belum memberimu akses ke level ini.<br>
          ${unlocked.length ? `Kamu bisa belajar di: <b>${unlocked.join(", ")}</b>` : "Hubungi guru untuk membuka akses."}
        </div>
        ${unlocked.length ? `<button class="btn" onclick="setLevel('${unlocked[0].toLowerCase()}')">Pindah ke ${unlocked[0]}</button>` : ""}
        <button class="btn ghost" onclick="route('home')">🏠 Kembali Home</button>
      </div>`;
    return;
  }

  _renderRoute(name, rest);
};

/* ========== HOME CALENDAR + STREAK WIDGET ========== */
async function _fillHomeCalendar(){
  const host = document.getElementById("home-cal-body");
  if (!host) return;
  const now = new Date();
  const ymKey = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0");

  // Streaks + this month's activity (both robust against missing rules).
  let activity = {};
  let streak = 0, longest = 0;
  if (state.user){
    activity = await FB.listActivity(ymKey).catch(() => ({}));
    try { [streak, longest] = await _computeStreaks(); }
    catch { streak = 0; longest = 0; }
  }

  // Monthly totals
  const totals = { kanji:0, kosakata:0, latihan:0, ujian:0, days:0 };
  Object.values(activity).forEach(a => {
    totals.kanji += a.kanji||0; totals.kosakata += a.kosakata||0;
    totals.latihan += a.latihan||0; totals.ujian += a.ujian||0;
    if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) totals.days++;
  });

  // Build the mini grid: 7 columns, current month only
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last  = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const startWd = first.getDay();
  const totalDays = last.getDate();
  const cells = [];
  const prevLast = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  for (let i = startWd; i > 0; i--) cells.push({ d: prevLast - i + 1, other:true });
  for (let d = 1; d <= totalDays; d++){
    const ymd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    cells.push({ d, ymd, a: activity[ymd] || null });
  }
  while (cells.length % 7 !== 0) cells.push({ other:true, d:"" });

  const todayYmd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const monthName = first.toLocaleString("id-ID", { month:"long", year:"numeric" });

  const cellHtml = (c) => {
    if (c.other) return `<div class="mini-cell other"><span class="d">${c.d||""}</span></div>`;
    const a = c.a;
    const intensity = a ? Math.min(4, Math.floor(((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0)) / 2) + 1) : 0;
    const isToday = c.ymd === todayYmd ? " today" : "";
    const cls = intensity ? ` i${intensity}` : "";
    return `<div class="mini-cell${cls}${isToday}"><span class="d">${c.d}</span></div>`;
  };

  host.innerHTML = `
    <div class="streak-row">
      <div class="streak-pill fire">
        <span class="ico">🔥</span>
        <div><div class="num">${streak}</div><div class="lbl">Streak saat ini</div></div>
      </div>
      <div class="streak-pill trophy">
        <span class="ico">🏆</span>
        <div><div class="num">${longest}</div><div class="lbl">Terpanjang</div></div>
      </div>
      <div class="streak-pill book">
        <span class="ico">📚</span>
        <div><div class="num">${totals.days}</div><div class="lbl">Hari belajar</div></div>
      </div>
    </div>

    <div class="mini-cal-head">
      <b>${monthName}</b>
      <button class="btn ghost sm" onclick="route('kalender')">Lihat Detail →</button>
    </div>

    <div class="mini-cal">
      ${["M","S","S","R","K","J","S"].map(w => `<div class="mini-head">${w}</div>`).join("")}
      ${cells.map(cellHtml).join("")}
    </div>

    <div class="mini-totals">
      <span>🈷️ ${totals.kanji} kanji</span>
      <span>📖 ${totals.kosakata} kosakata</span>
      <span>🧠 ${totals.latihan} latihan</span>
      <span>📝 ${totals.ujian} ujian</span>
    </div>
  `;
}

/* ========== KANJI STROKE ORDER (KanjiVG, multi-kanji + numbers toggle) ========== */
function _kanjiVgUrl(ch){
  if (!ch) return null;
  const cp = ch.codePointAt(0);
  if (!cp) return null;
  const hex = cp.toString(16).padStart(5, "0");
  return `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex}.svg`;
}
// A character counts as kanji if it's in the CJK Unified Ideographs ranges.
function _isKanjiChar(ch){
  if (!ch) return false;
  const cp = ch.codePointAt(0);
  return (cp >= 0x4E00 && cp <= 0x9FFF)      // main CJK block
      || (cp >= 0x3400 && cp <= 0x4DBF)      // extension A
      || (cp >= 0xF900 && cp <= 0xFAFF);     // compatibility
}

window.showStrokeOrder = async (word) => {
  if (!word) return;
  const existing = document.getElementById("stroke-modal");
  if (existing) existing.remove();

  // Grab every kanji character from the word, preserving order.
  const kanjiChars = Array.from(word).filter(_isKanjiChar);
  if (!kanjiChars.length){
    toast("Tidak ada kanji di kata ini");
    return;
  }

  const showNums = !!state._strokeShowNumbers;

  const panels = kanjiChars.map((c, i) => `
    <div class="stroke-panel">
      <div class="stroke-panel-head">${c}</div>
      <div class="stroke-wrap${showNums?' show-numbers':''}" data-idx="${i}" data-kanji="${c}">
        <div style="color:#333; font-size:12px;">Memuat…</div>
      </div>
      <div class="stroke-counter" data-counter="${i}">—</div>
    </div>`).join("");

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="modal-backdrop open" id="stroke-modal" onclick="if(event.target===this) closeStrokeOrder()">
      <div class="modal" style="max-width:720px;">
        <h2>✍️ Urutan Guratan — ${word}</h2>
        <p style="color:var(--gray); font-size:13px;">Animasi urutan goresan tiap kanji di kata ini (data: KanjiVG).</p>
        <label class="stroke-numlabel">
          <input type="checkbox" ${showNums?"checked":""} onchange="toggleStrokeNumbers(this.checked)"/>
          <span>Tampilkan nomor goresan</span>
        </label>
        <div class="stroke-grid" id="stroke-grid">${panels}</div>
        <div class="stroke-ctrl">
          <button class="btn ghost sm" onclick="replayAllStrokes()">↻ Ulangi semua</button>
          <button class="btn" onclick="closeStrokeOrder()">Tutup</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(wrap.firstElementChild);

  // Load each kanji SVG in parallel
  await Promise.all(kanjiChars.map((c, i) => _loadKanjiPanel(c, i)));
};

async function _loadKanjiPanel(ch, idx){
  const container = document.querySelector(`#stroke-grid .stroke-wrap[data-idx="${idx}"]`);
  const counter = document.querySelector(`#stroke-grid [data-counter="${idx}"]`);
  if (!container) return;
  try {
    const res = await fetch(_kanjiVgUrl(ch));
    if (!res.ok) throw new Error("Not in KanjiVG");
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    const svg = doc.querySelector("svg");
    if (!svg) throw new Error("SVG kosong");

    // Collect stroke paths only (skip number-group text). KanjiVG puts
    // paths under <g id="kvg:StrokePaths_..."> — fallback to all paths.
    let paths = Array.from(svg.querySelectorAll('g[id^="kvg:StrokePaths"] path'));
    if (!paths.length) paths = Array.from(svg.querySelectorAll("path"));
    if (!paths.length) throw new Error("No strokes");
    paths.forEach(p => {
      const len = p.getTotalLength ? p.getTotalLength() : 500;
      p.style.setProperty("--len", len);
    });
    container.innerHTML = "";
    container.appendChild(svg);
    if (counter) counter.textContent = `${paths.length} goresan`;
    _animateStrokes(paths);
  } catch (e){
    container.innerHTML = `
      <div style="color:#64748b; font-size:11px; text-align:center; padding:6px;">
        Data tidak ada.<br>
        <a href="https://jisho.org/search/${encodeURIComponent(ch)}%20%23kanji" target="_blank" rel="noopener" style="color:#ef6a9a;">Jisho</a>
      </div>`;
    if (counter) counter.textContent = "—";
  }
}
function _animateStrokes(paths){
  paths.forEach(p => { p.classList.remove("drawn"); });
  let i = 0;
  const step = () => {
    if (i >= paths.length) return;
    paths[i].classList.add("drawn");
    i++;
    setTimeout(step, 450);
  };
  setTimeout(step, 200);
}
window.replayAllStrokes = () => {
  document.querySelectorAll("#stroke-grid .stroke-wrap").forEach(w => {
    const paths = Array.from(w.querySelectorAll("svg path"));
    if (paths.length) _animateStrokes(paths);
  });
};
window.toggleStrokeNumbers = (on) => {
  state._strokeShowNumbers = !!on;
  document.querySelectorAll("#stroke-grid .stroke-wrap").forEach(w => {
    w.classList.toggle("show-numbers", !!on);
  });
};
window.closeStrokeOrder = () => { const m = document.getElementById("stroke-modal"); if (m) m.remove(); };

async function _renderHafalanSelectImpl(){

  const [kos, knj] = await Promise.all([

  let rangList = [];
  if (state._rangkumanContext && state.user) {
    rangList = await FB.listRangkuman().catch(() => []);
  }
  try { await _loadSrs(); } catch (e) { state.srs = state.srs || {}; }

  const cfg = state.hafalan || { tipe:"kosakata", range:"1-50", filter:"all", mode:"flashcard" };
  state.hafalan = cfg;
  if (!state._rangkumanContext && cfg.tipe === "rangkuman") cfg.tipe = "kosakata";

  // Build a bucket of 50 covering the full dataset for the active type.
  function activePool(){
    const pool = [];
    const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
    if (cfg.tipe === "rangkuman"){
      rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));

      if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
      if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
    }
    return pool;
  }
  const pool = activePool();
  const maxNo = pool.reduce((m, p) => Math.max(m, p.no), 0);

  function makeRanges(n){

    if (n <= 0) return ["all"];
    for (let start = 1; start <= n; start += 50){

      r.push(`${start}-${end}`);

    r.push("all");

  }
  const ranges = makeRanges(maxNo);

  // Ensure cfg.range is valid for the current pool

  // Filtered preview: apply range + filter on the pool
  const now = Date.now();

  if (cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);

        ${chip("filter","mastered","Sudah mastered")}
      </div>

      <div class="status-legend">
        <span class="stat-pill" style="background:rgba(16,185,129,.18); color:#10b981;">● Mastered ${counters.mastered}</span>

window.hafStart = async () => {
  const cfg = state.hafalan;
  const promises = [
    loadMateri("kosakata", state.level),
    loadMateri("kanji", state.level),
  ];
  if (cfg.tipe === "rangkuman" && state.user){
    promises.push(FB.listRangkuman().catch(() => []));
  } else {
    promises.push(Promise.resolve([]));
  }
  const [kos, knj, rangList] = await Promise.all(promises);
  await _loadSrs();

  const pool = [];
  const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
  if (cfg.tipe === "rangkuman"){
    rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));
  } else {
    if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
    if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
  }

  // Range filter
  let inRange = pool;
  if (cfg.range && cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);
    inRange = pool.filter(p => p.no >= lo && p.no <= hi);
  }

  // Status filter
  const now = Date.now();
  const filtered = inRange.filter(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    const card = state.srs[key];
    if (cfg.filter === "new")         return !card;
    if (cfg.filter === "due")         return card && card.due <= now;
    if (cfg.filter === "notmastered") return !card || !card.mastered;
    if (cfg.filter === "mastered")    return !!card?.mastered;
    return true;
  });

  if (!filtered.length){
    toast("Tidak ada item yang cocok dengan filter ini");
    return;
  }

  // Shuffle + cap
  const cap = cfg.mode === "matching" ? Math.min(filtered.length, 20) : Math.min(filtered.length, 20);
  state.hafalan_queue = filtered.sort(() => Math.random() - 0.5).slice(0, cap);
  state.hafalan_pos = 0;
  state.hafalan_score = { benar:0, salah:0 };

  route("hafalan/go");
};

function renderHafalanSession(){
  const cfg = state.hafalan || {};
  const mode = cfg.mode || "flashcard";
  const q = state.hafalan_queue || [];
  if (!q.length) return renderHafalanSelect();

  if (mode === "flashcard") return renderHafalanFlashcard();
  if (mode === "matching")  return renderHafalanMatching();
  if (mode === "multiple")  return renderHafalanMultiple();
  return renderHafalanFlashcard();
}

// Attach touch/pointer handlers for the physical swipe.
function _bindFlashSwipe(card){
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
  const THRESH = 90;             // px needed to commit a rating
  const MOVE_TAP = 8;            // px below this = treat as a tap

  const badgeL = document.getElementById("badge-lupa");
  const badgeR = document.getElementById("badge-ingat");

  function onDown(x, y){
    dragging = true; startX = x; startY = y; dx = 0; dy = 0;
    state._swipeMoved = false;
    card.classList.add("swiping");
  }
  function onMove(x, y){
    if (!dragging) return;
    dx = x - startX; dy = y - startY;
    // Ignore if the user is clearly scrolling vertically
    if (Math.abs(dy) > Math.abs(dx) * 1.2 && Math.abs(dy) > 20){ cancel(); return; }
    if (Math.abs(dx) > MOVE_TAP) state._swipeMoved = true;
    const rot = dx / 20;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    if (badgeL) badgeL.style.opacity = dx < 0 ? Math.min(1, -dx / THRESH) : 0;
    if (badgeR) badgeR.style.opacity = dx > 0 ? Math.min(1, dx / THRESH) : 0;
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    card.classList.remove("swiping");
    if (dx <= -THRESH){
      card.classList.add("leave-left");
      setTimeout(() => hafRate("lupa"), 180);
      return;
    }
    if (dx >= THRESH){
      card.classList.add("leave-right");
      setTimeout(() => hafRate("ingat"), 180);
      return;
    }
    // Snap back
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }
  function cancel(){
    dragging = false;
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }

  // Touch
  card.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchmove",  (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchend",   onUp);
  card.addEventListener("touchcancel", cancel);
  // Mouse (desktop)
  card.addEventListener("mousedown",  (e) => { onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", (e) => { if (dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener("mouseup",   () => { if (dragging) onUp(); });
}

window.hafRate = async (rate) => {
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos];
  if (!it) return;
  // Normalize: accept the old 4 ratings AND the new lupa/ingat
  const normalized = (rate === "lupa" || rate === "salah") ? "lupa"
                   : (rate === "ingat" || rate === "benar" || rate === "mudah" || rate === "ragu") ? "ingat"
                   : "ingat";
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const dayMs = 86400000;
  card.n = (card.n || 0) + 1;
  if (normalized === "lupa"){
    card.interval = 1;
  } else {
    // "ingat" doubles the interval (bounded reasonable minimum)
    card.interval = Math.max(2, Math.round((card.interval || 1) * 2));
  }
  card.due = now + card.interval * dayMs;
  card.last = normalized;
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();

  if (normalized === "ingat"){
    playJurus();   // Part 25: signature animation on correct recall
    await awardXP(3, justMastered ? 1 : 0);
    if (justMastered) toast(`🏆 ${it.tipe === "kanji" ? "Kanji" : "Kosakata"} ${it.front} — MASTERED! +1 🪙`);
    state.hafalan_score.benar++;
    if (state.user) {
      FB.updateMisiProgres("hafalan_10", 1).catch(()=>{});
      const actType = it.tipe === "kanji" ? "kanji" : "kosakata";
      FB.recordActivity(actType).catch(()=>{});
    }
  } else {
    await awardXP(1, 0);
    state.hafalan_score.salah++;
  }

  state.hafalan_pos++;
  document.getElementById("app").innerHTML = renderHafalanSession();
};

window.matchTap = (side, i) => {
  state.match_pick = state.match_pick || {};
  state.match_pick[side] = i;
  document.querySelectorAll(`.match-item[data-side="${side}"]`).forEach(b => b.classList.remove("picked"));
  const btn = document.querySelector(`.match-item[data-side="${side}"][data-i="${i}"]`);
  if (btn) btn.classList.add("picked");

  // When both sides picked, resolve
  if (state.match_pick.L != null && state.match_pick.R != null){
    const L = state.match_pick.L, R = state.match_pick.R;
    const lb = document.querySelector(`.match-item[data-side="L"][data-i="${L}"]`);
    const rb = document.querySelector(`.match-item[data-side="R"][data-i="${R}"]`);
    if (L === R){
      lb.classList.add("match-ok"); rb.classList.add("match-ok");
      lb.disabled = true; rb.disabled = true;
      state.hafalan_score.benar++;
      matchAfterPair(true, L);
    } else {
      lb.classList.add("match-bad"); rb.classList.add("match-bad");
      setTimeout(() => { lb.classList.remove("match-bad","picked"); rb.classList.remove("match-bad","picked"); }, 500);
      state.hafalan_score.salah++;
    }
    state.match_pick = {};
    // If the current batch is cleared, advance
    setTimeout(matchCheckDone, 600);
  }
};
async function matchAfterPair(correct, iInBatch){
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos + iInBatch];
  if (!it) return;
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const mult = correct ? 2 : 1;
  card.n = (card.n || 0) + 1;
  card.interval = correct ? Math.max(1, Math.round((card.interval||1) * mult)) : 1;
  card.due = now + card.interval * 86400000;
  card.last = correct ? "benar" : "salah";
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();
  if (correct){
    _autoSpeakJP(it.front);
    playJurus();
    await awardXP(3, justMastered ? 1 : 0);
    if (justMastered) toast(`🏆 ${it.front} — MASTERED! +1 🪙`);
    if (state.user) {
      const actType = it.tipe === "kanji" ? "kanji" : "kosakata";
      FB.recordActivity(actType).catch(()=>{});
    }
  }
}

/* ========== MODE 3: MULTIPLE CHOICE ========== */
function renderHafalanMultiple(){
  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();
  setTimeout(_mountCompanion, 0);
  const it = q[pos];

  // Build 4 options: 1 correct, 3 distractors drawn from the rest of the queue (or pool).
  const distractors = q.filter((_, i) => i !== pos).map(x => x.back).filter(b => b && b !== it.back);
  const shuffled = Array.from(new Set(distractors)).sort(() => Math.random() - 0.5).slice(0, 3);
  while (shuffled.length < 3) shuffled.push("—");
  const options = [it.back, ...shuffled].sort(() => Math.random() - 0.5);
  state.mc_correct = it.back;

  return `

            ${String.fromCharCode(65+i)}. ${o}
          </button>`).join("")}
      </div>
      <div id="mc-feedback" style="display:none; margin-top:14px; padding:12px; border-radius:10px;"></div>
      <div style="display:none; margin-top:12px; justify-content:center;" id="mc-next">
        <button class="btn gold" onclick="mcNext()">Lanjut →</button>
      </div>

  `;
}
window.mcPick = async (encoded, btn) => {
  const picked = decodeURIComponent(encoded);

  document.querySelectorAll("#mc-opts .opsi").forEach(b => {
    b.disabled = true;

    fb.style.background = "rgba(239,68,68,.15)";

    await awardXP(1, 0);

  // SRS update
  const it = state.hafalan_queue[state.hafalan_pos];
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  card.n = (card.n || 0) + 1;
  card.interval = correct ? Math.max(1, Math.round((card.interval||1) * 2)) : 1;
  card.due = now + card.interval * 86400000;
  card.last = correct ? "benar" : "salah";
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();
  if (justMastered){
    await awardXP(0, 1);

  }
  if (correct && state.user){
    const actType = it.tipe === "kanji" ? "kanji" : "kosakata";
    FB.recordActivity(actType).catch(()=>{});
  }

  document.getElementById("mc-next").style.display = "flex";
};

/* ========== UJIAN engine ========== */
// Real-time countdown: paints #timer every second, auto-submits at 0.
let _ujianTimerId = null;
function _fmtTime(sec){
  const s = Math.max(0, sec|0);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
function _stopUjianTimer(){
  if (_ujianTimerId){ clearInterval(_ujianTimerId); _ujianTimerId = null; }
}
function _startUjianTimer(){
  _stopUjianTimer();
  const tick = () => {
    const u = state.ujian;
    const el = document.getElementById("timer");
    if (!u || !el){ _stopUjianTimer(); return; }
    const remaining = Math.max(0, Math.floor((u.endTime - Date.now()) / 1000));
    el.textContent = "⏱ " + _fmtTime(remaining);
    if (remaining <= 60) el.classList.add("time-danger");
    else el.classList.remove("time-danger");
    if (remaining === 0 && !u.autoSubmitted){
      u.autoSubmitted = true;
      _stopUjianTimer();
      if (typeof toast === "function") toast("⏰ Waktu habis — jawaban dikirim otomatis");
      if (typeof window.ujianSelesai === "function") window.ujianSelesai();
    }
  };
  tick();
  _ujianTimerId = setInterval(tick, 1000);
}

async function renderUjian(params){
  const kategoriId = params[0];
  if (!kategoriId){ _stopUjianTimer(); return renderQuest(); }

  if (!state.user){ _stopUjianTimer(); return `<div class="panel"><h2>Ujian</h2><div class="empty"><div class="emoji">🔒</div>Login dulu untuk mengerjakan ujian.<br><button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`; }

  const katList = await FB.listKategori(state.level);
  const kat = katList.find(x => x.id === kategoriId);
  const durasiMenit = Math.max(1, parseInt(kat?.durasi) || 30);

  const soal = await FB.listSoal(kategoriId);
  if (!soal.length){ _stopUjianTimer(); return `<div class="panel"><h2>Ujian</h2><div class="empty"><div class="emoji">📭</div>Belum ada soal tersedia. Silakan tunggu guru mengunggah soal.</div></div>`; }

  _stopUjianTimer();
  state.ujian = {
    kategoriId,
    soal: soal.sort(() => Math.random() - 0.5),
    pos: 0,
    jawaban: {},
    mulai: Date.now(),
    durasi: durasiMenit,
    endTime: Date.now() + durasiMenit * 60 * 1000,
    autoSubmitted: false,
  };
  setTimeout(_startUjianTimer, 0);
  return renderUjianSoal();
}
function renderUjianSoal(){
  const u = state.ujian;
  const s = u.soal[u.pos];
  const picked = u.jawaban[u.pos];
  const remaining = u.endTime ? Math.max(0, Math.floor((u.endTime - Date.now())/1000)) : 0;
  const furiOff = state.ujianFuriOff ? " no-furigana" : "";
  setTimeout(_mountCompanion, 0);
  return `
    <div class="panel exam-area${furiOff}" id="exam-area">
      <div class="soal-timer">
        <span>Soal ${u.pos+1} / ${u.soal.length}</span>
        <span class="time${remaining<=60?' time-danger':''}" id="timer">⏱ ${_fmtTime(remaining)}</span>
      </div>
      <div style="margin-bottom:10px;">
        <span class="furi-toggle${state.ujianFuriOff?'':' on'}" onclick="toggleFurigana()">
          ${state.ujianFuriOff ? "🙈 Furigana OFF" : "👁 Furigana ON"}
        </span>
      </div>
      <div class="soal-stem">${s.pertanyaan || ""}</div>
      <div class="opsi-list">
        ${(s.opsi || ["A","B","C","D"]).map((o, i) => `
          <button class="opsi ${picked === i ? "selected" : ""}" onclick="pickOpsi(${i})">
            ${String.fromCharCode(65+i)}. ${o}
          </button>
        `).join("")}
      </div>
      <div class="soal-nav">
        <button class="btn ghost" ${u.pos === 0 ? "disabled" : ""} onclick="ujianNav(-1)">← Sebelum</button>
        ${u.pos < u.soal.length - 1
          ? `<button class="btn" onclick="ujianNav(1)">Lanjut →</button>`
          : `<button class="btn gold" onclick="ujianSelesai()">Selesaikan ✔</button>`}
      </div>
    </div>
  `;
}
window.pickOpsi = (i) => {

  document.getElementById("app").innerHTML = renderUjianSoal();
};
// Toggle furigana visibility in exam (persists across questions in the same session)

window.ujianSelesai = async () => {
  _stopUjianTimer();
  const u = state.ujian;
  // Fetch kategori again to know lulus threshold
  let kat = null;
  try {
    const list = await FB.listKategori(state.level);
    kat = list.find(x => x.id === u.kategoriId);

  const lulusMin = kat?.lulus || 60;
  let benar = 0, salah = 0;
  u.soal.forEach((s, i) => {
    const pick = u.jawaban[i];
    const kunci = typeof s.kunci === "string" ? "ABCD".indexOf(s.kunci) : s.kunci;
    if (pick === kunci) benar++;
    else if (pick != null) salah++;
  });
  const skor = Math.round((benar / u.soal.length) * 100);
  const durasi = Math.round((Date.now() - u.mulai) / 1000);
  await FB.catatNilai({ kategoriId: u.kategoriId, skor, benar, salah, waktu: durasi });
  // XP tetap per jawaban benar (Part 5 anti-exploit: tidak di-farm)
  await awardXP(benar * 5, 0);
  // Part 5: 10.000 coins ONCE when passing this kategori
  let lulusReward = { firstTime:false, rewardKoin:0 };
  if (state.user){
    try { lulusReward = await FB.claimUjianLulusReward(u.kategoriId, skor, lulusMin); } catch(e){}
    if (lulusReward.firstTime){

  await FB.updateMisiProgres("benar_20", benar).catch(()=>{});
  await FB.updateMisiProgres("selesai_sesi", 1).catch(()=>{});

  const rewardLine = lulusReward.firstTime
    ? `+${benar*5} XP · <b style="color:var(--gold);">+${lulusReward.rewardKoin.toLocaleString("id-ID")} 🪙 (BONUS LULUS)</b>`
    : (skor >= lulusMin
        ? `+${benar*5} XP · (bonus lulus sudah diklaim sebelumnya)`
        : `+${benar*5} XP · belum lulus (minimum ${lulusMin}) — coba lagi!`);

  document.getElementById("app").innerHTML = `
    <div class="panel">
      <h2>🎉 Ujian Selesai</h2>
      <div class="empty">
        <div class="emoji">${skor >= 80 ? "🏆" : skor >= lulusMin ? "😊" : "💪"}</div>
        <div style="font-size:48px; font-weight:800; color:var(--pink);">${skor}</div>
        <div>${benar} benar · ${salah} salah · ${Math.floor(durasi/60)}m ${durasi%60}s</div>
        <div style="color:var(--gray); margin-top:8px;">${rewardLine}</div>
      </div>
      <h3>Pembahasan</h3>
      ${u.soal.map((s, i) => {
        const pick = u.jawaban[i];
        const kunci = typeof s.kunci === "string" ? "ABCD".indexOf(s.kunci) : s.kunci;
        const kunciTeks = (s.opsi?.[kunci] || "").toString();
        const safeQ = (s.pertanyaan||"").slice(0,80).replace(/"/g,"&quot;").replace(/'/g,"&#39;");
        return `
          <div class="contoh-item" style="flex-direction:column; align-items:stretch; margin-bottom:10px; position:relative;">
            <div><b>${i+1}. ${s.pertanyaan}</b></div>

              Jawabanmu: ${pick!=null ? String.fromCharCode(65+pick) : "(kosong)"} ·
              Kunci: ${String.fromCharCode(65+kunci)} ${kunciTeks}
            </div>
            ${s.pembahasan_id ? `<div style="font-size:12px; color:var(--gray); margin-top:4px;">${s.pembahasan_id}</div>` : ""}
            <button class="btn sm ghost" style="margin-top:8px; align-self:flex-start;"
                    onclick='rangkumPopup({arti:"${kunciTeks.replace(/"/g,"\\&quot;").slice(0,80)}"}, "Soal ${i+1}: ${safeQ}")'>➕ Rangkum kata dari soal ini</button>
          </div>
        `;

      <button class="btn" onclick="route('quest')">Kembali ke Quest</button>
    </div>

};

async function renderShop(){

  const preview = state._shopPreview && hairItems.some(it => it.id === state._shopPreview)

  // Character with the previewed hair swapped in

  // Action area below the preview

  } else if (isOwned){
    actionHtml = `<button class="btn gold" style="width:100%;" onclick="shopEquip('${preview}')">👔 Pakai</button>`;
  } else if (locked){

async function renderKalender(){
  if (!state.user){
    return `<div class="panel"><h2>📅 Kalender Aktivitas</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk melihat kalender.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }
  const now = new Date();
  const navMonth = state._calMonth || now.getMonth();
  const navYear  = state._calYear  || now.getFullYear();
  const ymKey = navYear + String(navMonth+1).padStart(2,"0");
  const activity = await FB.listActivity(ymKey);

  // Monthly totals
  const totals = { kanji:0, kosakata:0, latihan:0, ujian:0, sesi:0, days:0 };
  Object.values(activity).forEach(a => {
    totals.kanji += a.kanji||0; totals.kosakata += a.kosakata||0;
    totals.latihan += a.latihan||0; totals.ujian += a.ujian||0;
    totals.sesi += a.sesi||0;
    if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) totals.days++;
  });

  // Streak + longest streak across ALL activity (pull full list to compute)
  const [streak, longest] = await _computeStreaks();

  // Build month grid
  const first = new Date(navYear, navMonth, 1);
  const last  = new Date(navYear, navMonth+1, 0);
  const startWd = first.getDay(); // 0 Sunday
  const totalDays = last.getDate();
  const cells = [];
  // Previous-month trailing days
  const prevLast = new Date(navYear, navMonth, 0).getDate();
  for (let i = startWd; i > 0; i--){
    cells.push({ d: prevLast - i + 1, other:true });
  }
  for (let d = 1; d <= totalDays; d++){
    const ymd = `${navYear}${String(navMonth+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    cells.push({ d, ymd, a: activity[ymd] || null });
  }
  // Pad to full weeks
  while (cells.length % 7 !== 0) cells.push({ d: cells.length - startWd - totalDays + 1, other:true, pad:true });

  const todayYmd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const monthName = first.toLocaleString("id-ID", { month:"long", year:"numeric" });

  const cellHtml = (c) => {
    if (c.other) return `<div class="cal-cell other-month"><div class="day">${c.d}</div></div>`;
    const a = c.a;
    const dots = a ? [
      a.kanji    ? '<span class="dot dot-kanji" title="Kanji"></span>' : "",
      a.kosakata ? '<span class="dot dot-kosakata" title="Kosakata"></span>' : "",
      a.latihan  ? '<span class="dot dot-latihan" title="Latihan"></span>' : "",
      a.ujian    ? '<span class="dot dot-ujian" title="Ujian"></span>' : "",
    ].join("") : "";
    const isToday = c.ymd === todayYmd ? "today" : "";
    return `<div class="cal-cell ${isToday}" onclick='calShowDay("${c.ymd}", ${JSON.stringify(a||{}).replace(/'/g,"&#39;")})'>
      <div class="day">${c.d}</div>
      <div class="dots">${dots}</div>
    </div>`;
  };

  return `
    <div class="panel">
      <h2>📅 Kalender Aktivitas</h2>

      <div class="cal-hero">
        <div class="cell"><div class="num">${streak}</div><div class="lbl">🔥 Streak sekarang</div></div>
        <div class="cell"><div class="num">${longest}</div><div class="lbl">🏆 Streak terpanjang</div></div>
        <div class="cell"><div class="num">${totals.days}</div><div class="lbl">Hari belajar bulan ini</div></div>
      </div>

      <div class="cal-nav">
        <button class="btn ghost sm" onclick="calNavMonth(-1)">← Bulan lalu</button>
        <b>${monthName}</b>
        <button class="btn ghost sm" onclick="calNavMonth(1)">Bulan depan →</button>
      </div>

      <div class="cal-grid">
        ${["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(w => `<div class="cal-head">${w}</div>`).join("")}
        ${cells.map(cellHtml).join("")}
      </div>

      <div style="margin-top:14px; font-size:12px; color:var(--gray);">
        <b>Total bulan ini:</b>
        🈷️ ${totals.kanji} kanji · 📖 ${totals.kosakata} kosakata ·
        🧠 ${totals.latihan} latihan · 📝 ${totals.ujian} ujian ·
        ⏱ ${totals.sesi} sesi
      </div>

      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn ghost" onclick="route('home')">🏠 Home</button>
      </div>
    </div>
  `;
}

// Compute current + longest streak across the last ~90 days.
async function _computeStreaks(){
  if (!state.user) return [0, 0];
  const now = new Date();
  // Build set of YMD keys that have ≥1 learning activity across last 120 days
  const dayStrings = [];
  for (let i = 0; i < 120; i++){
    const d = new Date(now); d.setDate(d.getDate() - i);
    dayStrings.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`);
  }
  const months = new Set(dayStrings.map(s => s.slice(0,6)));
  let activeDays = new Set();
  for (const ym of months){
    const act = await FB.listActivity(ym);
    Object.entries(act).forEach(([k, a]) => {
      if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) activeDays.add(k);
    });
  }
  // Current streak: walk backward from today until gap
  let cur = 0;
  for (const d of dayStrings){
    if (activeDays.has(d)) cur++;
    else break;
  }
  // Longest streak in that window
  let longest = 0, run = 0;
  // Iterate oldest → newest
  for (let i = dayStrings.length - 1; i >= 0; i--){
    if (activeDays.has(dayStrings[i])) { run++; if (run > longest) longest = run; }
    else run = 0;
  }
  return [cur, longest];
}

async function renderSylabus(){
  if (!state.user){
    return `<div class="panel"><h2>🗺️ Sylabus</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk melihat peta perjalanan belajarmu.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }

  const lvl = state.level;
  const [kos, knj] = await Promise.all([
    loadMateri("kosakata", lvl),
    loadMateri("kanji", lvl),
  ]);
  await _loadSrs();
  const srs = state.srs || {};

  function chapterRows(tipe, data){
    const chunks = [];
    for (let start = 1; start <= data.length; start += 50){
      const end = Math.min(start + 49, data.length);
      // Count mastery within this chunk
      let mastered = 0, learning = 0, brand = end - start + 1;
      for (let no = start; no <= end; no++){
        const key = tipe[0] + ":" + no;
        const c = srs[key];
        if (!c) continue;
        brand--;
        if (c.mastered) mastered++;
        else learning++;
      }
      const totalInChunk = end - start + 1;
      const pct = Math.round((mastered / totalInChunk) * 100);
      chunks.push({ start, end, mastered, learning, brand, totalInChunk, pct });
    }
    return chunks;
  }

  const kosChunks = chapterRows("kosakata", kos);
  const knjChunks = chapterRows("kanji", knj);

  const chunkHtml = (ch, tipe) => {
    const done = ch.pct >= 80;
    const bar = `<div style="background:rgba(255,255,255,.08); height:8px; border-radius:4px; overflow:hidden;">
      <div style="width:${ch.pct}%; height:100%; background:${done ? 'var(--green)' : 'var(--pink)'};"></div>
    </div>`;
    return `
      <div class="syl-chunk ${done?'done':''}" onclick="sylabusOpenChunk('${tipe}',${ch.start},${ch.end})">
        <div class="syl-chunk-head">
          <b>${tipe === 'kosakata' ? '📖' : '🈷️'} No.${String(ch.start).padStart(3,'0')} – No.${String(ch.end).padStart(3,'0')}</b>
          <span class="syl-pct">${ch.pct}%${done?' ✓':''}</span>
        </div>
        ${bar}
        <div class="syl-chunk-meta">
          🟢 ${ch.mastered} mastered · 🟡 ${ch.learning} belajar · ⚪ ${ch.brand} belum
        </div>
      </div>`;
  };

  // Overall progress
  const totalMasterable = kos.length + knj.length;
  let totalMastered = 0;
  Object.values(srs).forEach(c => { if (c?.mastered) totalMastered++; });
  const overallPct = totalMasterable ? Math.round((totalMastered / totalMasterable) * 100) : 0;

  return `
    <div class="panel">
      <h2>🗺️ Sylabus · ${lvl.toUpperCase()}</h2>
      <p style="color:var(--gray); font-size:14px; margin-bottom:12px;">Peta perjalanan belajarmu. Klik setiap chapter untuk mulai hafalan range tersebut.</p>

      <div class="syl-hero">
        <div class="syl-hero-num">${overallPct}%</div>
        <div class="syl-hero-lbl">${totalMastered} / ${totalMasterable} mastered di ${lvl.toUpperCase()}</div>
      </div>

      <h3 style="margin-top:14px;">📖 Kosakata (${kos.length})</h3>
      <div class="syl-grid">
        ${kosChunks.map(c => chunkHtml(c, "kosakata")).join("")}
      </div>

      <h3 style="margin-top:18px;">🈷️ Kanji (${knj.length})</h3>
      <div class="syl-grid">
        ${knjChunks.map(c => chunkHtml(c, "kanji")).join("")}
      </div>

      <h3 style="margin-top:18px;">📝 Ujian</h3>
      <p style="color:var(--gray);">Buka menu <b>Quest</b> untuk daftar ujian ${lvl.toUpperCase()}.</p>
      <button class="btn" onclick="route('quest')">⚔️ Ke Quest</button>

      <h3 style="margin-top:18px;">🎯 Misi Harian</h3>
      <p style="color:var(--gray);">Misi harian masih ada sebagai mini-goal — klik di bawah.</p>
      <button class="btn ghost" onclick="route('misi')">Buka Misi Harian</button>
    </div>
  `;
}

          return `

              <div class="ico">${claimed?"🏆":done?"✅":"🎯"}</div>
              <div class="info" style="flex:1;">
                <div class="ttl">${m.nama}</div>
                <div class="sub">Progres: ${m.progres || 0} / ${m.target} · +${m.reward_xp} XP +${m.reward_koin} 🪙</div>
                <div class="xp-bar" style="margin-top:4px;"><div class="xp-fill" style="width:${Math.min(100,(m.progres||0)/m.target*100)}%"></div></div>
              </div>
              ${done && !claimed ? `<button class="btn gold" onclick="claimMisi('${m.id}')">Klaim</button>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}
window.claimMisi = async (id) => {
  const m = await FB.claimMisi(id, state.level);
  await loadGami();
  updateChips();
  toast(`🎉 +${m.reward_xp} XP · +${m.reward_koin} 🪙`);
  route("misi");
};

/* ========== PROFILE ========== */
async function renderProfile(){
  const akses = state.siswa?.aksesLevel || {};
  const nama = state.siswa?.nama || "Tamu";

  // Load gami all levels
  const allGami = {};
  if (state.user) {
    for (const lvl of ["n5","n4","n3","n2","n1"]) {
      allGami[lvl] = await FB.getGami(lvl);
    }
  }

  // Nilai history
  const riwayat = state.user ? await FB.listNilai(10) : [];

  return `
    <div class="panel">
      <h2>👤 Profil</h2>
      <h3>${nama}</h3>
      <p style="color:var(--gray); font-size:13px;">${state.user?.email || "Tamu"} ${state.siswa?.kelas ? `· Kelas ${state.siswa.kelas}` : ""}</p>

      <h3>Pengaturan</h3>
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px; background:rgba(42,50,112,.4); border:1px solid var(--border); border-radius:10px; margin-bottom:12px;">
        <input type="checkbox" ${isAutoPlayAudio()?'checked':''} onchange="setAutoPlayAudio(this.checked)" style="width:20px; height:20px;"/>
        <span style="flex:1;"><b>🔊 Auto-play audio Jepang</b><br><small style="color:var(--gray);">Pelafalan diputar otomatis setelah kamu rate flashcard</small></span>
      </label>

      <h3>Progres per Level</h3>
      <div class="grid grid-5" style="grid-template-columns:repeat(5,1fr); gap:8px;">
        ${["n5","n4","n3","n2","n1"].map(lvl => {
          const g = allGami[lvl] || { xp:0, koin:0, level_karakter:1 };
          const unlocked = akses[lvl] || FB.userIsGuru();
          return `<div class="card" style="text-align:center; cursor:default;">
            <div style="font-weight:800;">${lvl.toUpperCase()}</div>
            <div style="color:${unlocked?'var(--pink)':'var(--gray-dim)'}; font-size:11px;">${unlocked?'Terbuka':'🔒'}</div>
            <div style="font-size:11px; color:var(--gray); margin-top:6px;">Lv ${g.level_karakter} · ${g.xp} XP</div>
          </div>`;
        }).join("")}
      </div>

      <h3>Riwayat Ujian</h3>
      ${riwayat.length ? riwayat.map(r => `
        <div class="contoh-item">
          <div>${r.kategoriId}</div>
          <div class="id">${r.skor}/100 (${r.benar} benar)</div>
        </div>
      `).join("") : '<div class="empty">Belum ada riwayat ujian.</div>'}

      ${state.user ? `<button class="btn ghost danger" style="margin-top:16px;" onclick="logout()">Keluar</button>` : ""}
    </div>
  `;
}
window.logout = async () => {
  await FB.keluar();
  state.user = null; state.siswa = null;
  toast("Dadah 👋");
  route("home");
};

/* ========== ACHIEVEMENTS ========== */
async function renderAchievements(){
  // Compute status
  const ach = state.user?.achievements || JSON.parse(localStorage.getItem("shirose-ach") || "[]");
  const stats = {
    user: state.user,
    equipped: state.siswa?.karakter?.equipped || {},
    inventory_count_pakaian: (state.siswa?.karakter?.inventory || []).filter(id => CATALOG.pakaian[id]).length,
    total_benar: 0,
    total_ujian: 0,
    ada_nilai_perfect: false,
    streak: state.gami.streak || 0,
    level_karakter: state.gami.level_karakter || 1,
    total_koin: state.gami.koin || 0,
    level_dipelajari: 1,
  };
  return `
    <div class="panel">
      <h2>🏅 Achievement</h2>
      <div class="grid grid-2">
        ${ACHIEVEMENTS.map(a => {
          const got = a.syarat(stats);
          return `
            <div class="card" style="cursor:default; opacity:${got?1:0.5};">
              <div class="title">${got?"🏆":"🔒"} ${a.nama}</div>
              <div class="desc">${a.desc}</div>
              <div class="meta-row"><span>${got?"Diraih":"Belum"}</span><span>+${a.reward_koin} 🪙</span></div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

/* ========== LEADERBOARD ========== */
async function renderLeaderboard(){
  if (!state.user) return `<div class="panel"><h2>🏆 Leaderboard</h2><div class="empty"><div class="emoji">🔒</div>Login dulu untuk lihat ranking.<br><button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;

  const kind = state._lbKind || "global";
  const chip = (k, label) => `<button class="lb-chip ${kind===k?'on':''}" onclick="lbSetKind('${k}')">${label}</button>`;

  // Fetch list for the chosen kind (robust).
  const list = await FB.leaderboardAdvanced(kind, 20).catch(() => []);

  const me = state.user?.uid;

  const scoreLabel = kind === "global" ? "XP total"
                   : kind.startsWith("jlpt-") ? "XP"
                   : "Aktivitas";

  const row = (u, i) => {
    const rankColor = i===0?'var(--gold)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--gray)';
    const isMe = u.uid === me;
    return `
      <div class="lb-row ${isMe?'me':''}">
        <div class="lb-rank" style="color:${rankColor};">#${i+1}</div>
        <div class="lb-user">
          <div class="lb-name">${u.nama}${isMe?' <span style="color:var(--pink); font-size:11px;">(Kamu)</span>':''}</div>
          <div class="lb-meta">${u.kelas?`${u.kelas} · `:''}${u.meta||''}</div>
        </div>
        <div class="lb-score">${(u.score||0).toLocaleString('id-ID')}<div class="lb-score-lbl">${scoreLabel}</div></div>
      </div>
    `;
  };

  return `
    <div class="panel">
      <h2>🏆 Leaderboard</h2>
      <p style="color:var(--gray); font-size:13px; margin-bottom:12px;">Ranking lintas kelas berdasarkan pembelajaran valid.</p>

      <div class="lb-tabs">
        ${chip("global",  "🌐 Global")}
        ${chip("weekly",  "📅 Minggu Ini")}
        ${chip("monthly", "📆 Bulan Ini")}
      </div>
      <div class="lb-tabs" style="margin-top:6px;">
        ${chip("jlpt-n5", "N5")}
        ${chip("jlpt-n4", "N4")}
        ${chip("jlpt-n3", "N3")}
        ${chip("jlpt-n2", "N2")}
        ${chip("jlpt-n1", "N1")}
      </div>

      ${list.length ? `
        <div class="lb-list">
          ${list.map(row).join("")}
        </div>
      ` : `
        <div class="empty">
          <div class="emoji">📭</div>
          Belum ada data untuk kategori ini.<br>
          <small style="color:var(--gray-dim);">Mulai belajar untuk muncul di ranking.</small>
        </div>
      `}
    </div>
  `;
}
window.lbSetKind = (kind) => {
  state._lbKind = kind;
  route("leaderboard");
};

/* ========== AUTH STATE ========== */
FB.onAuth(async (user, siswa) => {
  state.user = user; state.siswa = siswa;
  const btn = document.getElementById("btn-auth");
  if (user) {
    btn.innerHTML = `👋 ${siswa?.nama || user.email.split("@")[0]}`;
    btn.onclick = () => route("profile");
    document.getElementById("guru-link").classList.toggle("hidden", !FB.userIsGuru());
  } else {
    btn.innerHTML = "🔑 Masuk";
    btn.onclick = showAuthModal;
    document.getElementById("guru-link").classList.add("hidden");
  }
  // Snap to an allowed level before loading gami / rendering routes
  if (user && siswa) enforceLevelAccess();
  await loadGami();
  renderLevelPills();
  updateChips();
  route(location.hash.slice(1) || "home");
});

/* ========== INIT ========== */
renderLevelPills();
updateChips();
window.addEventListener("hashchange", () => route(location.hash.slice(1) || "home"));

// Register SW
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* ========== PWA INSTALL ========== */
let _deferredInstallPrompt = null;
const _installBtn = document.getElementById("btn-install");

function _isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true
    || document.referrer.startsWith("android-app://");
}
function _isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Android & Chrome: catch deferred prompt
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  if (!_isStandalone() && _installBtn) _installBtn.classList.add("visible");
});

// Hide button after install
window.addEventListener("appinstalled", () => {
  _deferredInstallPrompt = null;
  if (_installBtn) _installBtn.classList.remove("visible");
  if (typeof toast === "function") toast("✓ SHIROSE NIHONGO terinstal");
});

// iOS Safari has no beforeinstallprompt — show button so user can see the manual guide
if (_isIOS() && !_isStandalone() && _installBtn){
  _installBtn.classList.add("visible");
}

// Entry point from the UI button
window.handleInstallClick = async () => {
  if (_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    const choice = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if (choice && choice.outcome === "accepted"){
      if (_installBtn) _installBtn.classList.remove("visible");
    }
    return;
  }
  if (_isIOS()){ showIOSInstallModal(); return; }
  // Fallback hint when no prompt is available (desktop Chrome already installed, Firefox, etc.)
  toast("Buka menu browser → Install / Add to Home Screen");
};

window.showIOSInstallModal = () => {
  const html = `
    <div class="ios-install-modal" id="ios-install-modal" onclick="if(event.target===this) closeIOSInstall()">
      <div class="card">
        <h3>📲 Install di iPhone / iPad</h3>
        <p style="font-size:14px; color:var(--gray); margin-bottom:12px;">
          Safari tidak punya tombol install otomatis, tapi caranya mudah:
        </p>
        <ol>
          <li>Tekan tombol <b class="shareicon">⬆️ Share</b> di toolbar Safari (biasanya di bawah).</li>
          <li>Scroll di menu Share, lalu pilih <b>"Add to Home Screen"</b> / <b>"Tambahkan ke Layar Utama"</b>.</li>
          <li>Tekan <b>Add</b> di kanan atas. Icon SHIROSE NIHONGO akan muncul di home screen.</li>
          <li>Buka aplikasi dari icon tersebut — akan berjalan fullscreen tanpa browser bar.</li>
        </ol>
        <button class="btn" onclick="closeIOSInstall()">OK, mengerti</button>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
};
window.closeIOSInstall = () => {
  const m = document.getElementById("ios-install-modal");
  if (m) m.remove();
};
</script>

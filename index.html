// Routes that depend on state.level (and therefore on aksesLevel).
const LEVEL_SCOPED_ROUTES = new Set([
  "materi","kosakata","kanji","bunpou","hafalan","quest","ujian","choukai"
]);

// Simple route-history stack so the floating back button can walk through
// the student's path without leaving the SPA.
window._routeStack = window._routeStack || [];
window._skipStackPush = false;

// Detail kosakata/kanji/bunpou dibuka di atas daftar (tanpa ganti hash).
// Tombol kembali/✕/back HP menutup detail → kembali ke daftar & posisi item tadi.
window._materiDetail = null;
window.backFromDetail = async (fromPop) => {
  const d = window._materiDetail; if (!d) return false;
  if (!fromPop && d.pushed){ history.back(); return true; }   // popstate yang menutup
  window._materiDetail = null;
  route(d.back);
  for (let i = 0; i < 40; i++){
    await new Promise(r => setTimeout(r, 60));
    const el = document.querySelector(`.materi-item[onclick="showMateri('${d.tipe}', ${d.idx})"]`);
    if (el){ el.scrollIntoView({ block: "center" }); el.classList.add("just-viewed"); setTimeout(() => el.classList.remove("just-viewed"), 1500); return true; }
  }
  window.scrollTo(0, d.scroll || 0);
  return true;
};
window.addEventListener("popstate", () => {
  const d = window._materiDetail;
  if (d && d.pushed && (location.hash.slice(1) || "") === d.back){ d.pushed = false; window.backFromDetail(true); }
});

// Mapel dipisah: JLPT, Kana, dan SSW tidak saling terhubung. Pindah mapel hanya lewat layar "pilih-level".
const _subjectOf = (path) => { const n = String(path || "").split("/")[0]; if (n.startsWith("ssw")) return "ssw"; if (n.startsWith("kana")) return "kana";
  if (n === "hafalan" && (state.hafalan_ctx === "ssw" || sessionStorage.getItem("shirose-ssw-hafsess"))) return "ssw"; return "jlpt"; };
const _parentOf = (path) => {
  const [n, slug = "building-cleaning", a2] = String(path || "").split("/");
  if (n === "ssw") return "pilih-level";
  if (n === "hafalan" && _subjectOf(path) === "ssw") return state.hafalan_back || "ssw";
  if (n === "ssw-peta") return "ssw";
  if (n === "ssw-bab") return `ssw-peta/${slug}`;
  if (n === "ssw-baca") { const m = /^b(\d+)s/.exec(a2 || ""); return m ? `ssw-bab/${slug}/bab${m[1]}` : `ssw-peta/${slug}`; }
  if (n === "ssw-progres") return "ssw";
  if (n.startsWith("ssw-")) return `ssw-peta/${slug}`;
  if (n === "kana") return "pilih-level";
  if (n.startsWith("kana-")) return "kana";
  return null;
};
window.goBack = () => {
  if (window._materiDetail && (location.hash.slice(1) || "") === window._materiDetail.back){ window.backFromDetail(); return; }
  const here = location.hash.slice(1) || "home";
  const cur = here.split("/")[0];
  const sub = _subjectOf(here);
  const st = window._routeStack;
  if (sub !== "jlpt"){
    // Mundur tepat 1 halaman di mapel yang sama; kalau riwayat habis/beda mapel → halaman induk (bukan pemilihan JLPT).
    let i = st.length - 1;
    while (i >= 0 && (st[i] === here || (cur === "ssw-buku" && String(st[i]).startsWith("ssw-buku")))) i--;
    const prev = i >= 0 ? st[i] : null;
    window._routeStack = st.slice(0, Math.max(0, i));
    if (prev && _subjectOf(prev) === sub && prev !== here){ route(prev); return; }
    route(_parentOf(here) || "pilih-level"); return;
  }
  if (cur === "home" && state.user){ route("pilih-level"); return; }
  if (st.length >= 2){
    st.pop();                // remove current
    const prev = st.pop();   // remove previous (route() will push it back)
    if (_subjectOf(prev) !== "jlpt"){ route("home"); return; }
    route(prev);
    return;
  }
  route("home");
};
window.goHomeFab = () => { const sub = _subjectOf(location.hash.slice(1) || "home"); route(sub === "ssw" ? "ssw" : sub === "kana" ? "kana" : "home"); };

function _updateFabNav(name){
  const fab = document.getElementById("fab-nav");
  if (!fab) return;
  // Halaman pemilihan JLPT = halaman utama siswa (tanpa tombol kembali).
  // Halaman character (home) tetap punya tombol ← untuk kembali ke pemilihan.
  const isRoot = name === "pilih-level" || (!state.user && (!name || name === "home"));
  fab.classList.toggle("hidden", isRoot);
  document.body.classList.toggle("pick-mode", name === "pilih-level");
  // Auth mode: hide topbar / fab / companion on the dedicated login page.
  const isAuth = name === "login" || name === "masuk" || name === "daftar";
  document.body.classList.toggle("auth-mode", isAuth);
  if (isAuth) fab.classList.add("hidden");
}

function _renderRoute(name, rest){
  const fn = routes[name] || renderHome;
  const app = document.getElementById("app");
  app.classList.remove("has-sidepanel");
  app.innerHTML = '<div class="loading">Memuat…</div>';
  // Clean up transient overlays from previous page
  if (typeof _unmountCompanion === "function") _unmountCompanion();
  _stopUjianTimer && _stopUjianTimer();
  Promise.resolve(fn(rest)).then(html => {
    if (typeof html === "string") app.innerHTML = html;
    window.scrollTo(0, 0);
  }).catch(e => {
    app.innerHTML = `<div class="panel"><h2>Error</h2><p>${e.message || e}</p><button class="btn" onclick="route('home')">🏠 Kembali Home</button></div>`;
    console.error(e);
  });
}

window.route = (path) => {
  window._materiDetail = null;
  location.hash = path;
  const [name, ...rest] = path.split("/");

  // Track in history stack unless it's a duplicate of the top.
  const top = window._routeStack[window._routeStack.length - 1];
  if (top !== path) window._routeStack.push(path);
  if (window._routeStack.length > 40) window._routeStack.shift();

  _updateFabNav(name);

  // Alur wajib: LOGIN → PEMILIHAN JLPT → CHARACTER → fitur. Selama siswa
  // belum memilih level di sesi ini, semua halaman diarahkan ke #pilih-level.
  if (state.user && !BEBAS_PILIH_LEVEL.has(name) && !String(name).startsWith("ssw") && !(name === "hafalan" && (state.hafalan_ctx === "ssw" || sessionStorage.getItem("shirose-ssw-hafsess"))) && !levelSudahDipilih()){
    return route("pilih-level");
  }
  renderLevelPills();

  // Enforce JLPT access before rendering level-scoped content.
  if (LEVEL_SCOPED_ROUTES.has(name) && !state.user){
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="panel">
        <h2>🔑 Masuk dulu</h2>

        <button class="btn ghost" onclick="route('home')">🏠 Kembali Home</button>
      </div>`;
    return;
  }
  if (LEVEL_SCOPED_ROUTES.has(name) && !canAccessLevel(state.level)){
    // Pindah otomatis ke level pertama yang dibuka bila ada.
    // Level yang dipilih sudah tidak dibuka guru → kembali ke pemilihan JLPT.
    if (state.user){ _lupakanPilihanLevel(); return route("pilih-level"); }
    const app = document.getElementById("app");
    const unlocked = Object.entries(state.siswa?.aksesLevel || {}).filter(([,v]) => v).map(([k]) => k.toUpperCase());
    app.innerHTML = `
      <div class="panel">
        <h2>🔒 Level ${state.level.toUpperCase()} belum terbuka</h2>
        <div class="empty">
          <div class="emoji">🔒</div>
          Guru belum memberimu akses ke level ini.<br>
          ${unlocked.length ? `Kamu bisa belajar di: <b>${unlocked.join(", ")}</b>` : "Hubungi guru untuk membuka akses."}

        <button class="btn ghost" onclick="route('home')">🏠 Kembali Home</button>
      </div>`;
    return;
  }

};

async function _fillHomeCalendar(){
  const host = document.getElementById("home-cal-body");
  if (!host) return;
  const now = new Date();
  const ymKey = now.getFullYear() + String(now.getMonth()+1).padStart(2,"0");

  // Streaks + this month's activity (both robust against missing rules).
  let activity = {};
  let streak = 0, longest = 0;
  if (state.user){
    activity = await FB.listActivity(ymKey).catch(() => ({}));
    try { [streak, longest] = await _computeStreaks(); }
    catch { streak = 0; longest = 0; }
  }

  // Monthly totals
  const totals = { kanji:0, kosakata:0, latihan:0, ujian:0, days:0 };
  Object.values(activity).forEach(a => {
    totals.kanji += a.kanji||0; totals.kosakata += a.kosakata||0;
    totals.latihan += a.latihan||0; totals.ujian += a.ujian||0;
    if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) totals.days++;
  });

  // Build the mini grid: 7 columns, current month only
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last  = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const startWd = first.getDay();
  const totalDays = last.getDate();
  const cells = [];
  const prevLast = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  for (let i = startWd; i > 0; i--) cells.push({ d: prevLast - i + 1, other:true });
  for (let d = 1; d <= totalDays; d++){
    const ymd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    cells.push({ d, ymd, a: activity[ymd] || null });
  }
  while (cells.length % 7 !== 0) cells.push({ other:true, d:"" });

  const todayYmd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const monthName = first.toLocaleString("id-ID", { month:"long", year:"numeric" });

  // Heat intensity map:
  //   0  -> no color (belum dikerjakan)
  //   1  -> green  (sedikit, 1-19 item)
  //   2  -> yellow (sedang, 20-49)
  //   3  -> orange (lumayan, 50-149)
  //   4  -> red    (bagus, 150-299)
  //   5  -> fire🔥 (brutal, 300+)
  const intensityOf = (a) => {
    if (!a) return 0;
    const total = (a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0);
    if (total === 0) return 0;
    if (total < 20) return 1;
    if (total < 50) return 2;
    if (total < 150) return 3;
    if (total < 300) return 4;
    return 5;
  };
  const cellHtml = (c) => {
    if (c.other) return `<div class="mini-cell other"><span class="d">${c.d||""}</span></div>`;
    const a = c.a;
    const intensity = intensityOf(a);
    const isToday = c.ymd === todayYmd ? " today" : "";
    const cls = intensity ? ` i${intensity}` : "";
    const payload = encodeURIComponent(JSON.stringify({ ymd:c.ymd, a:a||{} }));
    const fire = intensity === 5 ? `<span class="cell-fire">🔥</span>` : "";
    return `<div class="mini-cell${cls}${isToday}" onclick="miniCalDay('${payload}')"><span class="d">${c.d}</span>${fire}</div>`;
  };

  host.innerHTML = `
    <div class="streak-row">
      <div class="streak-pill fire">
        <span class="ico">🔥</span>
        <div><div class="num">${streak}</div><div class="lbl">Streak saat ini</div></div>
      </div>
      <div class="streak-pill trophy">
        <span class="ico">🏆</span>
        <div><div class="num">${longest}</div><div class="lbl">Terpanjang</div></div>
      </div>
      <div class="streak-pill book">
        <span class="ico">📚</span>
        <div><div class="num">${totals.days}</div><div class="lbl">Hari belajar</div></div>
      </div>
    </div>

    <div class="mini-cal-head">
      <b>${monthName}</b>
      <button class="btn ghost sm" onclick="route('kalender')">Lihat Detail →</button>
    </div>

    <div class="mini-cal">
      ${["M","S","S","R","K","J","S"].map(w => `<div class="mini-head">${w}</div>`).join("")}
      ${cells.map(cellHtml).join("")}
    </div>

    <div class="heat-legend">
      <span><i class="sw"></i>Belum</span>
      <span><i class="sw i1"></i>1–19</span>
      <span><i class="sw i2"></i>20–49</span>
      <span><i class="sw i3"></i>50–149</span>
      <span><i class="sw i4"></i>150–299</span>
      <span><i class="sw i5"></i>300+ 🔥</span>
    </div>

    <div class="mini-totals">
      <span>🈷️ ${totals.kanji} kanji</span>
      <span>📖 ${totals.kosakata} kosakata</span>
      <span>🧠 ${totals.latihan} latihan</span>
      <span>📝 ${totals.ujian} ujian</span>
    </div>
  `;
}

/* ========== MATERI LIST (kosakata/kanji/bunpou) ========== */
// Permanent number for an item: prefer data.no, fallback to 1-based index.
function itemNo(it, idx){ return Number.isFinite(it?.no) ? it.no : (idx + 1); }
function fmtNo(n){ return "No." + String(n).padStart(3, "0"); }

/* ===== Kelas kata kosakata (動詞 / 名詞 / い形容詞 / な形容詞) =====
   Tag disimpan di field `pos` tiap kata (data/kosakata-n*.json; guru bisa ubah).
   Filter hanya menyaring tampilan; data asli & kunci SRS (nomor asli) tidak berubah. */
const POS_DEF = [
  { k:"KK",  jp:"動詞",     id:"Kata Kerja" },
  { k:"KB",  jp:"名詞",     id:"Kata Benda" },
  { k:"KSい", jp:"い形容詞", id:"Kata Sifat い" },
  { k:"KSな", jp:"な形容詞", id:"Kata Sifat な" },
];
const posHas = (it, k) => Array.isArray(it?.pos) && it.pos.includes(k);
function posCounts(arr){
  const c = {}; POS_DEF.forEach(d => c[d.k] = arr.filter(it => posHas(it, d.k)).length); return c;
}
function posBar(arr, cur, fn){
  const c = posCounts(arr);
  const btn = (k, lbl, n) => `<button class="pos-chip ${cur === k ? "on" : ""}" onclick="${fn}('${k}')">${lbl}<small>${n}</small></button>`;
  const info = cur === "all" ? `Semua — ${arr.length} kosakata`
    : (() => { const d = POS_DEF.find(x => x.k === cur); return `${d.id} (${d.jp}) — ${c[cur]} kosakata`; })();
  return `<div class="pos-bar"><div class="pos-row">${btn("all", "SEMUA", arr.length)}${POS_DEF.map(d => btn(d.k, `${d.jp} ${d.id}`, c[d.k])).join("")}</div><div class="pos-info">${info}</div></div>`;
}
window.setPosFilter = (k) => { state.posFilter = k; state.materiChunk = state.materiChunk || {}; state.materiChunk[`kosakata-${state.level}`] = 0; renderMateriList("kosakata").then(h => { document.getElementById("app").innerHTML = h; }); };

async function renderMateriList(tipe){
  const data = await loadMateri(tipe, state.level);
  if (tipe === "kanji") { try { await window.KC?.ensure?.(); } catch(_){} }   // progres menulis (lencana ●/★)
  const label = {kosakata:"Kosakata", kanji:"Kanji", bunpou:"Bunpou"}[tipe];
  if (!data.length) return `<div class="panel"><h2>${label}</h2><div class="empty"><div class="emoji">📭</div>Belum ada data untuk level ini.</div></div>`;

  // Filter kelas kata (kosakata): tampilan saja; nomor dihitung ulang dari daftar terfilter.
  const posCur = (tipe === "kosakata" && POS_DEF.some(d => d.k === state.posFilter)) ? state.posFilter : "all";
  const view = data.map((it, i) => ({ it, i })).filter(o => posCur === "all" || posHas(o.it, posCur));
  const posUI = tipe === "kosakata" ? posBar(data, posCur, "setPosFilter") : "";
  const emptyPos = tipe === "kosakata" && !view.length ? `<div class="empty"><div class="emoji">📭</div>Belum ada kosakata untuk kategori ini.</div>` : "";
  // Bagi materi per 50 item: 1–50, 51–100, dst.
  const PER = 50;
  const nChunk = Math.max(1, Math.ceil(view.length / PER));
  state.materiChunk = state.materiChunk || {};
  const ck = `${tipe}-${state.level}`;
  const aktif = Math.min(state.materiChunk[ck] || 0, nChunk - 1);
  const chunkAttr = (idx) => `data-chunk="${Math.floor(idx / PER)}" style="${Math.floor(idx / PER) === aktif ? "" : "display:none"}"`;
  const tabs = nChunk > 1 ? `<div class="chunk-tabs" id="chunk-tabs-${tipe}">${Array.from({length:nChunk}, (_, c) =>
      `<button class="${c === aktif ? "on" : ""}" onclick="setMateriChunk('${tipe}', ${c})">${c*PER + 1}–${Math.min((c+1)*PER, view.length)}</button>`).join("")}</div>` : "";
  const list = view.map((o, vi) => {
    const it = o.it, idx = o.i;
    const no = fmtNo(posCur === "all" ? itemNo(it, idx) : vi + 1);
    const cidx = vi;
    if (tipe === "kosakata") {
      const kana = it.kana || it.f || "";
      const kata = it.kata || it.k || "";
      const arti = it.arti || it.a || "";
      return `<div class="materi-item" ${chunkAttr(cidx)} onclick="showMateri('${tipe}', ${idx}${posCur === "all" ? "" : ", " + (vi + 1)})">
        <span class="no-badge">${no}</span>
        <div class="kanji">${kata}</div>
        <div class="reading">${kana}</div>
        <div class="meaning">${arti}</div>
      </div>`;
    }
    if (tipe === "kanji") {
      const k = it.kanji || it.k || "";
      const kana = it.kana || `${it.on || ""} ${it.kun || ""}`.trim();
      const arti = it.arti || it.a || "";
      const ks = (window.KC && window.KC.kanjiState(state.level, itemNo(it, idx))) || "";
      return `<div class="materi-item ${ks === "mastered" ? "kc-m" : ""}" ${chunkAttr(idx)} onclick="showMateri('${tipe}', ${idx})">
        <span class="no-badge">${no}</span>${ks ? `<i class="kc-kbadge" title="${ks === "mastered" ? "Sudah hafal" : "Sudah dipelajari"}">${ks === "mastered" ? "★" : "●"}</i>` : ""}
        <div class="kanji">${k}</div>
        <div class="reading">${kana}</div>
        <div class="meaning">${arti}</div>
      </div>`;
    }
    if (tipe === "bunpou") {
      const pola = it.pola || it.p || it.kata || "";
      const arti = it.arti || it.e || it.penjelasan || "";
      return `<div class="materi-item" ${chunkAttr(idx)} onclick="showMateri('${tipe}', ${idx})">
        <span class="no-badge">${no}</span>
        <div class="kanji" style="font-size:22px;">${pola}</div>
        <div class="meaning">${arti.slice(0, 120)}${arti.length > 120 ? "…" : ""}</div>
      </div>`;
    }
  }).join("");

  const kanjiBar = tipe !== "kanji" ? "" : (() => {
    const c = (window.KC && window.KC.kanjiCounts(state.level)) || { studied: 0, mastered: 0 };
    return `<div class="kc-kwrap"><span class="lv">Level:</span>${["n5","n4","n3","n2","n1"].map(l => {
      const ok = canAccessLevel(l);
      return `<button class="kc-lvchip ${l === state.level ? "on" : ""} ${ok ? "" : "lock"}" onclick="kanjiSetLevel('${l}')">${l.toUpperCase()}${ok ? "" : " 🔒"}</button>`;
    }).join("")}<span class="lv">· ${c.studied}/${data.length} dipelajari · ${c.mastered} hafal</span></div>
      <div class="kc-note" style="margin:0 0 8px;">Klik kanji untuk detail, lalu <b>書き順を見る</b> (animasi urutan goresan) atau <b>書いてみよう</b> (latihan menulis).</div>`;
  })();
  return `
    <div class="panel">
      <h2>${label === "Kosakata" ? "📖" : label === "Kanji" ? "🈷️" : "📐"} ${label} ${state.level.toUpperCase()}</h2>
      ${kanjiBar}
      <div class="search-bar">
        <input type="text" id="search-${tipe}" placeholder="Cari di semua nomor..." oninput="filterMateri('${tipe}', this.value)"/>
      </div>
      ${posUI}
      ${displayBar("materi")}
      ${tabs}
      <div class="materi-list" id="materi-list-${tipe}">${list}</div>${emptyPos}
    </div>
  `;
}
window.filterMateri = (tipe, q) => {
  const container = document.getElementById(`materi-list-${tipe}`);
  if (!container) return;
  const items = container.querySelectorAll(".materi-item");
  const query = q.toLowerCase().trim();
  const aktif = String((state.materiChunk || {})[`${tipe}-${state.level}`] || 0);
  const tabs = document.getElementById(`chunk-tabs-${tipe}`);
  if (tabs) tabs.style.opacity = query ? ".4" : "";
  items.forEach(el => {
    // Saat mencari: cari di SEMUA bagian. Tanpa kata kunci: tampilkan bagian aktif.
    if (query) el.style.display = el.textContent.toLowerCase().includes(query) ? "" : "none";
    else el.style.display = (el.dataset.chunk == null || el.dataset.chunk === aktif) ? "" : "none";
  });
};
window.setMateriChunk = (tipe, c) => {
  state.materiChunk = state.materiChunk || {};
  state.materiChunk[`${tipe}-${state.level}`] = c;
  const inp = document.getElementById(`search-${tipe}`);
  if (inp) inp.value = "";
  document.querySelectorAll(`#chunk-tabs-${tipe} button`).forEach((b, i) => b.classList.toggle("on", i === c));

};

/* ========== CHARACTER JOURNEY / COMPANION / JURUS (Part 4 + 24 + 25) ========== */
// Per-JLPT character descriptor. Signature weapons come from the master prompt:
//   N5 school student → Nihongo Book
//   N4 high schooler → Dual Books
//   N3 university → Flying Grimoire
//   N2 construction → Hammer
//   N1 businessman → Executive Briefcase
function jlptAvatar(level){
  const map = {
    n5: { body:"🧑‍🎓", weapon:"📖", aura:"#9ca3af", color:"#e5e7eb", jurus:"BOOK OF KNOWLEDGE",     role:"中学生" },
    n4: { body:"🧑‍🎓", weapon:"📚", aura:"#10b981", color:"#10b981", jurus:"DUAL KNOWLEDGE BURST",  role:"高校生" },
    n3: { body:"🧑‍🎓", weapon:"📘", aura:"#8b5cf6", color:"#8b5cf6", jurus:"ARCANE GRIMOIRE",       role:"大学生" },
    n2: { body:"👷", weapon:"🔨", aura:"#f59e0b", color:"#f59e0b", jurus:"GENBA IMPACT",          role:"建設作業員" },
    n1: { body:"🧑‍💼", weapon:"💼", aura:"#ffd700", color:"#ffd700", jurus:"EXECUTIVE DOMINION",   role:"会社員" },
  };
  return map[level] || map.n5;
}

// Jurus burst: show a quick SVG particle burst with the JLPT's signature.
// Called on correct-answer events in all three hafalan modes + exam.
function playJurus(){

  const comp = document.getElementById("companion");

    comp.classList.add("cheer");

      const angle = Math.random() * Math.PI * 2;
      const dist = 140 + Math.random() * 80;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      return `<div class="particle" style="--dx:${dx.toFixed(0)}px; --dy:${dy.toFixed(0)}px; animation-delay:${(Math.random()*0.15).toFixed(2)}s;"></div>`;

}

/* ========== KANJI STROKE ORDER (KanjiVG, multi-kanji + numbers toggle) ========== */
function _kanjiVgUrl(ch){
  if (!ch) return null;
  const cp = ch.codePointAt(0);
  if (!cp) return null;
  const hex = cp.toString(16).padStart(5, "0");
  return `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex}.svg`;
}
// A character counts as kanji if it's in the CJK Unified Ideographs ranges.
function _isKanjiChar(ch){
  if (!ch) return false;
  const cp = ch.codePointAt(0);
  return (cp >= 0x4E00 && cp <= 0x9FFF)      // main CJK block
      || (cp >= 0x3400 && cp <= 0x4DBF)      // extension A
      || (cp >= 0xF900 && cp <= 0xFAFF);     // compatibility
}

const _strokeShards = {};
async function _localStroke(ch){
  const sh = (ch.codePointAt(0) >> 8).toString(16).padStart(3, "0");
  if (!_strokeShards[sh]) _strokeShards[sh] = fetch(`./data/kanji-strokes/${sh}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return (await _strokeShards[sh])[ch] || null;
}
function _strokeSvg(g){
  const nums = g.n || g.s.map(d => { const m = /M\s*([\d.\-]+)[ ,]([\d.\-]+)/.exec(d); return m ? [parseFloat(m[1]) - 6, parseFloat(m[2]) - 2] : [10, 10]; });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109"><g id="kvg:StrokePaths_x">${g.s.map(d => `<path d="${d}"/>`).join("")}</g><g id="kvg:StrokeNumbers_x">${nums.map((n, i) => `<text transform="matrix(1 0 0 1 ${n[0]} ${n[1]})">${i + 1}</text>`).join("")}</g></svg>`;
}
async function _loadKanjiPanel(ch, idx){
  const container = document.querySelector(`#stroke-grid .stroke-wrap[data-idx="${idx}"]`);
  const counter = document.querySelector(`#stroke-grid [data-counter="${idx}"]`);
  if (!container) return;
  try {
    // 1) data goresan lokal (dibundel di repo: data/kanji-strokes/) → tidak tergantung internet/CDN
    // 2) cadangan: KanjiVG lewat CDN
    let text = null;
    try { const g = await _localStroke(ch); if (g) text = _strokeSvg(g); } catch(_){}
    if (!text) {
      const res = await fetch(_kanjiVgUrl(ch));
      if (!res.ok) throw new Error("Not in KanjiVG");
      text = await res.text();
    }
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    const svg = doc.querySelector("svg");
    if (!svg) throw new Error("SVG kosong");

    // Collect stroke paths only (skip number-group text). KanjiVG puts
    // paths under <g id="kvg:StrokePaths_..."> — fallback to all paths.
    let paths = Array.from(svg.querySelectorAll('g[id^="kvg:StrokePaths"] path'));
    if (!paths.length) paths = Array.from(svg.querySelectorAll("path"));
    if (!paths.length) throw new Error("No strokes");
    paths.forEach(p => {
      const len = p.getTotalLength ? p.getTotalLength() : 500;
      p.style.setProperty("--len", len);
    });
    container.innerHTML = "";
    container.appendChild(svg);
    if (counter) counter.textContent = `${paths.length} goresan`;
    _animateStrokes(paths);
  } catch (e){
    container.innerHTML = `
      <div style="color:#64748b; font-size:11px; text-align:center; padding:6px;">
        Data tidak ada.<br>
        <a href="https://jisho.org/search/${encodeURIComponent(ch)}%20%23kanji" target="_blank" rel="noopener" style="color:#ef6a9a;">Jisho</a>
      </div>`;
    if (counter) counter.textContent = "—";
  }
}
// Per-stroke delay by preference. Also tweak CSS transition so slow strokes
// actually draw slower (not just wait longer before the next one).
const STROKE_SPEED_MS = { slow: 1200, medium: 450, fast: 180 };
const STROKE_DRAW_SEC = { slow: 1.1,  medium: 0.6, fast: 0.25 };

function _animateStrokes(paths){
  if (!paths.length) return;
  const speed = state._strokeSpeed || "medium";
  const stepMs = STROKE_SPEED_MS[speed];
  const drawSec = STROKE_DRAW_SEC[speed];
  // Token: animasi lama dibatalkan kalau tombol ulang ditekan berkali-kali.
  const svg = paths[0].ownerSVGElement || paths[0].parentNode;
  const tok = (svg.__strokeTok = (svg.__strokeTok || 0) + 1);
  // Reset INSTAN ke kosong: matikan transisi, hapus class & inline offset.
  paths.forEach(p => {
    p.style.transition = "none";
    p.style.removeProperty("stroke-dashoffset");
    p.classList.remove("drawn");
  });
  void paths[0].getBoundingClientRect();   // paksa reflow
  paths.forEach(p => { p.style.transition = `stroke-dashoffset ${drawSec}s linear`; });
  let i = 0;
  const step = () => {
    if (svg.__strokeTok !== tok || i >= paths.length) return;
    paths[i].classList.add("drawn");
    i++;
    setTimeout(step, stepMs);
  };
  setTimeout(step, 150);
}

// Replay ONE kanji panel (clicked on the kanji square).
window.replayOneStroke = (idx) => {
  const w = document.querySelector(`#stroke-grid .stroke-wrap[data-idx="${idx}"]`);
  if (!w) return;
  let paths = Array.from(w.querySelectorAll('svg g[id^="kvg:StrokePaths"] path'));
  if (!paths.length) paths = Array.from(w.querySelectorAll("svg path"));
  if (!paths.length) return;
  // Dulu: inline stroke-dashoffset dipasang di sini dan MENGALAHKAN class
  // .drawn → garis tidak pernah tergambar ulang. Sekarang reset ada di
  // _animateStrokes (hapus inline style + matikan transisi sesaat).
  _animateStrokes(paths);
};

window.replayAllStrokes = () => {
  document.querySelectorAll("#stroke-grid .stroke-wrap").forEach(w => {
    const paths = Array.from(w.querySelectorAll('svg g[id^="kvg:StrokePaths"] path'));
    const all = paths.length ? paths : Array.from(w.querySelectorAll("svg path"));
    if (!all.length) return;
    _animateStrokes(all);
  });
};

// Change speed — update state, repaint chip highlights, replay all so the new speed is visible.

  document.querySelectorAll(".stroke-speed-chip").forEach(c => c.classList.remove("on"));
  const activeChip = document.querySelector(`.stroke-speed-chip[onclick*="'${val}'"]`);

// SRS key is namespaced per type so kanji and kosakata don't collide.
function _srsKey(tipe, it, idx){ return tipe[0] + ":" + itemNo(it, idx); }

// Normalize an item from kanji or kosakata into a common pair for drills.
function _normalizeItem(tipe, it, idx){
  if (tipe === "kanji"){
    return {
      tipe, idx, no: itemNo(it, idx),
      front: it.kanji || it.k || "",
      reading: it.kana || `${it.on || ""} ${it.kun || ""}`.trim() || "",
      back: it.arti || it.a || "",
    };
  }
  return {
    tipe, idx, no: itemNo(it, idx),
    front: it.kata || it.k || "",
    reading: it.kana || it.f || "",
    back: it.arti || it.a || "",
    pos: it.pos,
  };
}
// Filter kelas kata untuk Hafalan: nomor tampilan (dno) dihitung ulang 1..n; kunci SRS tetap pakai nomor asli.
function _posPool(pool, cfg){
  const k = cfg.tipe === "kosakata" ? cfg.pos : "all";
  if (!POS_DEF.some(d => d.k === k)) { pool.forEach(p => { p.dno = p.no; }); return pool; }
  const out = pool.filter(p => Array.isArray(p.pos) && p.pos.includes(k));
  out.forEach((p, i) => { p.dno = i + 1; });
  return out;
}

// Classify a card by SRS state → status + color.
// Also used to render the preview list in the Hafalan selection screen.
function _cardStatus(card){
  if (!card)                        return { key:"new",      label:"Baru",            color:"#ffffff", bg:"rgba(255,255,255,.08)" };
  if (card.mastered)                return { key:"mastered", label:"Mastered",        color:"#10b981", bg:"rgba(16,185,129,.18)" };
  if ((card.interval||1) >= 10)     return { key:"review",   label:"Review",          color:"#f59e0b", bg:"rgba(245,158,11,.18)" };
  if ((card.interval||1) >= 3)      return { key:"learning", label:"Learning",        color:"#eab308", bg:"rgba(234,179,8,.18)" };
  return                                   { key:"fresh",    label:"Baru dipelajari", color:"#ef5350", bg:"rgba(239,83,80,.18)" };
}

async function _renderHafalanSelectImpl(){
  // Load the two base datasets. Rangkuman only loaded in Rangkuman context.
  const [kos, knj] = await Promise.all([
    loadMateri("kosakata", state.level).catch(() => []),
    loadMateri("kanji", state.level).catch(() => []),
  ]);
  let rangList = [];
  if (state._rangkumanContext && state.user) {
    rangList = await FB.listRangkuman().catch(() => []);
  }
  try { await _loadSrs(); } catch (e) { state.srs = state.srs || {}; }

  const cfg = state.hafalan || { tipe:"kosakata", range:"1-50", filter:"all", mode:"flashcard" };
  state.hafalan = cfg;
  if (!state._rangkumanContext && cfg.tipe === "rangkuman") cfg.tipe = "kosakata";

  // Build a bucket of 50 covering the full dataset for the active type.
  function activePool(){
    const pool = [];
    const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
    if (cfg.tipe === "rangkuman"){
      rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));
    } else {
      if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
      if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
    }
    return pool;
  }
  const poolAll = activePool();
  const pool = _posPool(poolAll, cfg);
  const maxNo = pool.reduce((m, p) => Math.max(m, p.dno), 0);

  function makeRanges(n){
    const r = [];
    if (n <= 0) return ["all"];
    for (let start = 1; start <= n; start += 50){
      const end = Math.min(start + 49, n);
      r.push(`${start}-${end}`);
    }
    r.push("all");
    return r;
  }
  const ranges = makeRanges(maxNo);

  // Ensure cfg.range is valid for the current pool
  if (!ranges.includes(cfg.range)) cfg.range = "all";

  // Filtered preview: apply range + filter on the pool
  const now = Date.now();
  let preview = pool;
  if (cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);
    preview = preview.filter(p => p.dno >= lo && p.dno <= hi);
  }
  preview = preview.filter(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    const card = state.srs[key];
    if (cfg.filter === "new")         return !card;
    if (cfg.filter === "due")         return card && card.due <= now;
    if (cfg.filter === "notmastered") return !card || !card.mastered;
    if (cfg.filter === "mastered")    return !!card?.mastered;
    return true;
  });

  // Counters by status, across the filtered set
  const counters = { mastered:0, review:0, learning:0, fresh:0, new:0 };
  preview.forEach(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    counters[_cardStatus(state.srs[key]).key]++;
  });

  const typeBtn = (v, lbl, sub, disabled=false) => `
    <button class="haf-pick ${cfg.tipe===v?'on':''}" ${disabled?'disabled style="opacity:.4;"':''} onclick="hafCfg('tipe','${v}')">
      <div class="lbl">${lbl}</div><div class="sub">${sub}</div>
    </button>`;

  const chip = (field, v, lbl) => `
    <button class="haf-chip ${cfg[field]===v?'on':''}" onclick="hafCfg('${field}','${v}')">${lbl}</button>`;

  return `
    <div class="panel">
      <h2>🧠 Hafalan</h2>
      <p style="color:var(--gray); font-size:14px; margin-bottom:14px;">Pilih yang mau dihafal, rentang, filter, lalu mode belajar.</p>

      <h3 style="margin-bottom:8px;">1. Pilih materi</h3>
      <div class="haf-type-row">
        ${state._rangkumanContext ? typeBtn("rangkuman", "📒 Rangkuman", rangList.length + " kata") : `
          ${typeBtn("kosakata", "📖 Kosakata", kos.length + " kata")}
          ${typeBtn("kanji",    "🈷️ Kanji",    knj.length + " kanji")}
          ${typeBtn("semua",    "✨ Semua",     (kos.length + knj.length) + " item")}
        `}
      </div>

      ${cfg.tipe === "kosakata" ? `<h3 style="margin:16px 0 8px;">Pilih kategori hafalan</h3>${posBar(kos, POS_DEF.some(d => d.k === cfg.pos) ? cfg.pos : "all", "hafPos")}` : ""}
      <h3 style="margin:16px 0 8px;">2. Rentang nomor <small style="color:var(--gray-dim); font-weight:400;">(bucket per 50)</small></h3>
      <div class="haf-chip-row">
        ${ranges.map(r => chip("range", r, r === "all" ? "Semua" : r)).join("")}
      </div>

      <h3 style="margin:16px 0 8px;">3. Filter</h3>
      <div class="haf-chip-row">
        ${chip("filter","all","Semua")}
        ${chip("filter","new","Baru")}
        ${chip("filter","due","Due hari ini")}
        ${chip("filter","notmastered","Belum mastered")}
        ${chip("filter","mastered","Sudah mastered")}
      </div>

      <div class="status-legend">
        <span class="stat-pill" style="background:rgba(16,185,129,.18); color:#10b981;">● Mastered ${counters.mastered}</span>
        <span class="stat-pill" style="background:rgba(245,158,11,.18); color:#f59e0b;">● Review ${counters.review}</span>
        <span class="stat-pill" style="background:rgba(234,179,8,.18); color:#eab308;">● Learning ${counters.learning}</span>
        <span class="stat-pill" style="background:rgba(239,83,80,.18); color:#ef5350;">● Baru dipelajari ${counters.fresh}</span>
        <span class="stat-pill" style="background:rgba(255,255,255,.08); color:#fff;">● Belum ${counters.new}</span>
      </div>

      ${preview.length ? `
        <details class="status-preview" ${cfg.filter !== "all" ? "open" : ""}>
          <summary><b>Lihat daftar kartu (${preview.length})</b> · klik untuk buka/tutup</summary>
          <div class="status-list">
            ${preview.slice(0, 200).map(p => {
              const key = _srsKey(p.tipe, {no:p.no}, p.idx);
              const s = _cardStatus(state.srs[key]);
              return `
                <div class="status-item" style="background:${s.bg}; border-color:${s.color}44;">
                  <span class="no-badge">${fmtNo(p.dno ?? p.no)}</span>
                  <div class="status-jp">${p.front}</div>
                  <div class="status-mean">${p.back}</div>
                  <span class="status-chip" style="color:${s.color}; border-color:${s.color};">${s.label}</span>
                </div>`;
            }).join("")}
            ${preview.length > 200 ? `<p style="text-align:center; color:var(--gray); margin-top:8px;">...dan ${preview.length-200} kartu lainnya</p>` : ""}
          </div>
        </details>
      ` : `<p style="text-align:center; color:var(--gray-dim); margin:12px 0;">${cfg.tipe === "kosakata" && POS_DEF.some(d => d.k === cfg.pos) && !pool.length ? "Belum ada kosakata untuk kategori ini." : "Tidak ada kartu dengan filter ini."}</p>`}

      <h3 style="margin:16px 0 8px;">4. Mode belajar</h3>

window.hafStart = async () => {
  state._srsLevel = null; state.hafalan_ctx = null; state.hafalan_back = null;
  const cfg = state.hafalan;
  const promises = [
    loadMateri("kosakata", state.level),
    loadMateri("kanji", state.level),
  ];
  if (cfg.tipe === "rangkuman" && state.user){
    promises.push(FB.listRangkuman().catch(() => []));
  } else {
    promises.push(Promise.resolve([]));
  }
  const [kos, knj, rangList] = await Promise.all(promises);
  await _loadSrs();

  let pool = [];
  const push = (tipe, arr) => arr.forEach((it, idx) => pool.push(_normalizeItem(tipe, it, idx)));
  if (cfg.tipe === "rangkuman"){
    rangList.forEach((r, i) => pool.push({ tipe:"rangkuman", idx:i, no:i+1, front:r.jp, reading:r.kana||"", back:r.arti||"" }));
  } else {
    if (cfg.tipe === "kosakata" || cfg.tipe === "semua") push("kosakata", kos);
    if (cfg.tipe === "kanji"    || cfg.tipe === "semua") push("kanji", knj);
  }
  pool = _posPool(pool, cfg);

  // Range filter
  let inRange = pool;
  if (cfg.range && cfg.range !== "all"){
    const [lo, hi] = cfg.range.split("-").map(Number);
    inRange = pool.filter(p => (p.dno ?? p.no) >= lo && (p.dno ?? p.no) <= hi);
  }

  // Status filter
  const now = Date.now();
  const filtered = inRange.filter(p => {
    const key = _srsKey(p.tipe, {no:p.no}, p.idx);
    const card = state.srs[key];
    if (cfg.filter === "new")         return !card;
    if (cfg.filter === "due")         return card && card.due <= now;
    if (cfg.filter === "notmastered") return !card || !card.mastered;
    if (cfg.filter === "mastered")    return !!card?.mastered;
    return true;
  });

  if (!filtered.length){
    toast("Tidak ada item yang cocok dengan filter ini");
    return;
  }

  // Shuffle + cap
  // Jumlah kartu = SEMUA item di rentang yang dipilih (1–50 → 50 kartu), tidak dipotong 20.
  const cap = filtered.length;
  state.hafalan_queue = filtered.sort(() => Math.random() - 0.5).slice(0, cap);
  state.hafalan_pos = 0;
  state.hafalan_score = { benar:0, salah:0 };

  route("hafalan/go");
};

const _sswLvl = (slug) => { slug = slug || (window.__sswSlug && window.__sswSlug()) || "building-cleaning"; return slug === "building-cleaning" ? "ssw-bc" : "ssw-" + slug; };
const _hafBadge = (it) => it.tipe === "ssw" ? "SSW · " + String((window.__sswSlug && window.__sswSlug()) || "").replace(/-/g, " ").toUpperCase() : `${it.tipe === "kanji" ? "KANJI" : it.tipe === "rangkuman" ? "RANGKUMAN" : "KOSAKATA"} · ${state.level.toUpperCase()}`;
function _sswSaveSess(){ try { sessionStorage.setItem(_SSW_SESS, JSON.stringify({ lvl: state._srsLevel, q: state.hafalan_queue, pos: state.hafalan_pos, mode: (state.hafalan||{}).mode, back: state.hafalan_back, score: state.hafalan_score })); } catch(e){} }

window.sswAddCard = async (no, idx) => {

  await _saveSrs(); state._srsLevel = keep; state.srs = keepSrs || {};
};
async function _sswRestore(){
  try {
    const d = JSON.parse(sessionStorage.getItem(_SSW_SESS) || "null"); if (!d || !d.q || !d.q.length) return false;
    state._srsLevel = d.lvl || "ssw-bc"; state.hafalan_ctx = "ssw"; state.hafalan_back = d.back || "ssw";
    await _loadSrs();
    state.hafalan = { tipe: "ssw", mode: d.mode || "flashcard", range: "all", filter: "all" };
    state.hafalan_queue = d.q; state.hafalan_pos = d.pos || 0; state.hafalan_score = d.score || { benar: 0, salah: 0 };
    return true;
  } catch (e) { return false; }
}
async function renderHafalanSession(){
  if (!(state.hafalan_queue || []).length && await _sswRestore()) { /* sesi SSW dipulihkan setelah refresh */ }
  const cfg = state.hafalan || {};

  const q = state.hafalan_queue || [];
  if (!q.length) { if (_hafSSW() || sessionStorage.getItem(_SSW_SESS)) return `<div class="panel"><h2>Sesi hafalan selesai / kedaluwarsa</h2><button class="btn" onclick="route('${state.hafalan_back || "ssw"}')">↩ Kembali ke hafalan</button></div>`; return renderHafalanSelect(); }

  if (mode === "flashcard") return renderHafalanFlashcard();
  if (mode === "matching")  return renderHafalanMatching();
  if (mode === "multiple")  return renderHafalanMultiple();
  return renderHafalanFlashcard();
}

// Post-render: wire swipe handlers, auto-play audio, mount companion.
function _hafPostRender(){
  const card = document.getElementById("flash-card");

  _bindFlashSwipe(card);

}

// Tap kartu = bolak-balik depan ↔ belakang, bisa berulang kali.
window.hafCardTap = (ev) => {

  const card = document.getElementById("flash-card");
  if (!card) return;
  state._flashRevealed = !state._flashRevealed;
  card.classList.toggle("revealed", state._flashRevealed);

  if (state._flashRevealed) _autoSpeakJP(card.dataset.say);
};

// Center button: go back to the previous card (only when pos > 0).

};

// Attach touch/pointer handlers for the physical swipe.
function _bindFlashSwipe(card){
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
  const THRESH = 90;             // px needed to commit a rating
  const MOVE_TAP = 8;            // px below this = treat as a tap

  const badgeL = document.getElementById("badge-lupa");
  const badgeR = document.getElementById("badge-ingat");

  function onDown(x, y){
    dragging = true; startX = x; startY = y; dx = 0; dy = 0;
    state._swipeMoved = false;
    card.classList.add("swiping");
  }
  function onMove(x, y){
    if (!dragging) return;
    dx = x - startX; dy = y - startY;
    // Ignore if the user is clearly scrolling vertically
    if (Math.abs(dy) > Math.abs(dx) * 1.2 && Math.abs(dy) > 20){ cancel(); return; }
    if (Math.abs(dx) > MOVE_TAP) state._swipeMoved = true;
    const rot = dx / 20;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    if (badgeL) badgeL.style.opacity = dx < 0 ? Math.min(1, -dx / THRESH) : 0;
    if (badgeR) badgeR.style.opacity = dx > 0 ? Math.min(1, dx / THRESH) : 0;
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    card.classList.remove("swiping");
    if (dx <= -THRESH){
      card.classList.add("leave-left");
      setTimeout(() => hafRate("lupa"), 180);
      return;
    }
    if (dx >= THRESH){
      card.classList.add("leave-right");
      setTimeout(() => hafRate("ingat"), 180);
      return;
    }
    // Snap back
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }
  function cancel(){
    dragging = false;
    card.style.transform = "";
    if (badgeL) badgeL.style.opacity = 0;
    if (badgeR) badgeR.style.opacity = 0;
  }

  // Touch
  card.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchmove",  (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), { passive:true });
  card.addEventListener("touchend",   onUp);
  card.addEventListener("touchcancel", cancel);
  // Mouse (desktop)
  card.addEventListener("mousedown",  (e) => { onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", (e) => { if (dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener("mouseup",   () => { if (dragging) onUp(); });
}

window.hafRate = async (rate) => {
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos];
  if (!it) return;
  // Normalize: accept the old 4 ratings AND the new lupa/ingat
  const normalized = (rate === "lupa" || rate === "salah") ? "lupa"
                   : (rate === "ingat" || rate === "benar" || rate === "mudah" || rate === "ragu") ? "ingat"
                   : "ingat";
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const dayMs = 86400000;
  card.n = (card.n || 0) + 1;
  if (normalized === "lupa"){
    card.interval = 1;
  } else {
    // "ingat" doubles the interval (bounded reasonable minimum)
    card.interval = Math.max(2, Math.round((card.interval || 1) * 2));
  }
  card.due = now + card.interval * dayMs;
  card.last = normalized;
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  if (it.tipe === "ssw" && it.vnum) state.srs[_srsKey("ssw", { no: it.vnum }, it.vnum - 1)] = { ...card };   // kartu alat ikut progres kosakata utamanya
  await _saveSrs();

  if (normalized === "ingat"){
    playJurus();   // Part 25: signature animation on correct recall
    await awardXP(3, justMastered ? 2 : 1);
    if (justMastered) toast(`🏆 ${it.tipe === "kanji" ? "Kanji" : "Kosakata"} ${it.front} — MASTERED! +1 🪙`);
    state.hafalan_score.benar++;
    if (state.user) {
      FB.updateMisiProgres("hafalan_10", 1).catch(()=>{});
      const actType = it.tipe === "kanji" ? "kanji" : "kosakata";
      if (it.tipe !== "ssw") FB.recordActivity(actType).catch(()=>{});
    }
  } else {
    await awardXP(1, 0);
    state.hafalan_score.salah++;
  }

  state.hafalan_pos++;
  if (_hafSSW()) _sswSaveSess();
  document.getElementById("app").innerHTML = await renderHafalanSession();
};

/* ========== MODE 2: MATCHING LINES (tap-to-pair, mobile-friendly) ========== */

  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();
  setTimeout(_mountCompanion, 0);

  const batch = q.slice(pos, Math.min(pos + 5, q.length));

  return `
    <div class="panel">

              <div class="rd">${it.reading}</div>`}

        </div>
        <div class="match-col" id="match-right">
          ${rights.map(r => `
            <button class="match-item" data-side="R" data-i="${r.i}" onclick="matchTap('R', ${r.i})">
              <div class="id">${r.back}</div>
            </button>`).join("")}
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:16px; justify-content:center;">

      </div>

}
window.matchTap = (side, i) => {
  state.match_pick = state.match_pick || {};
  state.match_pick[side] = i;
  document.querySelectorAll(`.match-item[data-side="${side}"]`).forEach(b => b.classList.remove("picked"));
  const btn = document.querySelector(`.match-item[data-side="${side}"][data-i="${i}"]`);
  if (btn) btn.classList.add("picked");

  // When both sides picked, resolve
  if (state.match_pick.L != null && state.match_pick.R != null){
    const L = state.match_pick.L, R = state.match_pick.R;
    const lb = document.querySelector(`.match-item[data-side="L"][data-i="${L}"]`);
    const rb = document.querySelector(`.match-item[data-side="R"][data-i="${R}"]`);
    if (L === R){
      lb.classList.add("match-ok"); rb.classList.add("match-ok");
      lb.disabled = true; rb.disabled = true;
      state.hafalan_score.benar++;
      matchAfterPair(true, L);
    } else {
      lb.classList.add("match-bad"); rb.classList.add("match-bad");
      setTimeout(() => { lb.classList.remove("match-bad","picked"); rb.classList.remove("match-bad","picked"); }, 500);
      state.hafalan_score.salah++;
    }
    state.match_pick = {};
    // If the current batch is cleared, advance
    setTimeout(matchCheckDone, 600);
  }
};
async function matchAfterPair(correct, iInBatch){
  const q = state.hafalan_queue;
  const it = q[state.hafalan_pos + iInBatch];
  if (!it) return;
  const key = _srsKey(it.tipe, {no:it.no}, it.idx);
  const now = Date.now();
  const card = state.srs[key] || { n:0, interval:1, due:now };
  const mult = correct ? 2 : 1;
  card.n = (card.n || 0) + 1;
  card.interval = correct ? Math.max(1, Math.round((card.interval||1) * mult)) : 1;
  card.due = now + card.interval * 86400000;
  card.last = correct ? "benar" : "salah";
  const justMastered = FB.detectNewMastery(card);
  state.srs[key] = card;
  await _saveSrs();
  if (correct){
    _autoSpeakJP(it.front);
    playJurus();
    await awardXP(3, justMastered ? 2 : 1);
    if (justMastered) toast(`🏆 ${it.front} — MASTERED! +1 🪙`);
    if (state.user) {
      const actType = it.tipe === "kanji" ? "kanji" : "kosakata";
      if (it.tipe !== "ssw") FB.recordActivity(actType).catch(()=>{});
    }
  }
}
window.matchCheckDone = () => {
  const remaining = document.querySelectorAll('.match-item[data-side="L"]:not(:disabled)').length;
  if (remaining === 0){
    state.hafalan_pos = Math.min(state.hafalan_pos + 5, state.hafalan_queue.length);
    if (_hafSSW()) _sswSaveSess(); renderHafalanSession().then(h => { document.getElementById("app").innerHTML = h; });
  }
};
window.matchSkip = () => {
  state.hafalan_pos = Math.min(state.hafalan_pos + 5, state.hafalan_queue.length);
  if (_hafSSW()) _sswSaveSess(); renderHafalanSession().then(h => { document.getElementById("app").innerHTML = h; });
};

/* ========== MODE 3: MULTIPLE CHOICE ========== */
function renderHafalanMultiple(){
  const q = state.hafalan_queue;
  const pos = state.hafalan_pos;
  if (pos >= q.length) return renderHafalanDone();
  setTimeout(_mountCompanion, 0);
  const it = q[pos];

  // Build 4 options: 1 correct, 3 distractors drawn from the rest of the queue (or pool).
  const distractors = q.filter((_, i) => i !== pos).map(x => x.back).filter(b => b && b !== it.back);
  const shuffled = Array.from(new Set(distractors)).sort(() => Math.random() - 0.5).slice(0, 3);
  while (shuffled.length < 3) shuffled.push("—");
  const options = [it.back, ...shuffled].sort(() => Math.random() - 0.5);
  state.mc_correct = it.back;

  return `
    <div class="panel">
      <div class="haf-topbar">
        <button class="btn ghost sm" onclick="route('${_hafMenu()}')">← Kembali</button>
        <span style="color:var(--gray); font-size:13px;">${pos+1} / ${q.length}</span>
        <button class="btn ghost sm" onclick="route('${_hafHome()}')">${_hafHomeLbl()}</button>
      </div>

// Real-time countdown: paints #timer every second, auto-submits at 0.
let _ujianTimerId = null;
function _fmtTime(sec){
  const s = Math.max(0, sec|0);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
function _stopUjianTimer(){
  if (_ujianTimerId){ clearInterval(_ujianTimerId); _ujianTimerId = null; }
}
function _startUjianTimer(){
  _stopUjianTimer();
  const tick = () => {
    const u = state.ujian;
    const el = document.getElementById("timer");
    if (!u || !el){ _stopUjianTimer(); return; }
    const remaining = Math.max(0, Math.floor((u.endTime - Date.now()) / 1000));
    el.textContent = "⏱ " + _fmtTime(remaining);
    if (remaining <= 60) el.classList.add("time-danger");
    else el.classList.remove("time-danger");
    if (remaining === 0 && !u.autoSubmitted){
      u.autoSubmitted = true;
      _stopUjianTimer();
      if (typeof toast === "function") toast("⏰ Waktu habis — jawaban dikirim otomatis");
      if (typeof window.ujianSelesai === "function") window.ujianSelesai();
    }
  };
  tick();
  _ujianTimerId = setInterval(tick, 1000);
}

// Bersihkan furigana dari teks soal — sesuai permintaan guru Nov 2026
// soal ujian TIDAK BOLEH ada furigana. Dua bentuk yang kita bersihin:
//  1. HTML <ruby>字<rt>じ</rt></ruby>  →  字
//  2. Parenthetical kanji(hiragana) / kanji（hiragana）  →  kanji
// Tetap biarkan hiragana/katakana murni (tidak dalam kurung) karena itu
// bagian dari soal, bukan furigana.
function stripFurigana(text){
  if (!text) return text;
  let out = String(text);
  // <ruby>base<rt>reading</rt></ruby>  → base
  out = out.replace(/<ruby>([\s\S]*?)<rt>[\s\S]*?<\/rt>([\s\S]*?)<\/ruby>/gi, "$1$2");
  // kanji(hiragana) atau kanji（hiragana） — hanya jika isi kurung murni kana
  out = out.replace(/[\(（]([぀-ゟ゠-ヿーー・]+)[\)）]/g, "");
  return out;
}

window.reviewNav = (dir) => {

  renderReviewHasil();
};
window.reviewJump = (idx) => {

  r.pos = Math.max(0, Math.min(r.total - 1, idx));

};

/* ========== SHOP — all categories + side-by-side preview (Parts 18 + 23) ========== */
async function renderShop(){
  // Category tabs — shop now sells hairstyle PLUS pakaian/sepatu/aksesori/senjata.
  // "senjata" maps to the item_tangan slot in the character catalog.
  const CAT_TABS = [
    { key: "rambut",      label: "💇 Rambut" },
    { key: "pakaian",     label: "👕 Pakaian" },
    { key: "sepatu",      label: "👟 Sepatu" },
    { key: "aksesori",    label: "🎩 Aksesori" },
    { key: "item_tangan", label: "⚔️ Senjata" },
    { key: "aura",        label: "✨ Aura" },
  ];
  const activeCat = state._shopCat && CAT_TABS.some(t => t.key === state._shopCat) ? state._shopCat : "rambut";
  state._shopCat = activeCat;

  const allItems = allShopItems();
  const items = allItems.filter(it => it.kategori === activeCat);

  const inv = state.siswa?.karakter?.inventory || [];
  const eq = state.siswa?.karakter?.equipped || {};
  const skin = state.siswa?.karakter?.skinTone || "light";
  const hairColor = state.siswa?.karakter?.hairColor;

  // Per-category preview: user's choice, or equipped, or first available.
  const prevKey = `shopPrev_${activeCat}`;
  const preview = state[prevKey] && items.some(it => it.id === state[prevKey])
    ? state[prevKey]
    : (eq[activeCat] || items[0]?.id || null);
  state[prevKey] = preview;

  // Character with the previewed slot swapped in
  const previewEq = { ...DEFAULT_EQUIPPED, ...eq, [activeCat]: preview };
  const charaSvg = renderCharacter(previewEq, skin, { hairColor });

  const previewItem = items.find(it => it.id === preview);
  const isOwned = preview && inv.includes(preview);
  const isEquipped = eq[activeCat] === preview;
  const locked = previewItem && state.gami.level_karakter < previewItem.unlock_lv;
  const unlimitedCoins = FB.hasUnlimitedCoins && FB.hasUnlimitedCoins();
  const canAfford = unlimitedCoins || (state.gami.koin || 0) >= (previewItem?.harga || 0);
  const kurang = Math.max(0, (previewItem?.harga || 0) - (state.gami.koin || 0));

  // Action area below the preview
  let actionHtml;
  if (!previewItem){
    actionHtml = `<div style="color:var(--gray); text-align:center;">Belum ada item di kategori ini.</div>`;
  } else if (isEquipped){
    actionHtml = `<button class="btn ghost" style="width:100%;" disabled>✓ Sedang dipakai</button>`;
  } else if (isOwned){
    actionHtml = `<button class="btn gold" style="width:100%;" onclick="shopEquip('${activeCat}','${preview}')">👔 Pakai</button>`;
  } else if (locked){
    actionHtml = `<button class="btn" style="width:100%;" disabled>🔒 Butuh Lv ${previewItem.unlock_lv}</button>`;
  } else if (!canAfford){
    actionHtml = `<button class="btn" style="width:100%;" disabled>Kurang 🪙 ${kurang.toLocaleString("id-ID")}</button>`;
  } else {
    actionHtml = `
      <button class="btn gold" style="width:100%; font-size:16px; padding:14px;" onclick="shopConfirmBeli('${activeCat}','${preview}', ${previewItem.harga}, ${previewItem.unlock_lv})">
        🛒 BELI · ${unlimitedCoins ? "∞" : previewItem.harga.toLocaleString("id-ID")} 🪙
      </button>
      ${unlimitedCoins ? `<p style="text-align:center; color:var(--gold); font-size:12px; margin-top:6px;">Developer: coin tidak berkurang</p>` : ""}
    `;
  }

  // Thumbnail for each item (character SVG with just that slot populated)
  const thumbFor = (it) => renderCharacter({ ...DEFAULT_EQUIPPED, [activeCat]: it.id }, skin, { hairColor });

  const tabHtml = CAT_TABS.map(t => `
    <button class="shop-tab ${activeCat===t.key?'on':''}" onclick="shopSetCat('${t.key}')">${t.label}</button>
  `).join("");

  return `
    <div class="panel">
      <h2>🛒 Shop</h2>
      <p style="color:var(--gray); font-size:14px; margin-bottom:12px;">
        Pilih item, lihat di karakter, lalu klik <b>BELI</b>. Pembelian hanya memotong coin setelah konfirmasi.
      </p>

      <div class="shop-tabs">${tabHtml}</div>

      <div class="shop-layout">
        <div class="shop-preview">
          <div class="shop-char">${charaSvg}</div>
          <div class="shop-info">
            <div class="shop-item-name">${previewItem?.nama || "—"}</div>
            <div class="shop-item-meta">
              ${previewItem?.rarity ? `<span class="rarity-chip rarity-${previewItem.rarity}">${previewItem.rarity.toUpperCase()}</span>` : ""}
              ${previewItem?.jlpt ? `<span class="rarity-chip" style="background:rgba(239,106,154,.18); color:var(--pink-light);">${previewItem.jlpt.toUpperCase()}</span>` : ""}
              ${previewItem ? `<span>🪙 ${previewItem.harga.toLocaleString("id-ID")}</span>` : ""}
              ${previewItem?.unlock_lv ? `<span>🔑 Lv ${previewItem.unlock_lv}</span>` : ""}
            </div>
          </div>
          <div class="shop-action">${actionHtml}</div>
          <div class="shop-wallet">
            Saldo: <b>${unlimitedCoins ? "∞" : (state.gami.koin || 0).toLocaleString("id-ID")} 🪙</b>
          </div>
        </div>

        <div class="shop-items">
          <h3 style="margin-top:0;">${CAT_TABS.find(t=>t.key===activeCat).label} (${items.length})</h3>
          ${items.length ? `
            <div class="shop-items-grid">
              ${items.map(it => {
                const owned = inv.includes(it.id);
                const equipped = eq[activeCat] === it.id;
                const locked = state.gami.level_karakter < it.unlock_lv;
                const selected = it.id === preview;
                return `
                  <div class="shop-tile ${selected?'sel':''} ${equipped?'equipped':''} ${owned?'owned':''} ${locked?'locked':''}"
                       onclick="shopPreview('${activeCat}','${it.id}')">
                    <div class="shop-tile-thumb">${thumbFor(it)}</div>
                    <div class="shop-tile-name">${it.nama}</div>
                    <div class="shop-tile-price">
                      ${equipped ? "✓ Dipakai" : owned ? "Dimiliki" : locked ? `🔒 Lv ${it.unlock_lv}` : `🪙 ${it.harga.toLocaleString("id-ID")}`}
                    </div>
                    ${it.rarity && it.rarity !== "common" ? `<span class="shop-tile-rarity rarity-${it.rarity}"></span>` : ""}
                  </div>`;
              }).join("")}
            </div>
          ` : `<div class="empty"><div class="emoji">📭</div>Kategori ini masih kosong.</div>`}
        </div>
      </div>
    </div>
  `;
}

window.shopSetCat = (cat) => {
  state._shopCat = cat;
  renderShop().then(h => document.getElementById("app").innerHTML = h);
};
window.shopPreview = (cat, id) => {
  state._shopCat = cat;
  state[`shopPrev_${cat}`] = id;
  renderShop().then(h => document.getElementById("app").innerHTML = h);
};
window.shopConfirmBeli = (cat, id, harga, unlock) => {
  if (!state.user) return toast("Login dulu untuk berbelanja");
  const unlimited = FB.hasUnlimitedCoins && FB.hasUnlimitedCoins();
  const msg = unlimited
    ? `Beli item ini? (unlimited)`
    : `Beli item ini seharga ${harga.toLocaleString("id-ID")} 🪙?`;
  if (!confirm(msg)) return;
  beliItem(cat, id, harga, unlock);
};
window.shopEquip = async (cat, id) => {
  if (!state.user) return;
  try {
    await FB.equipItem(cat, id);
    if (state.siswa){
      state.siswa.karakter = state.siswa.karakter || {};
      state.siswa.karakter.equipped = { ...(state.siswa.karakter.equipped||{}), [cat]: id };
    }
    toast("✓ Dipakai");
    renderShop().then(h => document.getElementById("app").innerHTML = h);
  } catch(e){ toast("❌ " + e.message); }
};
window.beliItem = async (kat, id, harga, unlock) => {
  if (!state.user) return toast("Login dulu untuk berbelanja");
  if (state.gami.level_karakter < unlock) return toast(`Butuh level ${unlock}`);
  try {
    const r = await FB.beliItem(kat, id, harga, state.level);
    state.gami.koin = r.newKoin;
    updateChips();
    if (r.unlimited) toast(`✨ ${state.gami.koin.toLocaleString("id-ID")} 🪙 (unlimited — tidak berkurang)`);
    else toast(`💰 Dibeli! +1 hairstyle ke koleksi`);
    // Update local inventory cache
    if (state.siswa?.karakter){
      const inv = state.siswa.karakter.inventory || [];
      if (!inv.includes(id)){ inv.push(id); state.siswa.karakter.inventory = inv; }
    }
    renderShop().then(h => document.getElementById("app").innerHTML = h);
  } catch(e){ toast("❌ " + e.message); }
};
window.equipNow = async (kat, id) => {
  if (!state.user) return;
  await FB.equipItem(kat, id);
  toast("✓ Dipakai");
  renderShop().then(h => document.getElementById("app").innerHTML = h);
};

async function renderInventory(){
  const inv = state.siswa?.karakter?.inventory || [];
  if (!inv.length) return `<div class="panel"><h2>🎒 Inventory</h2><div class="empty"><div class="emoji">📭</div>Inventorymu masih kosong.<br><button class="btn" onclick="route('shop')">Ke Shop</button></div></div>`;

  const grouped = {};
  inv.forEach(id => {
    for (const [kat, items] of Object.entries(CATALOG)) {
      if (items[id]) {
        if (!grouped[kat]) grouped[kat] = [];
        grouped[kat].push({ id, ...items[id] });
        break;
      }

  });
  const eq = state.siswa?.karakter?.equipped || {};
  return `
    <div class="panel">
      <h2>🎒 Inventory</h2>
      ${Object.entries(grouped).map(([kat, list]) => `
        <h3>${CATALOG_LABELS[kat]}</h3>
        <div class="grid grid-4">
          ${list.map(it => {
            const equipped = eq[kat] === it.id;
            const chara = renderCharacter({ ...DEFAULT_EQUIPPED, [kat]: it.id });
            return `
              <div class="item-card owned ${equipped?'equipped':''}" onclick="equipNowInv('${kat}','${it.id}')">
                <div class="icon-wrap">${chara}</div>
                <div class="nama">${it.nama}</div>
                <div class="harga">${equipped ? "✓ Dipakai" : "Klik pakai"}</div>
              </div>

          }).join("")}
        </div>

    </div>
  `;
}

/* ========== KALENDER AKTIVITAS (Part 12) ========== */
async function renderKalender(){
  if (!state.user){
    return `<div class="panel"><h2>📅 Kalender Aktivitas</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk melihat kalender.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }
  const now = new Date();
  const navMonth = state._calMonth || now.getMonth();
  const navYear  = state._calYear  || now.getFullYear();
  const ymKey = navYear + String(navMonth+1).padStart(2,"0");
  const activity = await FB.listActivity(ymKey);

  // Monthly totals
  const totals = { kanji:0, kosakata:0, latihan:0, ujian:0, sesi:0, days:0 };
  Object.values(activity).forEach(a => {
    totals.kanji += a.kanji||0; totals.kosakata += a.kosakata||0;
    totals.latihan += a.latihan||0; totals.ujian += a.ujian||0;
    totals.sesi += a.sesi||0;
    if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) totals.days++;
  });

  // Streak + longest streak across ALL activity (pull full list to compute)
  const [streak, longest] = await _computeStreaks();

  // Build month grid
  const first = new Date(navYear, navMonth, 1);
  const last  = new Date(navYear, navMonth+1, 0);
  const startWd = first.getDay(); // 0 Sunday
  const totalDays = last.getDate();
  const cells = [];
  // Previous-month trailing days
  const prevLast = new Date(navYear, navMonth, 0).getDate();
  for (let i = startWd; i > 0; i--){
    cells.push({ d: prevLast - i + 1, other:true });
  }
  for (let d = 1; d <= totalDays; d++){
    const ymd = `${navYear}${String(navMonth+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    cells.push({ d, ymd, a: activity[ymd] || null });
  }
  // Pad to full weeks
  while (cells.length % 7 !== 0) cells.push({ d: cells.length - startWd - totalDays + 1, other:true, pad:true });

  const todayYmd = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const monthName = first.toLocaleString("id-ID", { month:"long", year:"numeric" });

  const cellHtml = (c) => {
    if (c.other) return `<div class="cal-cell other-month"><div class="day">${c.d}</div></div>`;
    const a = c.a;
    const dots = a ? [
      a.kanji    ? '<span class="dot dot-kanji" title="Kanji"></span>' : "",
      a.kosakata ? '<span class="dot dot-kosakata" title="Kosakata"></span>' : "",
      a.latihan  ? '<span class="dot dot-latihan" title="Latihan"></span>' : "",
      a.ujian    ? '<span class="dot dot-ujian" title="Ujian"></span>' : "",
    ].join("") : "";
    const isToday = c.ymd === todayYmd ? "today" : "";
    const tot = a ? (a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) : 0;
    const heat = !tot ? "" : tot < 20 ? "i1" : tot < 50 ? "i2" : tot < 150 ? "i3" : tot < 300 ? "i4" : "i5";
    return `<div class="cal-cell ${isToday} ${heat}" onclick='calShowDay("${c.ymd}", ${JSON.stringify(a||{}).replace(/'/g,"&#39;")})'>
      <div class="day">${c.d}</div>
      <div class="dots">${dots}</div>
    </div>`;
  };

  return `
    <div class="panel">
      <h2>📅 Kalender Aktivitas</h2>

      <div class="cal-hero">
        <div class="cell"><div class="num">${streak}</div><div class="lbl">🔥 Streak sekarang</div></div>
        <div class="cell"><div class="num">${longest}</div><div class="lbl">🏆 Streak terpanjang</div></div>
        <div class="cell"><div class="num">${totals.days}</div><div class="lbl">Hari belajar bulan ini</div></div>
      </div>

      <div class="cal-nav">
        <button class="btn ghost sm" onclick="calNavMonth(-1)">← Bulan lalu</button>
        <b>${monthName}</b>
        <button class="btn ghost sm" onclick="calNavMonth(1)">Bulan depan →</button>
      </div>

      <div class="cal-grid">
        ${["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(w => `<div class="cal-head">${w}</div>`).join("")}
        ${cells.map(cellHtml).join("")}
      </div>

      <div class="cal-legend">
        <b>Intensitas:</b>
        <span><i class="cl l1"></i> Sedikit</span>
        <span><i class="cl l2"></i> Sedang</span>
        <span><i class="cl l3"></i> Lumayan</span>
        <span><i class="cl l4"></i> Bagus</span>
        <span><i class="cl l5"></i> 🔥 Brutal (300+)</span>
      </div>

      <div style="margin-top:14px; font-size:14px; color:var(--gray);">
        <b>Total bulan ini:</b>
        🈷️ ${totals.kanji} kanji · 📖 ${totals.kosakata} kosakata ·
        🧠 ${totals.latihan} latihan · 📝 ${totals.ujian} ujian ·
        ⏱ ${totals.sesi} sesi
      </div>

      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn ghost" onclick="route('home')">🏠 Home</button>
      </div>
    </div>
  `;
}

window.calNavMonth = (delta) => {
  const now = new Date();
  let m = (state._calMonth ?? now.getMonth()) + delta;
  let y = state._calYear ?? now.getFullYear();
  if (m < 0){ m = 11; y--; }
  else if (m > 11){ m = 0; y++; }
  state._calMonth = m; state._calYear = y;
  route("kalender");
};

window.calShowDay = (ymd, a) => {
  const nice = `${ymd.slice(6,8)}-${ymd.slice(4,6)}-${ymd.slice(0,4)}`;
  const empty = !a || !(a.kanji||a.kosakata||a.latihan||a.ujian);
  const existing = document.getElementById("cal-day-modal");
  if (existing) existing.remove();
  const html = `
    <div class="modal-backdrop open" id="cal-day-modal" onclick="if(event.target===this) document.getElementById('cal-day-modal').remove()">
      <div class="modal" style="max-width:360px;">
        <h2>${nice}</h2>
        ${empty ? `<p style="color:var(--gray);">Belum ada aktivitas di hari ini.</p>` : `
          <ul style="list-style:none; padding:0; margin-top:10px;">
            <li style="padding:6px 0; border-bottom:1px solid var(--border);">🈷️ Kanji direview: <b>${a.kanji||0}</b></li>
            <li style="padding:6px 0; border-bottom:1px solid var(--border);">📖 Kosakata direview: <b>${a.kosakata||0}</b></li>
            <li style="padding:6px 0; border-bottom:1px solid var(--border);">🧠 Latihan selesai: <b>${a.latihan||0}</b></li>
            <li style="padding:6px 0;">📝 Ujian selesai: <b>${a.ujian||0}</b></li>
          </ul>
        `}
        <button class="btn" style="width:100%; margin-top:12px;"
                onclick="document.getElementById('cal-day-modal').remove()">OK</button>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
};

// Compute current + longest streak across the last ~90 days.
async function _computeStreaks(){
  if (!state.user) return [0, 0];
  const now = new Date();
  // Build set of YMD keys that have ≥1 learning activity across last 120 days
  const dayStrings = [];
  for (let i = 0; i < 120; i++){
    const d = new Date(now); d.setDate(d.getDate() - i);
    dayStrings.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`);
  }
  const months = new Set(dayStrings.map(s => s.slice(0,6)));
  let activeDays = new Set();
  for (const ym of months){
    const act = await FB.listActivity(ym);
    Object.entries(act).forEach(([k, a]) => {
      if ((a.kanji||0)+(a.kosakata||0)+(a.latihan||0)+(a.ujian||0) > 0) activeDays.add(k);
    });
  }
  // Current streak: walk backward from today until gap
  let cur = 0;
  for (const d of dayStrings){
    if (activeDays.has(d)) cur++;
    else break;
  }
  // Longest streak in that window
  let longest = 0, run = 0;
  // Iterate oldest → newest
  for (let i = dayStrings.length - 1; i >= 0; i--){
    if (activeDays.has(dayStrings[i])) { run++; if (run > longest) longest = run; }
    else run = 0;
  }
  return [cur, longest];
}

async function renderSylabus(){
  if (!state.user){
    return `<div class="panel"><h2>🗺️ Sylabus</h2>
      <div class="empty"><div class="emoji">🔒</div>Login dulu untuk melihat peta perjalanan belajarmu.<br>
      <button class="btn" onclick="showAuthModal()">Masuk</button></div></div>`;
  }

  const lvl = state.level;
  const [kos, knj] = await Promise.all([
    loadMateri("kosakata", lvl),
    loadMateri("kanji", lvl),
  ]);
  await _loadSrs();
  const srs = state.srs || {};

  function chapterRows(tipe, data){
    const chunks = [];
    for (let start = 1; start <= data.length; start += 50){
      const end = Math.min(start + 49, data.length);
      // Count mastery within this chunk
      let mastered = 0, learning = 0, brand = end - start + 1;
      for (let no = start; no <= end; no++){
        const key = tipe[0] + ":" + no;
        const c = srs[key];
        if (!c) continue;
        brand--;
        if (c.mastered) mastered++;
        else learning++;
      }
      const totalInChunk = end - start + 1;
      const pct = Math.round((mastered / totalInChunk) * 100);
      chunks.push({ start, end, mastered, learning, brand, totalInChunk, pct });
    }
    return chunks;
  }

  const kosChunks = chapterRows("kosakata", kos);
  const knjChunks = chapterRows("kanji", knj);

  const chunkHtml = (ch, tipe) => {
    const done = ch.pct >= 80;
    const bar = `<div style="background:rgba(255,255,255,.08); height:8px; border-radius:4px; overflow:hidden;">
      <div style="width:${ch.pct}%; height:100%; background:${done ? 'var(--green)' : 'var(--pink)'};"></div>
    </div>`;
    return `
      <div class="syl-chunk ${done?'done':''}" onclick="sylabusOpenChunk('${tipe}',${ch.start},${ch.end})">
        <div class="syl-chunk-head">
          <b>${tipe === 'kosakata' ? '📖' : '🈷️'} No.${String(ch.start).padStart(3,'0')} – No.${String(ch.end).padStart(3,'0')}</b>
          <span class="syl-pct">${ch.pct}%${done?' ✓':''}</span>
        </div>
        ${bar}
        <div class="syl-chunk-meta">
          🟢 ${ch.mastered} mastered · 🟡 ${ch.learning} belajar · ⚪ ${ch.brand} belum
        </div>
      </div>`;
  };

  // Overall progress
  const totalMasterable = kos.length + knj.length;
  let totalMastered = 0;
  Object.values(srs).forEach(c => { if (c?.mastered) totalMastered++; });
  const overallPct = totalMasterable ? Math.round((totalMastered / totalMasterable) * 100) : 0;

  return `
    <div class="panel">
      <h2>🗺️ Sylabus · ${lvl.toUpperCase()}</h2>
      <p style="color:var(--gray); font-size:14px; margin-bottom:12px;">Peta perjalanan belajarmu. Klik setiap chapter untuk mulai hafalan range tersebut.</p>

      <div class="syl-hero">
        <div class="syl-hero-num">${overallPct}%</div>
        <div class="syl-hero-lbl">${totalMastered} / ${totalMasterable} mastered di ${lvl.toUpperCase()}</div>
      </div>

      ${displayBar("sylabus")}
      <h3 style="margin-top:14px;">📖 Kosakata (${kos.length})</h3>
      <div class="syl-grid">
        ${kosChunks.map(c => chunkHtml(c, "kosakata")).join("")}
      </div>

      <h3 style="margin-top:18px;">🈷️ Kanji (${knj.length})</h3>
      <div class="syl-grid">
        ${knjChunks.map(c => chunkHtml(c, "kanji")).join("")}
      </div>

      <h3 style="margin-top:18px;">📝 Ujian</h3>
      <p style="color:var(--gray);">Buka menu <b>Ujian</b> untuk daftar ujian ${lvl.toUpperCase()}.</p>
      <button class="btn" onclick="route('ujian')">📝 Ke Ujian</button>

      <h3 style="margin-top:18px;">🎯 Misi Harian</h3>
      <p style="color:var(--gray);">Misi harian masih ada sebagai mini-goal — klik di bawah.</p>
      <button class="btn ghost" onclick="route('misi')">Buka Misi Harian</button>
    </div>
  `;
}

  route(`syl/${tipe}/${lo}/${hi}`);
};

  return `

    btn.innerHTML = `👋 ${siswa?.nama || user.email.split("@")[0]}`;
    btn.onclick = () => route("profile");
    document.getElementById("guru-link").classList.toggle("hidden", !FB.userIsGuru());
    // Banner recovery: kalau login sukses tapi siswa doc gagal dibuat/dibaca,
    // tampilkan panel yang mencolok supaya user tahu dan bisa reset akun.
    showOrphanBannerIfNeeded();
  } else {
    btn.innerHTML = "🔑 Masuk";
    btn.onclick = () => route("login");
    document.getElementById("guru-link").classList.add("hidden");
    hideOrphanBanner();
  }

  // Snap to an allowed level before loading gami / rendering routes
  if (user && siswa) enforceLevelAccess();
  await loadGami();
  renderLevelPills();
  updateChips();

  const currentHash = (location.hash.slice(1) || "").split("/")[0];

  // Decide where to go now:
  //  1. User JUST logged in (or was already logged in on first fire) and
  //     we're sitting on the login page → bounce to home so the UI really
  //     switches out of guest mode. This fixes "udah login tapi masih jadi
  //     tamu" — Firebase auth works, but the page was still showing login.
  //  2. First page load and no user yet → show the dedicated login page so
  //     people don't accidentally browse as guest ("diawla harus udah muncul
  //     halaman login").
  //  3. Otherwise, just re-render the current route so state.user / state.siswa
  //     changes are reflected (e.g. after sign-out stay on home but as guest).
  if (!user && FB.lastAuthDenied){
    // Akun berhasil autentikasi tapi tidak terdaftar / nonaktif → tolak.
    route("login");
  } else if (user && (currentHash === "login" || currentHash === "masuk" || currentHash === "daftar")){
    // Baru saja login → halaman pertama selalu pemilihan JLPT.
    _lupakanPilihanLevel();
    route("pilih-level");
  } else if (!user && firstFire && (currentHash === "" || currentHash === "home")){
    route("login");
  } else {
    if (!user) _lupakanPilihanLevel();
    route(location.hash.slice(1) || (user ? "pilih-level" : "login"));
  }
});

/* ========== INIT ========== */
renderLevelPills();
updateChips();
// Pre-paint the login page immediately so the first thing the user sees is
// the login form, not an empty "Memuat…" state. Firebase may take ~500ms to
// restore a persisted session; onAuth above will swap routes to home once
// that resolves, or keep us on login if no session was persisted.
(function _paintLoginFirst(){
  try {
    const app = document.getElementById("app");
    if (!app) return;
    // Only pre-paint when the URL has no specific target; a deep link should
    // render its own route when onAuth fires.
    if (location.hash && location.hash.length > 1) return;
    document.body.classList.add("auth-mode");
    app.innerHTML = renderLogin();
  } catch(e){ /* best-effort; onAuth will render properly */ }
})();
window.addEventListener("hashchange", () => route(location.hash.slice(1) || "home"));

// Register SW
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

/* ========== PWA INSTALL ========== */
let _deferredInstallPrompt = null;
const _installBtn = document.getElementById("btn-install");

function _isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true
    || document.referrer.startsWith("android-app://");
}
function _isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Android & Chrome: catch deferred prompt
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  if (!_isStandalone() && _installBtn) _installBtn.classList.add("visible");
});

// Hide button after install
window.addEventListener("appinstalled", () => {
  _deferredInstallPrompt = null;
  if (_installBtn) _installBtn.classList.remove("visible");
  if (typeof toast === "function") toast("✓ SHIROSE NIHONGO terinstal");
});

// iOS Safari has no beforeinstallprompt — show button so user can see the manual guide
if (_isIOS() && !_isStandalone() && _installBtn){
  _installBtn.classList.add("visible");
}

// Entry point from the UI button
window.handleInstallClick = async () => {
  if (_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    const choice = await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
    if (choice && choice.outcome === "accepted"){
      if (_installBtn) _installBtn.classList.remove("visible");
    }
    return;
  }
  if (_isIOS()){ showIOSInstallModal(); return; }
  // Fallback hint when no prompt is available (desktop Chrome already installed, Firefox, etc.)
  toast("Buka menu browser → Install / Add to Home Screen");
};

window.showIOSInstallModal = () => {
  const html = `
    <div class="ios-install-modal" id="ios-install-modal" onclick="if(event.target===this) closeIOSInstall()">
      <div class="card">
        <h3>📲 Install di iPhone / iPad</h3>
        <p style="font-size:14px; color:var(--gray); margin-bottom:12px;">
          Safari tidak punya tombol install otomatis, tapi caranya mudah:
        </p>
        <ol>
          <li>Tekan tombol <b class="shareicon">⬆️ Share</b> di toolbar Safari (biasanya di bawah).</li>
          <li>Scroll di menu Share, lalu pilih <b>"Add to Home Screen"</b> / <b>"Tambahkan ke Layar Utama"</b>.</li>
          <li>Tekan <b>Add</b> di kanan atas. Icon SHIROSE NIHONGO akan muncul di home screen.</li>
          <li>Buka aplikasi dari icon tersebut — akan berjalan fullscreen tanpa browser bar.</li>
        </ol>
        <button class="btn" onclick="closeIOSInstall()">OK, mengerti</button>
      </div>
    </div>`;
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstElementChild);
};
window.closeIOSInstall = () => {
  const m = document.getElementById("ios-install-modal");
  if (m) m.remove();
};
</script>

</body>
</html>

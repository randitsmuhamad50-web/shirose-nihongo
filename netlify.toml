[build]
  publish = "."
  # No build step needed — static site
  command = "echo 'Static site, no build step required.'"

# Serverless function: AI pewawancara MENSETSU (key disimpan di Environment Variables Netlify).
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

# Audio VOICEVOX: boleh di-cache browser 7 hari (hemat bandwidth, siswa tidak unduh ulang).
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects: SPA fallback if needed (hash router — not strictly needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

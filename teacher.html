<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Teacher Dashboard · SHIROSE NIHONGO</title>
<meta name="description" content="Teacher Dashboard SHIROSE NIHONGO — kelola kategori ujian, bank soal, import Excel, dan monitoring siswa."/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<link rel="icon" href="./icon-192.png"/>
<meta name="theme-color" content="#161b36"/>
<meta name="theme-color" content="#161b36"/>
<link rel="icon" href="./icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#161b36; --navy-2:#1f2650; --navy-3:#2a3270; --navy-4:#0d1024;
  --pink:#ef6a9a; --pink-light:#f58bb0; --pink-dark:#c8325a;
  --gold:#ffd700; --green:#10b981; --red:#ef4444; --purple:#8b5cf6;
  --white:#ffffff; --gray:#b9bfd9; --gray-dim:#7a80a0;
  --border:#2a3060;
  --font-sans:'Zen Kaku Gothic New', system-ui, sans-serif;
  --font-jp:'Shippori Mincho B1', serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-sans); background:var(--navy-4); color:var(--white); min-height:100vh;}
.topbar{display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--navy); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;}
.brand{font-family:var(--font-jp); font-weight:800; font-size:18px; color:var(--white); text-decoration:none;}
.topbar-right{margin-left:auto;}
.btn{background:var(--pink); color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:700; cursor:pointer; font-family:var(--font-sans); font-size:13px;}
.btn:hover{background:var(--pink-dark);}
.btn.ghost{background:transparent; border:1px solid var(--border);}
.btn.gold{background:var(--gold); color:#2a1810;}
.btn.danger{background:var(--red);}
.btn.sm{padding:4px 10px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.layout{display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 56px);}
@media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--border);} }
.sidebar{background:var(--navy); border-right:1px solid var(--border); padding:16px;}
.sidebar .nav-item{
  display:flex; gap:10px; align-items:center;
  padding:10px 14px; border-radius:10px; cursor:pointer; margin-bottom:4px;
  color:var(--gray); font-weight:600; font-size:13px;
}
.sidebar .nav-item:hover{background:rgba(255,255,255,.05); color:var(--white);}
.sidebar .nav-item.active{background:var(--pink); color:white;}
.sidebar .nav-item .ico{font-size:18px;}

.main{padding:20px; max-width:1400px;}
.panel{background:var(--navy-2); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px;}
.panel h2{font-size:20px; margin-bottom:12px; color:var(--pink-light);}
.panel h3{font-size:14px; margin:12px 0 8px;}

.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
th{background:var(--navy); font-weight:700; color:var(--gray); font-size:11px; letter-spacing:.5px; text-transform:uppercase;}
tr:hover td{background:rgba(255,255,255,.03);}

.chip{display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; margin:0 2px;}
.chip.on{background:var(--green); color:white;}
.chip.off{background:#444;}
.chip.btn-chip{cursor:pointer; background:#333;}
.chip.btn-chip.on{background:var(--green);}

.form-row{display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.form-row label{font-size:12px; color:var(--gray); min-width:100px;}
input, select, textarea{
  padding:8px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--navy-4); color:white; font-family:var(--font-sans); font-size:13px;
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--pink);}

.dropzone{
  border:2px dashed var(--border); border-radius:12px; padding:30px; text-align:center;
  background:var(--navy); cursor:pointer; transition:all .15s;
}
.dropzone:hover{border-color:var(--pink); background:rgba(239,106,154,.05);}
.dropzone.drag{border-color:var(--gold); background:rgba(255,215,0,.08);}

.alert{padding:10px 14px; border-radius:8px; margin-bottom:10px; font-size:13px;}
.alert-err{background:rgba(239,68,68,.15); border:1px solid var(--red); color:#ffb4b4;}
.alert-ok{background:rgba(16,185,129,.15); border:1px solid var(--green); color:#b4ffcc;}

.login-box{
  max-width:400px; margin:60px auto; background:var(--navy-2); padding:30px;
  border-radius:16px; border:1px solid var(--border);
}

.toast-wrap{position:fixed; top:70px; right:16px; z-index:200;}
.toast{background:var(--pink); color:white; padding:10px 16px; border-radius:8px; margin-bottom:6px; font-size:13px; animation:ts .3s;}
@keyframes ts{from{transform:translateX(100%);}}

.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--navy-2); border:1px solid var(--pink); border-radius:16px; padding:24px; max-width:600px; width:100%; max-height:90vh; overflow:auto;}
/* ===== Pembatas level JLPT (Paket / Bank Soal / Import) ===== */
.lv-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px;}
.lv-tab{--c:#888; padding:10px 18px; border-radius:12px; border:2px solid var(--c); background:transparent; color:var(--white);
  font-weight:800; font-size:15px; cursor:pointer; font-family:var(--font-sans);}
.lv-tab span{display:inline-block; min-width:22px; padding:1px 7px; margin-left:6px; border-radius:999px; background:rgba(255,255,255,.12); font-size:12px;}
.lv-tab.on{background:var(--c); color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.35);}
.lv-band{--c:#888; border-left:6px solid var(--c); background:color-mix(in srgb, var(--c) 16%, transparent);
  padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:13px; color:var(--white);}
.sg-kelas{border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:12px; background:rgba(255,255,255,.02);}
.sg-kelas > h3{margin:0 0 8px; color:var(--pink-light); font-size:17px;}
.sg-kelas > h3 span{color:var(--gray); font-weight:400; font-size:13px;}
.sg-row{padding:10px 0; border-top:1px dashed rgba(255,255,255,.08); display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.sg-row:first-of-type{border-top:none;}
.sg-row .who{flex:1 1 220px; min-width:0;}
.sg-row .who b{display:block;}
.sg-row .who .em{font-size:12px; color:var(--gray);}
.sg-stats{flex-basis:100%; font-size:11.5px; color:var(--gray); line-height:1.6;}
.sg-stats b{color:var(--white); font-weight:700;}
.sg-stats details{margin-top:2px;}
.sg-stats summary{cursor:pointer; list-style:none;}
.sg-stats summary::-webkit-details-marker{display:none;}
.sg-stats summary::before{content:"▸ "; color:var(--pink-light);}
.sg-stats details[open] summary::before{content:"▾ ";}
.syl-bagian{display:flex; flex-wrap:wrap; gap:4px 6px; margin:4px 0 6px 14px;}
.syl-bagian .tp{width:100%; color:var(--gray-dim); font-size:11px; margin-top:2px;}
.syl-bagian span.c{padding:1px 7px; border-radius:6px; background:rgba(255,255,255,.05); font-size:11px; white-space:nowrap;}
.syl-bagian span.c.p1{background:rgba(239,106,154,.25); color:#fff;}
.syl-bagian span.c.ok{background:rgba(16,185,129,.35); color:#fff;}
tr.stat-row td{padding-top:0; border-top:none;}
.view-toggle{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:0 8px 10px 0;}
.view-toggle button{background:transparent; color:var(--gray); border:none; padding:8px 14px; cursor:pointer; font-weight:700; font-family:var(--font-sans);}
.view-toggle button.on{background:var(--pink); color:#fff;}
.lv-chip{--c:#888; display:inline-block; padding:2px 10px; border-radius:999px; background:var(--c); color:#fff; font-weight:800; font-size:12px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="./index.html" class="brand" style="text-decoration:none; color:inherit;">シ🌹ロセ · Teacher</a>
  <div class="topbar-right">
    <a href="./index.html" class="btn ghost" style="text-decoration:none;" title="Kembali ke tampilan siswa">← Student App</a>
    <span id="guru-nama" style="font-size:12px; color:var(--gray); margin:0 10px;"></span>
    <button class="btn ghost" id="btn-logout" style="display:none;" onclick="guruLogout()">Keluar</button>
  </div>
</div>

<div id="root"><div style="padding:40px; text-align:center; color:var(--gray);">Memuat…</div></div>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-backdrop" id="modal"><div class="modal" id="modal-body"></div></div>

<!-- XLSX: SheetJS CDN resmi. jsdelivr/npm sudah 404 sejak SheetJS keluar dari npm. -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module">
// ?v=20261108i — cache-buster, lihat catatan sama di index.html.
import * as FB from "./js/firebase-sync.js?v=20261111m";
import { renderSswTab } from "./js/ssw-teacher.js?v=20261111m";

const state = {
  user: null,
  tab: "siswa",
  siswaList: [],
  kelasList: [],
  kategoriList: [],
  excelParsed: null,
  level: "n5",
};
if (/^#\/?ssw/.test(location.hash)) state.tab = "ssw";

/* ===== Level JLPT yang sedang dikelola guru (pembatas tegas N5–N1) ===== */
const LV = ["n5","n4","n3","n2","n1"];
const LV_COLOR = { n5:"#10b981", n4:"#38bdf8", n3:"#8b5cf6", n2:"#f59e0b", n1:"#ef4444" };
state.lvl = "n5";
const lvOf = (k) => (k?.level || "n5").toLowerCase();
function levelTabsHtml(counts, what){
  return `
    <div class="lv-tabs">${LV.map(l => `<button class="lv-tab ${state.lvl===l?"on":""}" style="--c:${LV_COLOR[l]}" onclick="setLvl('${l}')">JLPT ${l.toUpperCase()}${counts ? `<span>${counts[l]||0}</span>` : ""}</button>`).join("")}</div>
    <div class="lv-band" style="--c:${LV_COLOR[state.lvl]}">Sedang mengelola <b>JLPT ${state.lvl.toUpperCase()}</b> — ${what} di bawah ini HANYA untuk level ${state.lvl.toUpperCase()}. Pilih tab lain untuk level berbeda.</div>`;
}
const lvChip = (l) => `<span class="lv-chip" style="--c:${LV_COLOR[l]||"#888"}">${(l||"n5").toUpperCase()}</span>`;
window.setLvl = (l) => { state.lvl = l; state.currentKategoriId = null; state.excelParsed = null; renderTab(); };

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
window.toast = toast;

function modal(html){
  document.getElementById("modal-body").innerHTML = html;
  document.getElementById("modal").classList.add("open");
}
window.closeModal = () => document.getElementById("modal").classList.remove("open");

/* ========== AUTH GATE ========== */
FB.onAuth(async (user, siswa) => {
  if (!user) {
    document.getElementById("root").innerHTML = renderLogin();
    return;
  }
  if (!FB.userIsGuru()) {
    document.getElementById("root").innerHTML = `
      <div class="login-box">
        <h2 style="color:var(--pink);">🚫 Akses Ditolak</h2>
        <p style="color:var(--gray); font-size:13px; margin:12px 0;">
          Akun ini bukan akun guru. Hubungi admin bila ini kesalahan.
        </p>
        <button class="btn" onclick="location.href='./index.html'">Kembali ke website</button>
        <button class="btn ghost" onclick="guruLogout()" style="margin-left:8px;">Keluar</button>
      </div>
    `;
    return;
  }
  state.user = user;
  document.getElementById("guru-nama").textContent = `👋 ${user.email}`;
  document.getElementById("btn-logout").style.display = "";
  renderApp();
  // Reveal Admin tab only for admins / developers.
  const navAdmin = document.getElementById("nav-admin");
  if (navAdmin) navAdmin.style.display = FB.userIsAdmin() ? "" : "none";
});

function renderLogin(){
  return `
    <div class="login-box">
      <h2 style="color:var(--pink); margin-bottom:12px;">🔐 Login Guru</h2>
      <p style="color:var(--gray); font-size:13px; margin-bottom:16px;">Hanya akun guru yang bisa masuk ke dashboard ini.</p>
      ${(() => { const d = FB.getLastAuthDenied ? FB.getLastAuthDenied() : null;
        return d ? `<div style="color:var(--red); font-size:13px; margin-bottom:12px;">${d === "disabled" ? "Akun ini dinonaktifkan." : "Akun ini belum terdaftar di sistem."}</div>` : ""; })()}
      <div class="form-row"><label>Email</label><input type="email" id="lg-email" style="flex:1;"/></div>
      <div class="form-row"><label>Password</label><input type="password" id="lg-pwd" style="flex:1;"/></div>
      <div id="lg-err" style="color:var(--red); font-size:12px; margin-bottom:10px;"></div>
      <button class="btn" onclick="guruLoginSubmit()">Masuk</button>
      <button class="btn ghost" onclick="location.href='./index.html'" style="margin-left:8px;">Kembali</button>
    </div>
  `;
}
window.guruLoginSubmit = async () => {
  const email = document.getElementById("lg-email").value.trim();
  const pwd = document.getElementById("lg-pwd").value;
  try {
    await FB.login(email, pwd);
  } catch(e){
    document.getElementById("lg-err").textContent = e.message;
  }
};
window.guruLogout = async () => {
  await FB.keluar();
  location.reload();
};

/* ========== MAIN APP ========== */
// Tombol/dropdown memakai atribut onclick/onchange (scope global), sedangkan
// script ini adalah ES module — jadi state & renderTab harus diekspos ke window.
window.state = state;
function renderApp(){
  document.getElementById("root").innerHTML = `
    <div class="layout">
      <div class="sidebar">
        <div class="nav-item ${state.tab==='siswa'?'active':''}" onclick="setTab('siswa')"><span class="ico">👥</span> Siswa</div>
        <div class="nav-item ${state.tab==='kategori'?'active':''}" onclick="setTab('kategori')"><span class="ico">📂</span> Paket Soal</div>
        <div class="nav-item ${state.tab==='soal'?'active':''}" onclick="setTab('soal')"><span class="ico">📝</span> Bank Soal</div>
        <div class="nav-item ${state.tab==='import'?'active':''}" onclick="setTab('import')"><span class="ico">📊</span> Import Excel</div>
        <div class="nav-item ${state.tab==='kpos'?'active':''}" onclick="setTab('kpos')"><span class="ico">🏷️</span> Kategori Kosakata</div>
        <div class="nav-item ${state.tab==='kelas'?'active':''}" onclick="setTab('kelas')"><span class="ico">🎓</span> Kelas</div>
        <div class="nav-item ${state.tab==='choukai'?'active':''}" onclick="setTab('choukai')"><span class="ico">🎧</span> Choukai</div>
        <div class="nav-item ${state.tab==='ssw'?'active':''}" onclick="setTab('ssw')"><span class="ico">🌏</span> SSW</div>
        <div class="nav-item ${state.tab==='laporan'?'active':''}" onclick="setTab('laporan')"><span class="ico">📈</span> Laporan</div>
        <div class="nav-item ${state.tab==='jlpt'?'active':''}" onclick="setTab('jlpt')"><span class="ico">🏯</span> Hasil JLPT</div>
        <div class="nav-item ${state.tab==='diagnostik'?'active':''}" onclick="setTab('diagnostik')"><span class="ico">🔧</span> Diagnostik</div>
        <div class="nav-item ${state.tab==='admin'?'active':''}" onclick="setTab('admin')" id="nav-admin" style="display:none;"><span class="ico">🛡️</span> Admin</div>
      </div>
      <div class="main" id="main"></div>
    </div>
  `;
  renderTab();
}
window.setTab = (t) => { state.tab = t; renderApp(); };

window.renderTab = (...a) => renderTab(...a);
async function renderTab(){
  const mount = document.getElementById("main");
  mount.innerHTML = '<div style="color:var(--gray);">Memuat…</div>';
  try {
    if (state.tab === "siswa") mount.innerHTML = await renderSiswaTab();
    else if (state.tab === "kategori") mount.innerHTML = await renderKategoriTab();
    else if (state.tab === "soal") mount.innerHTML = await renderSoalTab();
    else if (state.tab === "import") mount.innerHTML = await renderImportTab();
    else if (state.tab === "kelas") mount.innerHTML = await renderKelasTab();
    else if (state.tab === "kpos") mount.innerHTML = await renderKposTab();
    else if (state.tab === "choukai") mount.innerHTML = await renderChoukaiTab();
    else if (state.tab === "ssw") mount.innerHTML = await renderSswTab(FB, { toast, rerender: () => renderTab() });
    else if (state.tab === "laporan") mount.innerHTML = await renderLaporanTab();
    else if (state.tab === "jlpt") mount.innerHTML = await renderJlptTab();
    else if (state.tab === "diagnostik") mount.innerHTML = await renderDiagnostikTab();
    else if (state.tab === "admin")   mount.innerHTML = await renderAdminTab();
  } catch(e){ mount.innerHTML = `<div class="alert alert-err">Error: ${e.message}</div>`; console.error(e); }
}

/* ========== TAB: KATEGORI KOSAKATA (kelas kata) ========== */
const KPOS = [["KK","動詞 Kata Kerja"],["KB","名詞 Kata Benda"],["KSい","い形容詞"],["KSな","な形容詞"]];
state.kpos = state.kpos || { lv:"n5", q:"", page:0, rows:[], ov:{} };
async function renderKposTab(){
  const S = state.kpos;
  const base = await (await fetch(`./data/kosakata-${S.lv}.json`, { cache:"no-store" })).json();
  try { S.ov = await FB.getPosOverride(S.lv); } catch(e){ S.ov = {}; S.err = e.message; }
  base.forEach(it => { const t = S.ov[it.kata]; it._base = it.pos; if (t) { if (t[0] === "-") delete it.pos; else it.pos = t; } it._ov = !!t; });
  S.rows = base;
  return kposDraw();
}
function kposDraw(){
  const S = state.kpos, q = S.q.trim().toLowerCase(), PER = 50;
  const idx = S.rows.map((it,i)=>i).filter(i => !q || (S.rows[i].kata+S.rows[i].kana+S.rows[i].arti).toLowerCase().includes(q));
  const pages = Math.max(1, Math.ceil(idx.length / PER)); S.page = Math.min(S.page, pages-1);
  const cnt = k => S.rows.filter(it => (it.pos||[]).includes(k)).length;
  return `<div class="panel"><h2>🏷️ Kategori Kosakata</h2>
    <p style="color:var(--gray);font-size:13px;">Centang kelas kata tiap kosakata (boleh lebih dari satu). Perubahan langsung tampil di Materi &amp; Hafalan siswa. Data asli tidak diubah.</p>
    ${S.err ? `<div class="alert alert-err">Tidak bisa membaca/menulis override: ${escHtml(S.err)}. Publish rule <code>kosakata_pos</code> (lihat firestore.rules.example).</div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;">
      <select onchange="kposLv(this.value)">${["n5","n4","n3","n2","n1"].map(l=>`<option value="${l}" ${l===S.lv?"selected":""}>${l.toUpperCase()}</option>`).join("")}</select>
      <input id="kpos-q" placeholder="Cari kata / arti…" value="${escHtml(S.q)}" oninput="kposQ(this.value)" style="flex:1;min-width:160px;"/>
    </div>
    <div style="font-size:13px;color:var(--gray);margin-bottom:8px;">${KPOS.map(([k,l])=>`${l}: <b>${cnt(k)}</b>`).join(" · ")} · Total ${S.rows.length}</div>
    <div style="overflow:auto;"><table><thead><tr><th>#</th><th>Kata</th><th>Arti</th>${KPOS.map(([k,l])=>`<th>${l}</th>`).join("")}<th></th></tr></thead><tbody>
    ${idx.slice(S.page*PER,(S.page+1)*PER).map(i=>{const it=S.rows[i];return `<tr><td>${i+1}</td><td><b>${escHtml(it.kata)}</b><br><small>${escHtml(it.kana||"")}</small></td><td>${escHtml((it.arti||"").slice(0,60))}</td>
      ${KPOS.map(([k])=>`<td style="text-align:center;"><input type="checkbox" ${(it.pos||[]).includes(k)?"checked":""} onchange="kposSet(${i},'${k}',this.checked)"/></td>`).join("")}
      <td>${it._ov ? `<button class="btn ghost" onclick="kposReset(${i})" title="Kembalikan ke bawaan">↺</button>` : ""}</td></tr>`}).join("")}
    </tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center;">${Array.from({length:pages},(_,p)=>`<button class="btn ${p===S.page?"":"ghost"}" onclick="kposPage(${p})">${p+1}</button>`).join("")}</div></div>`;
}
const kposRedraw = () => { document.getElementById("main").innerHTML = kposDraw(); const q=document.getElementById("kpos-q"); if(q && document.activeElement!==q){} };
window.kposLv = (l) => { state.kpos.lv = l; state.kpos.page = 0; renderTab(); };
window.kposQ = (v) => { state.kpos.q = v; state.kpos.page = 0; kposRedraw(); const q=document.getElementById("kpos-q"); q.focus(); q.setSelectionRange(v.length, v.length); };
window.kposPage = (p) => { state.kpos.page = p; kposRedraw(); };
window.kposSet = async (i, k, on) => {
  const S = state.kpos, it = S.rows[i], set = new Set(it.pos || []);
  on ? set.add(k) : set.delete(k);
  const tags = KPOS.map(([x])=>x).filter(x => set.has(x));

const _materiLen = {};
async function _jumlahMateri(lvl){
  if (_materiLen[lvl]) return _materiLen[lvl];
  const len = async (f) => { try { const d = await fetch(`./data/${f}-${lvl}.json`).then(r => r.json()); return Array.isArray(d) ? d.length : (d.items?.length || 0); } catch(_) { return 0; } };
  const [kos, knj] = await Promise.all([len("kosakata"), len("kanji")]);
  return (_materiLen[lvl] = { kos, knj });
}
// Rumus SAMA dengan halaman Sylabus siswa: bagian = 50 item, % = dikuasai / jumlah item,
// bagian dianggap selesai bila ≥80%.
function _babSylabus(kartu, total, tipe){
  let bab = 0, selesai = 0; const bagian = [];
  for (let start = 1; start <= total; start += 50){
    const end = Math.min(start + 49, total); bab++;
    let m = 0; for (let no = start; no <= end; no++){ if (kartu[tipe[0] + ":" + no]?.mastered) m++; }
    const pct = Math.round(m / (end - start + 1) * 100);
    if (pct >= 80) selesai++;
    bagian.push({ start, end, pct });
  }
  return { bab, selesai, bagian };
}
const _chipBagian = (b) => `<span class="c ${b.pct >= 80 ? "ok" : b.pct > 0 ? "p1" : ""}">${b.start}–${b.end} <b>${b.pct}%</b></span>`;
async function statsRingkas(s){
  const [gami, nilai, srs] = await Promise.all([
    FB.getSiswaGami(s.uid).catch(() => ({})),
    FB.listNilaiOf(s.uid, 100).catch(() => []),
    FB.getSiswaSrsAll(s.uid).catch(() => ({})),
  ]);
  const g = Object.values(gami).filter(Boolean);
  const xp = g.reduce((a, x) => a + (x.xp || 0), 0);
  const lvk = Math.max(1, ...g.map(x => x.level_karakter || 1));
  const streak = Math.max(0, ...g.map(x => x.streak || 0));
  const rata = nilai.length ? Math.round(nilai.reduce((a, n) => a + (n.skor || 0), 0) / nilai.length) : null;
  const terakhir = nilai[0]?.tgl?.toDate ? nilai[0].tgl.toDate().toLocaleDateString("id-ID") : "";
  const levels = ["n5","n4","n3","n2","n1"].filter(l => s.aksesLevel?.[l] || Object.keys(srs[l] || {}).length);
  const syl = [];
  for (const l of levels){
    const kartu = srs[l] || {};
    const { kos, knj } = await _jumlahMateri(l);
    const a = _babSylabus(kartu, kos, "kosakata"), b = _babSylabus(kartu, knj, "kanji");
    const dikuasai = Object.values(kartu).filter(c => c?.mastered).length;
    const total = kos + knj;
    const pctLevel = total ? Math.round(dikuasai / total * 100) : 0;
    syl.push(`<details><summary>📘 Sylabus <b>${l.toUpperCase()}</b>: ${pctLevel}% · ${a.selesai + b.selesai}/${a.bab + b.bab} bagian selesai · ${dikuasai}/${total} item dikuasai</summary>
      <div class="syl-bagian"><span class="tp">📖 Kosakata</span>${a.bagian.map(_chipBagian).join("")}
        ${b.bagian.length ? `<span class="tp">🈷️ Kanji</span>${b.bagian.map(_chipBagian).join("")}` : ""}</div></details>`);
  }
  return `Lv <b>${lvk}</b> · <b>${xp}</b> XP · 🔥 ${streak} · Ujian <b>${nilai.length}×</b>${rata != null ? ` (rata-rata <b>${rata}</b>${terakhir ? `, terakhir ${terakhir}` : ""})` : ""}`
       + (syl.length ? syl.join("") : `<br>📘 Sylabus: belum ada level dibuka`);
}

const _statCache = {};
async function isiStatSlots(){

  if (!slots.length) return;
  const daftar = state.siswaList?.length ? state.siswaList : await FB.listSiswa().catch(() => []);
  const uids = [...new Set(slots.map(e => e.dataset.uid))];

      const uid = antri.shift();
      const s = daftar.find(x => x.uid === uid);
      const els = document.querySelectorAll(`.stat-slot[data-uid="${uid}"]`);
      if (!s){ els.forEach(e => e.textContent = ""); continue; }
      let html;
      const c = _statCache[uid];
      if (c && Date.now() - c.t < 120000 && c.akses === JSON.stringify(s.aksesLevel || {})) html = c.html;
      else {
        try { html = await statsRingkas(s); _statCache[uid] = { t: Date.now(), html, akses: JSON.stringify(s.aksesLevel || {}) }; }

      }
      document.querySelectorAll(`.stat-slot[data-uid="${uid}"]`).forEach(e => e.innerHTML = html);
    }
  };

window.prosesImportSiswa = async () => {
  const list = (state.importSiswa || []).filter(x => !x.err && !x.hasil);
  if (!list.length) return;
  if (!confirm(`Proses ${list.length} baris? Akun lama hanya diperbarui aksesnya; progres tidak disentuh.`)) return;
  const btn = document.getElementById("imp-siswa-go");
  let n = 0, gagal = 0;
  for (const x of list){
    if (btn){ btn.disabled = true; btn.textContent = `Membuat akun ${n + gagal + 1}/${list.length}…`; }
    try {
      const uid = x.update ? x.uid : await FB.buatAkunSiswa({ email:x.email, password:x.password, nama:x.nama, kelas:x.kelas, aksesLevel:x.aksesLevel, role:"student" });
      if (x.update && x.kelas) await FB.assignSiswaKeKelas([uid], x.kelas);
      for (const [slug, v] of Object.entries(x.ssw || {})) await FB.setAksesSswBidang(uid, slug, v);
      x.hasil = x.update ? "✓ Akses diperbarui" : "✓ Akun dibuat"; n++;
    } catch(e){ x.err = e.message || String(e); gagal++; }
    document.getElementById("imp-siswa-preview").innerHTML = renderPreviewSiswa();
  }
  toast(`Import selesai: ${n} baris diproses${gagal ? `, ${gagal} gagal` : ""}`);
  state.siswaList = await FB.listSiswa().catch(() => state.siswaList);
};

/* ==========================================================================
 * EXTRAKSI GAMBAR EMBEDDED DARI .XLSX
 * --------------------------------------------------------------------------
 * File .xlsx itu sebenarnya zip. Gambar yang di-insert lewat Excel ada di:
 *   xl/media/image1.png, image2.jpg, ...
 * Dan anchor-nya (baris/kolom mana) ada di:
 *   xl/drawings/drawing1.xml
 * Lalu drawing1.xml.rels ngomongin rId → media file.
 * Kita parse semua itu, convert tiap gambar jadi base64 data URL, lalu
 * map ke baris Excel berdasarkan anchor <xdr:from><xdr:row>N</xdr:row>.
 * ========================================================================== */
async function extractImagesFromXlsx(buf){
  // Hasil: Map<rowIndex0Based, base64DataUrl> — rowIndex sudah dikurangin 1 header.
  const byRow = new Map();
  try {
    const zip = await JSZip.loadAsync(buf);
    // 1) Temukan semua drawing XML (biasanya 1 per sheet)
    const drawingFiles = Object.keys(zip.files)
      .filter(f => /^xl\/drawings\/drawing\d+\.xml$/.test(f));
    if (!drawingFiles.length) return byRow;

    for (const dxml of drawingFiles){
      const num = dxml.match(/drawing(\d+)\.xml$/)[1];
      const relsPath = `xl/drawings/_rels/drawing${num}.xml.rels`;
      const relsText = zip.files[relsPath] ? await zip.files[relsPath].async("text") : "";
      // Parse relasi: <Relationship Id="rIdX" Target="../media/imageN.png"/>
      const relMap = {};
      relsText.replace(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g, (m, id, tgt) => {
        // Target biasanya "../media/imageN.png" — normalisasi ke xl/media/imageN.png
        const cleanTarget = tgt.replace(/^\.\.\//, "xl/");
        relMap[id] = cleanTarget;
      });

      // Parse drawing XML: cari setiap <xdr:twoCellAnchor> atau <xdr:oneCellAnchor>
      const drawText = await zip.files[dxml].async("text");
      // Setiap anchor berisi <xdr:from><xdr:row>N</xdr:row></xdr:from>
      // dan di dalamnya <a:blip r:embed="rIdX"/> untuk <xdr:pic>.
      const anchorRe = /<xdr:(?:two|one)CellAnchor[^>]*>([\s\S]*?)<\/xdr:(?:two|one)CellAnchor>/g;
      let m;
      while ((m = anchorRe.exec(drawText)) !== null){
        const body = m[1];
        const rowMatch = body.match(/<xdr:from>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
        const embedMatch = body.match(/<a:blip[^>]*r:embed="([^"]+)"/);
        if (!rowMatch || !embedMatch) continue;
        const rowZero = parseInt(rowMatch[1]); // 0-based (header=0, data mulai 1)
        const rId = embedMatch[1];
        const mediaPath = relMap[rId];
        if (!mediaPath || !zip.files[mediaPath]) continue;
        const file = zip.files[mediaPath];
        const ext = (mediaPath.match(/\.([a-z0-9]+)$/i) || ["", "png"])[1].toLowerCase();
        const mime = ext === "jpg" || ext === "jpeg" ? "image/jpeg"
                   : ext === "gif" ? "image/gif"
                   : ext === "webp" ? "image/webp"
                   : "image/png";
        // Baca binary → base64
        const b64 = await file.async("base64");
        const dataUrl = `data:${mime};base64,${b64}`;
        // Resize sebelum disimpan supaya tidak lebih dari ~500KB base64.
        const resized = await resizeImageDataUrl(dataUrl, 800, 600, 0.75);
        // dataIndex = rowZero - 1 karena header di baris 0, data mulai index 0
        const dataIdx = Math.max(0, rowZero - 1);
        // Kalau beberapa gambar di satu baris, pertahankan yang pertama.
        if (!byRow.has(dataIdx)) byRow.set(dataIdx, resized);
      }
    }
  } catch(e){
    console.warn("extractImagesFromXlsx gagal:", e);
  }
  return byRow;
}

// Resize gambar via canvas; kembalikan data URL baru yang lebih kecil.
async function resizeImageDataUrl(dataUrl, maxW, maxH, quality){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (w <= maxW && h <= maxH){
        // Sudah cukup kecil — tapi tetep rerender ke JPEG supaya ukuran kecil.
        // Kecuali gambar sangat kecil, langsung return original.
        if ((dataUrl.length * 3/4) < 100_000) return resolve(dataUrl);
      }
      const ratio = Math.min(maxW / w, maxH / h, 1);
      w = Math.round(w * ratio);
      h = Math.round(h * ratio);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      // Pakai JPEG supaya kompresi efisien
      try { resolve(c.toDataURL("image/jpeg", quality || 0.75)); }
      catch { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

window.handleFile = async (file) => {

  prev.innerHTML = '<div style="color:var(--gray);">Membaca file dan mengekstrak gambar…</div>';

    const wb = XLSX.read(buf, { type:"array" });

    validateAndPreview(rows, images);
  } catch(e){
    console.error(e);
    prev.innerHTML = `<div class="alert alert-err">Gagal baca file: ${e.message}</div>`;
  }
};

function validateAndPreview(rows, embeddedImages){
  const errors = [];
  const valid = [];
  rows.forEach((r, i) => {
    const lineNo = i + 2; // Excel row (header=1)
    const p = r.Pertanyaan || r.pertanyaan || r["Pertanyaan / Teks Soal"] || r["Pertanyaan/Teks Soal"];
    const a = r["Option A"] || r.Option_A || r.A || r.a;
    const b = r["Option B"] || r.Option_B || r.B || r.b;
    const c = r["Option C"] || r.Option_C || r.C || r.c;
    const d = r["Option D"] || r.Option_D || r.D || r.d;
    const k = (r["Kunci Jawaban"] || r.Kunci_Jawaban || r.Kunci || r.kunci || "").toString().toUpperCase().trim();
    if (!p) { errors.push(`Baris ${lineNo}: Pertanyaan kosong`); return; }
    if (!a||!b||!c||!d) { errors.push(`Baris ${lineNo}: Ada opsi kosong`); return; }
    if (!["A","B","C","D"].includes(k)) { errors.push(`Baris ${lineNo}: Kunci "${k}" tidak valid (harus A/B/C/D)`); return; }
    // Pembatas level: soal N4 tidak boleh masuk ke paket N5, dst.
    const lvBaris = (r.JLPT_Level || r["JLPT Level"] || "").toString().trim().toLowerCase();
    if (lvBaris && lvBaris !== state.lvl) { errors.push(`Baris ${lineNo}: JLPT_Level ${lvBaris.toUpperCase()} ≠ level yang dipilih (${state.lvl.toUpperCase()}) — tidak diimpor`); return; }
    // Hanya embedded image (data URL) — URL eksternal tidak didukung lagi
    const gambar = embeddedImages?.get(i) || "";
    valid.push({
      tipe: r["Tipe Soal"] || r.Tipe_Soal || "pilihan_ganda",
      jlpt_level: state.lvl,
      kategori_soal: r.Kategori || r["Kategori Soal"] || "",
      pertanyaan: String(p),
      opsi: [String(a), String(b), String(c), String(d)],
      kunci: "ABCD".indexOf(k),
      // Terima kedua ejaan: "Pembahasan" (preferred) atau "Penjelasan"
      pembahasan_id: r.Pembahasan || r.Penjelasan || r["Pembahasan Indonesia"] || r.Pembahasan_Indonesia || "",
      pembahasan_jp: r["Pembahasan Jepang"] || r.Pembahasan_Jepang || "",
      materi: r.Materi || r.Bagian || "",
      kesulitan: r["Tingkat Kesulitan"] || r.Tingkat_Kesulitan || "Medium",
      poin: parseInt(r.Poin) || 1,
      urutan: i + 1,  // Urutan sesuai posisi di Excel — tidak diacak
      gambar,
    });
  });
  state.excelParsed = valid;
  const withImg = valid.filter(v => v.gambar).length;
  document.getElementById("imp-preview").innerHTML = `
    <h3>Preview</h3>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin:8px 0 12px;">
      <div class="panel" style="padding:10px; text-align:center; margin:0;">
        <div style="font-size:22px; font-weight:800; color:var(--white);">${rows.length}</div>
        <div style="font-size:11px; color:var(--gray);">Total baris Excel</div>
      </div>
      <div class="panel" style="padding:10px; text-align:center; margin:0;">
        <div style="font-size:22px; font-weight:800; color:var(--green);">${valid.length}</div>
        <div style="font-size:11px; color:var(--gray);">Valid</div>
      </div>
      <div class="panel" style="padding:10px; text-align:center; margin:0;">
        <div style="font-size:22px; font-weight:800; color:var(--red);">${errors.length}</div>
        <div style="font-size:11px; color:var(--gray);">Bermasalah</div>
      </div>
      <div class="panel" style="padding:10px; text-align:center; margin:0;">
        <div style="font-size:22px; font-weight:800; color:var(--gold);">${withImg}</div>
        <div style="font-size:11px; color:var(--gray);">Dengan gambar</div>
      </div>
    </div>
    ${errors.length ? `<div class="alert alert-err"><b>⚠️ ${errors.length} baris bermasalah (akan di-skip):</b><br>${errors.slice(0,20).join("<br>")}${errors.length>20?"<br>…":""}</div>` : (valid.length ? '<div class="alert alert-ok">✓ Semua soal valid</div>' : '')}
    ${valid.length ? `
      <div class="table-wrap" style="max-height:500px; overflow:auto;">
        <table>
          <thead><tr><th>#</th><th>Gbr</th><th>Pertanyaan</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Kunci</th><th>Materi</th></tr></thead>
          <tbody>
            ${valid.slice(0,100).map((s,i) => `
              <tr>
                <td>${i+1}</td>
                <td>${s.gambar ? `<img src="${s.gambar}" style="max-height:48px; max-width:72px; border-radius:4px;"/>` : '<span style="color:var(--gray-dim);">-</span>'}</td>
                <td style="max-width:300px; white-space:normal; font-family:var(--font-jp);">${escHtml(s.pertanyaan.slice(0,120))}</td>
                <td>${escHtml(s.opsi[0].slice(0,18))}</td>
                <td>${escHtml(s.opsi[1].slice(0,18))}</td>
                <td>${escHtml(s.opsi[2].slice(0,18))}</td>
                <td>${escHtml(s.opsi[3].slice(0,18))}</td>
                <td><b>${String.fromCharCode(65+s.kunci)}</b></td>
                <td>${escHtml((s.materi||"").slice(0,20))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      ${valid.length > 100 ? `<p style="color:var(--gray); font-size:12px; margin-top:6px;">Menampilkan 100 baris pertama. Semua ${valid.length} akan diimpor.</p>` : ""}
      <div style="margin-top:12px;">
        <button class="btn gold" onclick="konfirmasiImport()">✓ Konfirmasi &amp; Import ${valid.length} Soal</button>
        <button class="btn ghost" onclick="state.excelParsed=null; renderTab()">Batal</button>
      </div>
    ` : ''}
  `;
}
function escHtml(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
window.escHtml = escHtml;

window.studentProfile = async (uid) => {
  const siswa = (state.siswaList||[]).find(s => s.uid === uid);
  if (!siswa) return toast("Siswa tidak ditemukan");
  modal(`<div style="text-align:center; padding:20px;">Memuat profil...</div>`);
  const [gami, nilai, mastery] = await Promise.all([
    FB.getSiswaGami(uid),
    FB.listNilaiOf(uid, 20).catch(()=>[]),
    FB.getSiswaMasteryCounts(uid).catch(()=>({})),
  ]);

  // Daily / Weekly / Monthly buckets from exam history
  const now = Date.now();
  const day = 86400000;
  let daily=0, weekly=0, monthly=0, totalSkor=0, totalLulus=0;
  nilai.forEach(n => {
    const ts = n.tgl?.toMillis ? n.tgl.toMillis() : 0;
    if (!ts) return;
    if (now - ts <= 1*day) daily++;
    if (now - ts <= 7*day) weekly++;
    if (now - ts <= 30*day) monthly++;
    totalSkor += n.skor || 0;
    if ((n.skor||0) >= 60) totalLulus++;
  });
  const avgSkor = nilai.length ? Math.round(totalSkor/nilai.length) : 0;

  const levelRow = ["n5","n4","n3","n2","n1"].map(l => {
    const g = gami[l] || {};
    const m = mastery[l] || {mastered:0,total:0};
    const akses = siswa.aksesLevel?.[l];
    return `<tr>
      <td><b>${l.toUpperCase()}</b></td>
      <td>${akses?'<span style="color:var(--green);">✓ Terbuka</span>':'<span style="color:var(--gray-dim);">🔒 Kunci</span>'}</td>
      <td>Lv ${g.level_karakter||1}</td>
      <td>${g.xp||0}</td>
      <td>${g.koin||0}</td>
      <td>${g.streak||0}</td>
      <td>${m.mastered} / ${m.total}</td>
    </tr>`;
  }).join("");

  const nilaiRow = nilai.slice(0, 10).map(n => {
    const dt = n.tgl?.toDate ? n.tgl.toDate().toLocaleDateString("id-ID") : "-";
    return `<tr><td>${dt}</td><td>${n.skor||0}</td><td>${n.benar||0}/${(n.benar||0)+(n.salah||0)}</td><td>${Math.floor((n.waktu||0)/60)}m ${(n.waktu||0)%60}s</td></tr>`;
  }).join("") || '<tr><td colspan="4" style="color:var(--gray); text-align:center;">Belum ada ujian</td></tr>';

  modal(`
    <h2 style="color:var(--pink);">📊 Profil: ${siswa.nama||siswa.email}</h2>
    <p style="color:var(--gray); font-size:12px;">${siswa.email} ${siswa.kelas?`· Kelas ${siswa.kelas}`:""}</p>

    <h3 style="margin-top:14px;">Aktivitas Ujian</h3>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px;">
      <div class="panel" style="text-align:center; padding:12px;"><div style="font-size:22px; font-weight:800; color:var(--pink);">${daily}</div><div style="font-size:11px; color:var(--gray);">Hari ini</div></div>
      <div class="panel" style="text-align:center; padding:12px;"><div style="font-size:22px; font-weight:800; color:var(--pink);">${weekly}</div><div style="font-size:11px; color:var(--gray);">7 hari</div></div>
      <div class="panel" style="text-align:center; padding:12px;"><div style="font-size:22px; font-weight:800; color:var(--pink);">${monthly}</div><div style="font-size:11px; color:var(--gray);">30 hari</div></div>
      <div class="panel" style="text-align:center; padding:12px;"><div style="font-size:22px; font-weight:800; color:var(--gold);">${avgSkor}</div><div style="font-size:11px; color:var(--gray);">Rata-rata nilai</div></div>
    </div>

    <h3 style="margin-top:14px;">Progres per Level</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>JLPT</th><th>Akses</th><th>Lv</th><th>XP</th><th>Koin</th><th>Streak</th><th>Mastered</th></tr></thead>
        <tbody>${levelRow}</tbody>
      </table>
    </div>

    <h3 style="margin-top:14px;">10 Ujian Terakhir</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tanggal</th><th>Nilai</th><th>Benar</th><th>Durasi</th></tr></thead>
        <tbody>${nilaiRow}</tbody>
      </table>
    </div>

    <div style="margin-top:14px; display:flex; justify-content:flex-end;">
      <button class="btn ghost" onclick="closeModal()">Tutup</button>
    </div>
  `);
};

window.exportLaporan = async () => {
  const siswa = await FB.listSiswa();
  const rows = [];
  for (const s of siswa) {
    const g = await FB.getSiswaGami(s.uid).catch(()=>({}));
    const row = { Nama:s.nama||"", Email:s.email, Kelas:s.kelas||"" };

    rows.push(row);

  const ws = XLSX.utils.json_to_sheet(rows);

/* ========== TAB: HASIL JLPT CENTER ==========
 * Membaca siswa/{uid}/jlpt_hasil untuk setiap siswa (rules: hanya guru).

 * dan jawaban per nomor (kunci diambil dari ./jlpt/{file}).
 */
state.jx = state.jx || { lv: "", nama: "", dari: "", sampai: "", data: null };
const _jxFmt = (sec) => { sec = Math.round(sec || 0); return `${Math.floor(sec/60)}m ${sec%60}s`; };
const _jxMs = (h) => h.selesai || (h.tgl?.seconds ? h.tgl.seconds * 1000 : 0);
const _jxKat = { kanji:"Kanji", kotoba:"Kotoba", bunpou:"Bunpou", dokkai:"Dokkai", choukai:"Choukai" };
function _jxLemah(h){
  const r = Object.entries(h.perKategori || {}).filter(([,v]) => v.total).map(([k,v]) => [k, v.benar / v.total]);
  r.sort((a,b) => a[1]-b[1]);
  return r.length ? `${_jxKat[r[0][0]] || r[0][0]} (${Math.round(r[0][1]*100)}%)` : "-";
}
async function renderJlptTab(){
  if (!state.jx.data){
    const siswa = await FB.listSiswa();
    const all = [];
    for (const s of siswa){
      try { (await FB.listHasilJLPTOf(s.uid, 200)).forEach(h => all.push({ ...h, _uid: s.uid, _nama: s.nama || h.nama || s.email, _kelas: s.kelas || "" })); }
      catch(e){ console.warn("jlpt hasil", s.uid, e.message); }
    }
    all.sort((a,b) => _jxMs(b) - _jxMs(a));
    state.jx.data = all;
  }
  const f = state.jx;
  const dari = f.dari ? new Date(f.dari + "T00:00:00").getTime() : 0;
  const sampai = f.sampai ? new Date(f.sampai + "T23:59:59").getTime() : Infinity;
  const rows = f.data.filter(h => (!f.lv || h.lv === f.lv)
    && (!f.nama || (h._nama || "").toLowerCase().includes(f.nama.toLowerCase()))
    && _jxMs(h) >= dari && _jxMs(h) <= sampai);
  const rata = rows.length ? Math.round(rows.reduce((a,h) => a + (h.skor||0), 0) / rows.length) : 0;
  return `
    <div class="panel">
      <h2>🏯 Hasil JLPT Center</h2>
      <p style="color:var(--gray); font-size:13px;">Hasil Full Exam & latihan Kanji/Kotoba/Bunpou dari semua siswa. Nilai = estimasi latihan, bukan nilai resmi JLPT.</p>
      <div class="form-row" style="flex-wrap:wrap; gap:8px;">
        <select onchange="state.jx.lv=this.value; renderTab()"><option value="">Semua level</option>${LV.map(l => `<option value="${l}" ${f.lv===l?"selected":""}>JLPT ${l.toUpperCase()}</option>`).join("")}</select>
        <input placeholder="Cari nama siswa" value="${f.nama}" onchange="state.jx.nama=this.value; renderTab()"/>
        <label style="font-size:12px;">Dari <input type="date" value="${f.dari}" onchange="state.jx.dari=this.value; renderTab()"/></label>
        <label style="font-size:12px;">Sampai <input type="date" value="${f.sampai}" onchange="state.jx.sampai=this.value; renderTab()"/></label>
        <button class="btn ghost" onclick="state.jx.data=null; renderTab()">↻ Muat ulang</button>
        <button class="btn ghost" onclick="exportJlpt()">📤 Export Excel</button>
      </div>
      <div style="margin:8px 0; color:var(--gray); font-size:13px;">${rows.length} hasil · rata-rata ${rata}%</div>
      <div class="table-wrap" style="max-height:65vh; overflow:auto;">
        <table>
          <thead><tr><th>Tanggal</th><th>Siswa</th><th>Kelas</th><th>Level</th><th>Paket</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>Durasi</th><th>Status</th><th>Kategori lemah</th></tr></thead>
          <tbody>${rows.map(h => `<tr style="cursor:pointer;" onclick="jlptDetail('${h._uid}','${h.id}')">
            <td>${new Date(_jxMs(h)).toLocaleString("id-ID", { dateStyle:"short", timeStyle:"short" })}</td>
            <td>${h._nama}</td><td>${h._kelas}</td><td>${lvChip(h.lv)}</td><td>${h.judul}</td>
            <td><b>${h.skor}%</b></td><td>${h.benar}</td><td>${h.salah}</td><td>${h.kosong}</td>
            <td>${_jxFmt(h.durasiAktual)} / ${Math.round((h.durasiDipilih||0)/60)}m</td><td>${h.status === "timeout" ? "⏰ timeout" : "✔ selesai"}</td>
            <td>${_jxLemah(h)}</td></tr>`).join("") || `<tr><td colspan="12" style="text-align:center; color:var(--gray);">Belum ada hasil.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}
window.jlptDetail = async (uid, id) => {
  const h = (state.jx.data || []).find(x => x._uid === uid && x.id === id);
  if (!h) return;
  let pkg = null;
  try { pkg = await (await fetch("./jlpt/" + h.file)).json(); } catch(e){}
  const flat = []; (pkg?.sections || []).forEach(s => s.items.forEach(q => flat.push({ ...q, _m: s.mondai, _t: s.tipe_jp })));
  const kat = Object.entries(h.perKategori || {}).map(([k,v]) => `<tr><td>${_jxKat[k]||k}</td><td>${v.benar}/${v.total}</td><td>${v.total ? Math.round(v.benar/v.total*100) : 0}%</td></tr>`).join("");
  const L = (q, i) => i < 0 ? "—" : (q?.cat === "choukai" ? String(i+1) : "ABCD"[i]);
  const per = (h.jawaban || []).map((a, i) => {
    const q = flat[i]; const ok = q && a === q.ans;
    return `<tr><td>${i+1}</td><td>問題${q?._m ?? "?"} ${q?._t ?? ""}</td><td>${L(q, a)}</td><td>${q ? L(q, q.ans) : "?"}</td>
      <td style="color:${a < 0 ? "var(--gray)" : ok ? "var(--green)" : "var(--red)"}">${a < 0 ? "kosong" : ok ? "✓" : "✗"}</td><td>${h.tandai?.[i] ? "🚩" : ""}</td></tr>`;
  }).join("");
  modal(`<h3>${h._nama} — ${h.judul}</h3>
    <p style="font-size:13px; color:var(--gray);">Mulai ${new Date(h.mulai).toLocaleString("id-ID")} · Selesai ${new Date(h.selesai).toLocaleString("id-ID")} · ${h.status}</p>
    <p><b>${h.skor}%</b> · benar ${h.benar} · salah ${h.salah} · kosong ${h.kosong} dari ${h.total} · durasi ${_jxFmt(h.durasiAktual)} (dipilih ${Math.round(h.durasiDipilih/60)} menit)</p>
    <div class="table-wrap"><table><thead><tr><th>Kategori</th><th>Benar</th><th>%</th></tr></thead><tbody>${kat}</tbody></table></div>
    <h4 style="margin-top:12px;">Jawaban per nomor</h4>
    <div class="table-wrap" style="max-height:45vh; overflow:auto;"><table><thead><tr><th>No</th><th>Mondai</th><th>Jawaban</th><th>Kunci</th><th></th><th></th></tr></thead><tbody>${per}</tbody></table></div>
    <button class="btn ghost" style="margin-top:10px;" onclick="closeModal()">Tutup</button>`);
};
window.exportJlpt = () => {
  const rows = (state.jx.data || []).map(h => ({
    Tanggal: new Date(_jxMs(h)).toLocaleString("id-ID"), Siswa: h._nama, Kelas: h._kelas, Level: h.lv.toUpperCase(), Paket: h.judul,
    Nilai: h.skor, Benar: h.benar, Salah: h.salah, Kosong: h.kosong, Total: h.total,
    "Durasi (detik)": h.durasiAktual, "Waktu dipilih (menit)": Math.round((h.durasiDipilih||0)/60), Status: h.status,
    ...Object.fromEntries(Object.entries(h.perKategori || {}).map(([k,v]) => [`${_jxKat[k]||k} %`, v.total ? Math.round(v.benar/v.total*100) : 0])),
  }));
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hasil JLPT"); XLSX.writeFile(wb, `hasil-jlpt-${Date.now()}.xlsx`);
};

window.jalankanDiagnosa = async () => {
  const mount = document.getElementById("diag-result");
  mount.innerHTML = '<div style="color:var(--gray);">Menjalankan 5 tes…</div>';
  const results = await FB.diagnosaRules();
  const row = (r) => `
    <tr>
      <td><code>${r.op||""}</code></td>
      <td><code style="font-size:11px;">${r.path||"-"}</code></td>
      <td>${r.ok
        ? '<span class="chip on">✓ OK</span>'
        : `<span class="chip" style="background:var(--red); color:white;">✗ BLOCK</span>`}</td>
      <td style="color:${r.ok?'var(--gray)':'var(--red)'}; font-size:12px;">${r.error||"-"}</td>
    </tr>`;
  const anyBlocked = results.some(r => !r.ok);
  mount.innerHTML = `
    ${anyBlocked ? `
      <div class="alert alert-err">
        <b>⚠️ Ada rule yang block.</b> Deploy ulang <code>firestore.rules.example</code>
        di Firebase Console (lihat petunjuk di atas), lalu klik "Jalankan Diagnosa" lagi.
      </div>` : `
      <div class="alert alert-ok">
        <b>✓ Semua rule OK.</b> Kalau akun baru masih tidak muncul, cek bahwa domain
        <code>${location.hostname}</code> ada di <b>Authorized domains</b> Firebase Auth.
      </div>`}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Operasi</th><th>Path</th><th>Status</th><th>Detail</th></tr></thead>
        <tbody>${results.map(row).join("")}</tbody>
      </table>
    </div>
  `;
};

/* ========== TAB: ADMIN (Part 17) ========== */
async function renderAdminTab(){
  if (!FB.userIsAdmin()){
    return `<div class="panel"><h2>🛡️ Admin</h2>
      <div class="empty">🚫 Kamu bukan admin. Minta developer untuk promote role-mu.</div></div>`;
  }
  const akun = await FB.listSemuaAkun();
  const isDev = FB.userIsDeveloper();

  const roleBadge = (r) => {
    const colors = { developer:"#8b5cf6", admin:"#ef6a9a", guru:"#22d3ee", student:"#b9bfd9" };
    const r2 = r || "student";
    return `<span style="padding:2px 8px; border-radius:999px; background:${colors[r2]}22; color:${colors[r2]}; font-size:11px; font-weight:800;">${r2.toUpperCase()}</span>`;
  };

  const rows = akun.map(a => {
    const unlim = !!(a.permissions?.unlimited_coins);
    return `
      <tr>
        <td><b>${a.nama||"-"}</b></td>
        <td>${a.email}</td>
        <td>${roleBadge(a.role)}</td>
        <td>
          <select onchange="setAkunRole('${a.uid}', this.value)">
            ${["student","guru","admin","developer"].map(r => {
              const canSet = r==="student" || r==="guru" || isDev;
              return `<option value="${r}" ${a.role===r?"selected":""} ${canSet?"":"disabled"}>${r}</option>`;
            }).join("")}
          </select>
        </td>
        <td>
          ${isDev ? `<label style="cursor:pointer;">
            <input type="checkbox" ${unlim?"checked":""} onchange="toggleUnlimited('${a.uid}', this.checked)"/> ∞ coins
          </label>` : (unlim ? "∞" : "-")}
        </td>
      </tr>`;
  }).join("");

  return `
    <div class="panel">
      <h2>🛡️ Admin Dashboard</h2>
      <p style="color:var(--gray); font-size:12px;">
        Role-based access control. Developer bisa set role apa pun termasuk admin/developer.
        Admin hanya bisa set student/guru. Hanya developer bisa memberi permission ∞ coins.
      </p>
      <div class="table-wrap" style="margin-top:12px;">
        <table>
          <thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Set role</th><th>Unlimited</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}
window.setAkunRole = async (uid, role) => {
  try {
    await FB.setRole(uid, role);
    toast(`✓ Role diubah ke ${role}`);
    renderTab();
  } catch(e){ toast("❌ " + e.message); renderTab(); }
};
window.toggleUnlimited = async (uid, on) => {
  try {
    await FB.setUnlimitedCoins(uid, on);
    toast(on ? "∞ coins aktif" : "∞ coins off");
  } catch(e){ toast("❌ " + e.message); renderTab(); }
};

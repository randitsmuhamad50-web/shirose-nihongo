name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static assets
        run: |
          echo "=== Checking required files ==="
          test -f index.html || { echo "❌ index.html missing"; exit 1; }
          test -f teacher.html || { echo "❌ teacher.html missing"; exit 1; }
          test -f manifest.webmanifest || { echo "❌ manifest missing"; exit 1; }
          test -f sw.js || { echo "❌ service worker missing"; exit 1; }
          test -d data || { echo "❌ data folder missing"; exit 1; }
          test -d js || { echo "❌ js folder missing"; exit 1; }
          test -d choukai || { echo "❌ choukai folder missing"; exit 1; }
          echo "✅ All required files present"
          echo "=== File count ==="
          find . -type f -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./backup/*" | wc -l

      - name: Cek secret Netlify
        id: nl
        env:
          T: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          S: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$S" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID belum diisi. Deploy Netlify DILEWATI (situs Netlify tidak ikut terbarui). GitHub Pages tidak terpengaruh."
          fi

      - name: Deploy to Netlify
        if: steps.nl.outputs.ok == 'true'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: '.'
          functions-dir: 'netlify/functions'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions: ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5


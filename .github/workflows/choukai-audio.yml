name: Choukai audio (VOICEVOX)

# Membuat MP3 Choukai untuk paket 2–10 dengan VOICEVOX ENGINE (Docker, CPU).
# Narator = 青山龍星 (aoyama); pembicara = 6 karakter lain sesuai choukai/paket/*.json.
# Jalan otomatis setiap ada perubahan di choukai/paket/, atau manual dari tab Actions.
on:
  push:
    branches: [main]
    paths: ["choukai/paket/**"]
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Hapus & buat ulang audio paket yang sudah ada (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: choukai-audio
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        level: [n5, n4, n3, n2, n1]
        paket: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4
      - name: Cek paket
        id: chk
        run: |
          if [ -f "choukai/paket/${{ matrix.level }}-p${{ matrix.paket }}.json" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Hapus audio lama (regenerate)
        if: steps.chk.outputs.ok == '1' && github.event.inputs.regenerate == 'true'
        run: rm -rf "audio/choukai/${{ matrix.level }}/p${{ matrix.paket }}"
      - name: Pasang ffmpeg
        if: steps.chk.outputs.ok == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tunggu VOICEVOX siap
        if: steps.chk.outputs.ok == '1'
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && exit 0; sleep 5; done; exit 1
      - name: Buat audio
        if: steps.chk.outputs.ok == '1'
        run: python3 tools/vv_build.py choukai ${{ matrix.level }} --paket ${{ matrix.paket }}
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.ok == '1'
        with:
          name: audio-${{ matrix.level }}-p${{ matrix.paket }}
          path: audio/choukai/${{ matrix.level }}/p${{ matrix.paket }}/
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: synth
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: _audio
          pattern: audio-*
      - name: Salin & commit
        run: |
          shopt -s nullglob
          for d in _audio/audio-*; do
            n=${d#_audio/audio-}; lvl=${n%%-*}; pk=${n##*-}
            mkdir -p "audio/choukai/$lvl/$pk"
            cp -f "$d"/*.mp3 "audio/choukai/$lvl/$pk/" 2>/dev/null || true
          done
          rm -rf _audio
          git config user.name "shirose-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/choukai
          if git diff --cached --quiet; then echo "Tidak ada audio baru"; exit 0; fi
          git commit -m "audio(choukai): voice pack VOICEVOX paket 2–10"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
